<script>

/* ============================= CONFIGURATION SUPABASE ============================= */
const SUPABASE_URL = "https://hrnwadoceetyscndbkgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Smcvfpk46VOcV5EBJAScuQ_kgv-KRw4";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Identifiant Supabase (auth.users.id) du Maître du Jeu
const MJ_UUID = "17b03a0a-f866-4d92-b668-f8c70884b8b1";

let currentUser = null;
let isSignUpMode = false;
let profiles = [];        // liste des comptes joueurs enregistrés {id,email}
let gameChannel = null;   // canal Realtime Supabase

/* ============================= PERMISSIONS ============================= */
function isMJ(){ return !!currentUser && currentUser.id === MJ_UUID; }
function isOwner(charId){ const c=char(charId); return !!c && !!currentUser && c.ownerId===currentUser.id; }
function canControlChar(charId){ return isMJ() || isOwner(charId); }
function canControlInstance(instId){ const i=inst(instId); return i ? canControlChar(i.charId) : false; }

/* ============================= AUTH SUPABASE ============================= */
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('authOverlay').style.display = 'none';
    initApp();
  }
});

function toggleAuthMode(signUp) {
  isSignUpMode = signUp;
  document.getElementById('authDesc').textContent = signUp ? "Créez votre compte de joueur" : "Connectez-vous pour rejoindre la table de jeu";
  document.getElementById('authBtn').textContent = signUp ? "S'inscrire" : "Se connecter";
  document.getElementById('authToggleMode').innerHTML = signUp ?
    `Déjà un compte ? <button onclick="toggleAuthMode(false)">Se connecter</button>` :
    `Pas de compte ? <button onclick="toggleAuthMode(true)">Créer un compte</button>`;
}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { toast("⚠️ Veuillez remplir tous les champs."); return; }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = "Chargement...";

  if (isSignUpMode) {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; toggleAuthMode(true); return; }
    toast("✅ Compte créé ! Connexion en cours...");
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; btn.textContent = isSignUpMode ? "S'inscrire" : "Se connecter"; return; }

  currentUser = data.user;
  document.getElementById('authOverlay').style.display = 'none';
  await initApp();
}

/* ---- Sauvegarde : l'UI et l'undo restent instantanés (local uniquement), l'écriture réseau
   Supabase est groupée (debounce) pour ne jamais bloquer/désynchroniser en cas d'actions rapides.
   Chaque état porte un numéro de version (_rev) : un retour Realtime plus vieux que notre état
   local est ignoré, ce qui supprime le rubberbanding en cas de réponses réseau en désordre. ---- */
let saveDebounceTimer=null;
let saveInFlight=false;
let saveQueued=false;
function bumpRev(){ S._rev=(S._rev||0)+1; }
async function flushSave(){
  clearTimeout(saveDebounceTimer); saveDebounceTimer=null;
  if(saveInFlight){ saveQueued=true; return; }
  saveInFlight=true;
  const snapshot=S;
  try{
    const { error } = await supabaseClient.from('game_state').upsert({id:'main',data:snapshot,updated_at:new Date().toISOString()});
    if(error) console.error('persistState', error);
  }catch(e){ console.error('persistState', e); }
  saveInFlight=false;
  if(saveQueued){ saveQueued=false; flushSave(); }
}
async function persistState(){
  bumpRev(); pushUndoCheckpoint();
  localStorage.setItem('arcanum-vtt', JSON.stringify(S));
  await flushSave();
}
/* saveState() : appelée partout après une action de jeu. Met à jour l'undo + le stockage local
   instantanément, puis regroupe l'envoi Supabase (350ms après la dernière action) au lieu d'en
   envoyer un par action. saveState(true) force un envoi immédiat (bouton "Sauvegarder"). */
function saveState(immediate){
  bumpRev(); pushUndoCheckpoint();
  localStorage.setItem('arcanum-vtt', JSON.stringify(S));
  if(immediate){
    flushSave();
    toast('Sauvegarde effectuée');
  }else{
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer=setTimeout(flushSave,350);
  }
}
window.addEventListener('beforeunload',()=>{ if(saveDebounceTimer)flushSave(); });
let lastTurnCombatant=null;
function syncTurnSelection(){
  if(!S.combat.active){ lastTurnCombatant=null; return; }
  const currentId=S.combat.order[S.combat.turn];
  if(currentId && currentId!==lastTurnCombatant){
    lastTurnCombatant=currentId;
    if(canControlInstance(currentId)) selectedToken=currentId;
  }
}
function subscribeRealtime(){
  if(gameChannel){ supabaseClient.removeChannel(gameChannel); gameChannel=null; }
  gameChannel=supabaseClient.channel('game_state_sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'game_state',filter:'id=eq.main'},payload=>{
      if(payload.new && payload.new.data){
        const incoming=payload.new.data;
        // Écho de notre propre sauvegarde (ou réponse réseau en retard) : notre état local est déjà plus récent, on ignore.
        if((incoming._rev||0)<(S._rev||0))return;
        S=incoming;
        normalizeState();
        syncTurnSelection();
        render();
      }
    })
    .on('broadcast',{event:'fx'},payload=>{
      const d=payload.payload||{};
      const a=S.abilities.find(x=>x.id===d.abilityId);
      const casterInst=inst(d.casterId);
      if(!a||!casterInst)return;
      const targets=(d.targetIds||[]).map(id=>inst(id)).filter(Boolean);
      if(currentPage==='table')playAbilityFX(a,casterInst,targets,d.start);
    })
    .on('broadcast',{event:'hud'},payload=>{
      const d=payload.payload||{};
      showHudFloating(d.instId,d.deltas);
    })
    .on('broadcast',{event:'crit'},payload=>{
      const d=payload.payload||{};
      showCriticalPopup(d.instId,d.key);
    })
    .on('broadcast',{event:'oppfx'},payload=>{
      const d=payload.payload||{};
      if(currentPage==='table')playOppImpactAt(d.targetId,d.image,d.frames,d.rows,d.fps);
    })
    .subscribe();
}

  if(!localStorage.getItem('narbudr-hl-colors'))localStorage.setItem('narbudr-hl-colors',JSON.stringify(['#fff59d','#a5d6a7','#90caf9','#f48fb1']));
  if(!localStorage.getItem('narbudr-font-colors'))localStorage.setItem('narbudr-font-colors',JSON.stringify(['#ffffff','#ef6262','#e7b85c']));
}
seedPaletteDefaults();
function rteColorPaletteHtml(id,kind){
  const key='narbudr-'+kind+'-colors';
  const colors=JSON.parse(localStorage.getItem(key)||'[]');
  return `<span id="${id}_${kind}pal" class="rte-palette">${colors.map(c=>`<button type="button" class="rte-swatch" style="background:${c}" onclick="rteApplyPaletteColor('${id}','${kind}','${c}')" oncontextmenu="event.preventDefault();rteRemovePaletteColor('${id}','${kind}','${c}')" title="Clic : appliquer · Clic droit : retirer des favoris"></button>`).join('')}</span>`;
}
function rteApplyPaletteColor(id,kind,color){ if(kind==='font')rteExec(id,'foreColor',color); else rteHighlight(id,color); }
function rteRefreshPalette(id,kind){ const span=document.getElementById(id+'_'+kind+'pal'); if(span)span.outerHTML=rteColorPaletteHtml(id,kind); }
function rteSavePaletteColor(id,kind,color){
  const key='narbudr-'+kind+'-colors';
  let colors=JSON.parse(localStorage.getItem(key)||'[]');
  if(!colors.includes(color)){colors.push(color); if(colors.length>14)colors.shift(); localStorage.setItem(key,JSON.stringify(colors));}
  rteRefreshPalette(id,kind);
}
function rteRemovePaletteColor(id,kind,color){
  const key='narbudr-'+kind+'-colors';
  localStorage.setItem(key,JSON.stringify(JSON.parse(localStorage.getItem(key)||'[]').filter(c=>c!==color)));
  rteRefreshPalette(id,kind);
}
function rteFindTable(id){
  const content=document.getElementById(id); if(!content)return null;
  const sel=window.getSelection();
  if(sel&&sel.anchorNode&&content.contains(sel.anchorNode)){
    const el=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
    const t=el?.closest?.('table');
    if(t)return t;
  }
  return content.querySelector('table.rte-table-selected')||content.querySelector('table');
}
function rteAddRow(id){
  const table=rteFindTable(id); if(!table){toast('⚠️ Clique dans un tableau d’abord.');return;}
  const cols=table.rows[0]?table.rows[0].cells.length:1;
  const tr=table.insertRow(-1);
  for(let i=0;i<cols;i++){const td=tr.insertCell(-1);td.innerHTML='&nbsp;';}
}
function rteAddCol(id){
  const table=rteFindTable(id); if(!table){toast('⚠️ Clique dans un tableau d’abord.');return;}
  [...table.rows].forEach(tr=>{const td=tr.insertCell(-1);td.innerHTML='&nbsp;';});
}
function rteDeleteTable(id){
  const table=rteFindTable(id); if(!table){toast('⚠️ Clique dans un tableau d’abord.');return;}
  if(!confirm('Supprimer ce tableau ?'))return;
  table.remove();
}

function rteExec(id,cmd,val){document.getElementById(id)?.focus();document.execCommand(cmd,false,val||null);rteUpdateToolbarState(id);}
function rteHighlight(id,color){document.getElementById(id)?.focus();document.execCommand('hiliteColor',false,color);}
function rteUpdateToolbarState(id){
  const content=document.getElementById(id); if(!content)return;
  const toolbar=content.previousElementSibling; if(!toolbar||!toolbar.classList.contains('rte-toolbar'))return;
  ['bold','italic','underline'].forEach(cmd=>{
    const btn=toolbar.querySelector(`[data-cmd="${cmd}"]`);
    if(btn)btn.classList.toggle('active',document.queryCommandState(cmd));
  });
}
document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection(); if(!sel||!sel.rangeCount)return;
  let node=sel.anchorNode; if(!node)return;
  const el=node.nodeType===1?node:node.parentElement;
  const content=el?.closest?.('.rte-content'); if(!content)return;
  rteUpdateToolbarState(content.id);
});
/* Redimensionnement des colonnes (bord droit) et des lignes (bord bas) d'un tableau */
let rteResize=null;
document.addEventListener('mousedown',e=>{
  const td=e.target.closest('.rte-content td, .rte-content th'); if(!td)return;
  const rect=td.getBoundingClientRect();
  const nearRight=rect.right-e.clientX<=8, nearBottom=rect.bottom-e.clientY<=8;
  if(!nearRight&&!nearBottom)return;
  e.preventDefault();
  const table=td.closest('table');
  if(nearRight){rteResize={type:'col',table,cellIndex:td.cellIndex,startX:e.clientX,startSize:rect.width};}
  else{rteResize={type:'row',tr:td.closest('tr'),startY:e.clientY,startSize:rect.height};}
});
document.addEventListener('mousemove',e=>{
  if(rteResize){
    if(rteResize.type==='col'){
      const w=Math.max(30,rteResize.startSize+(e.clientX-rteResize.startX));
      rteResize.table.querySelectorAll('tr').forEach(tr=>{const c=tr.children[rteResize.cellIndex];if(c)c.style.width=w+'px';});
    }else{
      const h=Math.max(20,rteResize.startSize+(e.clientY-rteResize.startY));
      [...rteResize.tr.children].forEach(c=>c.style.height=h+'px');
    }
    return;
  }
  const td=e.target.closest('.rte-content td, .rte-content th');
  if(td){
    const rect=td.getBoundingClientRect();
    const nearRight=rect.right-e.clientX<=8, nearBottom=rect.bottom-e.clientY<=8;
    td.style.cursor=nearRight?'col-resize':(nearBottom?'row-resize':'text');
  }
});
document.addEventListener('mouseup',()=>{rteResize=null;});
/* Sélection d'un tableau (double-clic) puis suppression avec la touche Suppr/Delete */
document.addEventListener('dblclick',e=>{
  const table=e.target.closest('.rte-content table'); if(!table)return;
  e.preventDefault();
  document.querySelectorAll('.rte-table-selected').forEach(t=>t.classList.remove('rte-table-selected'));
  table.classList.add('rte-table-selected');
  const range=document.createRange(); range.selectNode(table);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Delete'||e.key==='Backspace')){
    const sel=document.querySelector('.rte-table-selected');
    if(sel){ e.preventDefault(); sel.remove(); }
  }
});
function rteInsertTable(id){
  const cols=parseInt(prompt('Nombre de colonnes ?','3'),10);
  if(!cols||cols<1)return;
  const rows=parseInt(prompt('Nombre de lignes ?','2'),10)||2;
  let html='<table>';
  for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++)html+='<td>&nbsp;</td>';html+='</tr>';}
  html+='</table><p><br></p>';
  document.getElementById(id)?.focus();
  document.execCommand('insertHTML',false,html);
}

function maxHpFromCon(con){return Math.max(1,Math.ceil(parseNum(con)*2.5));}
function syncSheetInputs(){
  document.querySelectorAll('#modal input[data-inst]').forEach(el=>{
    if(el===document.activeElement||el.dataset.dirty==='1')return;

    if(v!==undefined&&String(v)!==el.value)el.value=v;

function char(id){return S.characters.find(c=>c.id===id);}
function inst(id){return S.instances.find(i=>i.id===id);}
function instTemplate(instance){return instance?char(instance.charId):null;}
function characterAbilities(charId){if(!charId)return [];return S.abilities.filter(a=>(a.characterIds||[]).includes(charId));}
function equip(id){return (S.equipment||[]).find(e=>e.id===id);}
function naturalRes(c){return {ca:Math.ceil((c.stats?.Constitution||0)/10),dm:Math.ceil((c.stats?.Magie||0)/10)};}
function effectiveDef(c){
  if(!c)return {CA:0,DM:0,'CA naturelle':0};
  if(c.type!=='player')return {CA:c.def?.CA||0,DM:c.def?.DM||0,'CA naturelle':c.def?.['CA naturelle']||0};
  const nat=naturalRes(c);
  let ca=(c.def?.CA||0)+nat.ca, dm=(c.def?.DM||0)+nat.dm;
  if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e){ca+=e.ca||0;dm+=e.dm||0;}});}
  return {CA:ca,DM:dm,'CA naturelle':c.def?.['CA naturelle']||0};
}
function effectiveRes(c){
  if(!c)return {};
  const out={...(c.res||{})};
  ELEMENT_RES_KEYS.forEach(k=>{if(out[k]===undefined)out[k]=0;});
  if(c.type==='player'&&c.equipmentSlots){
    EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e&&e.res){ELEMENT_RES_KEYS.forEach(rk=>{out[rk]=(out[rk]||0)+(e.res[rk]||0);});}});
  }
  return out;
}

/* ============================= ANIMATION VISUELLE DES DÉS (spritesheet, façon FX de sorts) ============================= */
function diceAnimEnabled(){return localStorage.getItem('narbudr-dice-anim-enabled')!=='0';}
function toggleDiceAnim(v){localStorage.setItem('narbudr-dice-anim-enabled',v?'1':'0');}
function formulaSides(expr){const m=String(expr||'').match(/d(\d+)/i);return m?+m[1]:20;}
let activeDice=[];
let diceRafRunning=false;
function diceLoop(now){
  const stillAlive=[];
  activeDice.forEach(d=>{
    const elapsed=now-d.start;
    if(elapsed<0){stillAlive.push(d);return;}
    d.ctx.clearRect(0,0,d.size,d.size);
    if(elapsed<d.spinMs){
      const frame=Math.floor(elapsed/1000*d.fps)%d.frames;
      fxDrawFrame(d.ctx,d.img,frame,d.frames,d.rows,0,0,d.size,d.size);
    }else{
      fxDrawFrame(d.ctx,d.img,d.targetFrame,d.frames,d.rows,0,0,d.size,d.size);
      if(!d.landed){d.landed=true;d.canvas.classList.add('landed');}
    }
    if(elapsed<d.spinMs+d.holdMs)stillAlive.push(d); else d.canvas.remove();
  });
  activeDice=stillAlive;
  if(activeDice.length)requestAnimationFrame(diceLoop); else diceRafRunning=false;
}
function playDiceRoll(sides,values){
  if(!diceAnimEnabled()||!values||!values.length)return;
  let overlay=document.getElementById('diceOverlay');
  if(!overlay){overlay=document.createElement('div');overlay.id='diceOverlay';overlay.className='dice-overlay';document.body.appendChild(overlay);}
  const ds=S.diceSettings||{};
  const frames=Math.max(1,ds.frames||20);
  const rows=Math.max(1,ds.rows||1);
  const fps=Math.max(1,ds.fps||24);
  const useSprite=!!ds.image && sides===frames;
  const size=56;
  values.forEach((v,i)=>{
    if(useSprite){
      const canvas=document.createElement('canvas');
      canvas.className='dice-die-canvas';
      canvas.width=size; canvas.height=size; canvas.style.cssText=`width:${size}px;height:${size}px`;
      overlay.appendChild(canvas);
      const targetFrame=Math.max(0,Math.min(frames-1,v-1));
      activeDice.push({canvas,ctx:canvas.getContext('2d'),img:getFxImg(ds.image),frames,rows,fps,start:performance.now()+i*80,spinMs:650,holdMs:1300,targetFrame,size,landed:false});
      if(!diceRafRunning){diceRafRunning=true;requestAnimationFrame(diceLoop);}
    }else{
      const die=document.createElement('div');
      die.className='dice-die-simple';
      die.style.animationDelay=(i*80)+'ms';
      die.innerHTML=`🎲<span class="dice-number">${v}</span>`;
      overlay.appendChild(die);
      setTimeout(()=>die.classList.add('landed'),700+i*80);
      setTimeout(()=>die.remove(),2200+i*80);
    }
  });
}

function roll(expr){
  expr=String(expr).replace(/\s+/g,''); let bonus=0;
  const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
  const m=expr.match(/(\d*)d(\d+)/i); if(!m)return {total:(+expr||0)+bonus,rolls:[],bonus};
  const n=+(m[1]||1), sides=+m[2], rolls=[]; for(let i=0;i<n;i++)rolls.push(1+Math.floor(Math.random()*sides));
  return {total:rolls.reduce((a,x)=>a+x,0)+bonus,rolls,bonus};
}
function applyMult(value,multStr){
  if(!multStr)return value;
  const m=String(multStr).trim().toLowerCase().replace(',','.');
  const mDiv=m.match(/^\/\s*(\d+(\.\d+)?)$/);
  const mMul=m.match(/^x\s*(\d+(\.\d+)?)$/);
  if(mDiv){const d=+mDiv[1]; if(d>0)return Math.ceil(value/d);}
  if(mMul){const x=+mMul[1]; if(x>0)return Math.ceil(value*x);}
  return value;
}
function combineFormula(abilityFormula,weaponFormula){
  const parse=(expr)=>{
    expr=String(expr||'').replace(/\s+/g,'');
    let bonus=0; const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
    const m=expr.match(/^(\d*)d(\d+)/i);
    if(!m)return {n:0,sides:20,bonus:bonus+(+expr||0)};
    return {n:+(m[1]||1),sides:+m[2],bonus};
  };
  const a=parse(abilityFormula), w=parse(weaponFormula);
  const n=a.n+w.n, sides=a.sides||w.sides||20, bonus=a.bonus+w.bonus;
  if(n<=0)return abilityFormula;
  return `${n}d${sides}${bonus?(bonus>0?'+':'')+bonus:''}`;
}
function outcome(d){
  if(d===100)return ['Échec ultime',0]; if(d>=95)return ['Échec critique',0]; if(d>=90)return ['Échec',0];
  if(d>=75)return ['Légère réussite',.5]; if(d>=50)return ['Légère réussite',.75]; if(d>=25)return ['Réussite',1];
  if(d>=5)return ['Grande réussite',1.5]; if(d>=2)return ['Réussite critique',2]; return ['Réussite ultime',4];
}

function pct(v,m){return m?Math.max(0,Math.min(100,v/m*100)):0;}

/* ============================= INSTANCES (TOKENS) ============================= */
function isOccupied(x,y,excludeId){return S.instances.some(i=>i.id!==excludeId&&i.x===x&&i.y===y);}
function footprintOverlap(id,x,y,sw,sh){
  const x2=x+sw, y2=y+sh;
  if(x<0||y<0||x2>S.map.cols||y2>S.map.rows)return true;
  return S.instances.some(o=>{
    if(o.id===id)return false;
    const osw=o.sizeW||1, osh=o.sizeH||1, ox2=o.x+osw, oy2=o.y+osh;
    return x<ox2 && x2>o.x && y<oy2 && y2>o.y;
  });
}
function nearestCellCoord(rawPos,maxIndex){
  // rawPos est exprimé en unités de case (ex: 4.3 = case 4, proche du centre 4.5)
  if(Number.isInteger(rawPos)){
    // exactement sur la frontière entre deux cases -> tirage au sort parmi les cases valides adjacentes
    const candidates=[rawPos-1,rawPos].filter(v=>v>=0&&v<=maxIndex);
    if(!candidates.length)return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
    return candidates[Math.floor(Math.random()*candidates.length)];
  }
  return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
}
function snapAllTokensToGrid(){
  S.instances.forEach(t=>{
    const rawX=(t.px!=null?t.px:t.x*S.map.cell+S.map.cell/2)/S.map.cell;
    const rawY=(t.py!=null?t.py:t.y*S.map.cell+S.map.cell/2)/S.map.cell;
    t.x=nearestCellCoord(rawX,S.map.cols-1);
    t.y=nearestCellCoord(rawY,S.map.rows-1);
    t.px=null; t.py=null;
  });
}
function toggleFreeMovement(){
  if(!isMJ()){toast('⛔ Seul le MJ peut activer/désactiver le placement libre.');return;}
  if(S.combat.active){toast('⛔ Indisponible pendant le combat.');return;}
  S.freeMovement=!S.freeMovement;
  if(!S.freeMovement){
    snapAllTokensToGrid();
    addLog('🎯 Le MJ a désactivé le placement libre — les tokens reviennent au centre des cases.');
  }else{
    addLog('🎯 Le MJ a activé le placement libre des tokens (hors grille, hors combat).');
  }
  saveState(); render();
}
function toggleHudEnabled(){
  if(!isMJ()){toast('⛔ Seul le MJ peut activer/désactiver le HUD.');return;}
  S.hudEnabled=!S.hudEnabled;
  addLog(S.hudEnabled?'🎯 Le MJ active le HUD flottant.':'🎯 Le MJ désactive le HUD flottant.');
  saveState(); render();
}
/* ---- HUD flottant de ressources (dégâts/soins/bouclier) ---- */
function broadcastHud(instId,deltas){
  if(!deltas||(!deltas.hp&&!deltas.mana&&!deltas.shield))return;
  gameChannel?.send({type:'broadcast',event:'hud',payload:{instId,deltas}});
  showHudFloating(instId,deltas);
}
function showHudFloating(instId, deltas) {
  if (!S.hudEnabled || currentPage !== 'table') return;
  
  // Réduit à 100ms ou 0ms pour une réactivité instantanée !
  setTimeout(() => {
    const el = document.querySelector(`[data-token="${instId}"]`);
    if (!el) return;
    
    const dur = S.hudSettings?.resourceDurationMs ?? 1000;
    
    // 1. On cherche si un texte existe DEJÀ sur ce token
    let wrap = el.querySelector('.hud-floating-text');
    
    if (wrap) {
      // Si un texte existe déjà, on annule sa disparition programmée pour prolonger sa vie
      if (wrap.timeoutId) clearTimeout(wrap.timeoutId);
      
      // On récupère les anciennes valeurs ou on démarre à 0
      const currentHp = wrap.dataset.hp ? parseInt(wrap.dataset.hp) : 0;
      const currentMana = wrap.dataset.mana ? parseInt(wrap.dataset.mana) : 0;
      const currentShield = wrap.dataset.shield ? parseInt(wrap.dataset.shield) : 0;
      
      // On AJOUTE les nouveaux dégâts/soins aux anciens
      deltas.hp = (deltas.hp ?? 0) + currentHp;
      deltas.mana = (deltas.mana ?? 0) + currentMana;
      deltas.shield = (deltas.shield ?? 0) + currentShield;
    } else {
      // Sinon, on crée le conteneur pour la première fois
      wrap = document.createElement('div');
      wrap.className = 'hud-floating-text';
      wrap.style.cssText = 'position:absolute;left:50%;bottom:calc(var(--tok-h,var(--cell-size,32px))/2 + 4px);transform:translateX(-50%);pointer-events:none;z-index:85;text-align:center;white-space:nowrap;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000,0 0 4px #000';
      el.appendChild(wrap);
    }
    
    // 2. On sauvegarde les valeurs cumulées dans le HTML pour le prochain clic rapide
    wrap.dataset.hp = deltas.hp || 0;
    wrap.dataset.mana = deltas.mana || 0;
    wrap.dataset.shield = deltas.shield || 0;
    
    // 3. On génère le rendu visuel (avec votre logique de couleur Vert/Rouge)
    const lines = [];
    if (deltas.hp) lines.push(`<div style="color:${deltas.hp > 0 ? '#2ecc71' : '#ef6262'}">${deltas.hp > 0 ? '+' : ''}${deltas.hp} PV</div>`);
    if (deltas.mana) lines.push(`<div style="color:${deltas.mana > 0 ? '#2ecc71' : '#5da5ff'}">${deltas.mana > 0 ? '+' : ''}${deltas.mana} Mana</div>`);
    if (deltas.shield) lines.push(`<div style="color:${deltas.shield > 0 ? '#2ecc71' : '#e7b85c'}">${deltas.shield > 0 ? '+' : ''}${deltas.shield} Bouclier</div>`);
    
    if (!lines.length) {
      wrap.remove();
      return;
    }
    
    wrap.innerHTML = lines.join('');
    
    // 4. On relance le chrono de disparition à zéro (durée complète)
    wrap.timeoutId = setTimeout(() => wrap.remove(), dur);
    
  }, 100); // Délai d'attente de 100ms seulement
}
/* ---- Pop-ups de réussite/échec critique ---- */
const CRITICAL_KEYS = {
  'Échec ultime': 'echecUltime',
  'Échec critique': 'echecCritique',
  'Réussite critique': 'reussiteCritique',
  'Réussite ultime': 'reussiteUltime'
};

function broadcastCritical(instId, label) {
  const key = CRITICAL_KEYS[label];
  if (!key) return;
  gameChannel?.send({ type: 'broadcast', event: 'crit', payload: { instId, key } });
  showCriticalPopup(instId, key);
}

function showCriticalPopup(instId,key){
  if(!S.hudEnabled||currentPage!=='table')return;
  const cfg=(S.hudSettings?.critical||{})[key]; if(!cfg)return;
  const dur=S.hudSettings?.criticalDurationMs??1000;
  if(cfg.audio){ try{ const au=new Audio(cfg.audio); au.play().catch(()=>{}); }catch(e){} }
  if(!cfg.image)return;
  setTimeout(()=>{
    const el=document.querySelector(`[data-token="${instId}"]`);
    const t=inst(instId);
    if(!el||!t)return;
    const cell=S.map.cell, sw=t.sizeW||1, sh=t.sizeH||1;
    const rect=el.getBoundingClientRect();
    const img=document.createElement('img');
    img.src=cfg.image;
    const newWidth = cell * sw * 4;
    const newHeight = cell * sh * 4;
    img.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top - cell}px;transform:translate(-50%,-100%);width:${newWidth}px;height:${newHeight}px;object-fit:fill;z-index:9999;pointer-events:none`;
    document.body.appendChild(img);
    setTimeout(()=>img.remove(),dur);
  },500);
}
function findFreeCell(x,y,excludeId){
  if(!isOccupied(x,y,excludeId))return [x,y];
  const maxR=Math.max(S.map.cols,S.map.rows);
  for(let r=1;r<=maxR;r++){
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=S.map.cols||ny>=S.map.rows)continue;
      if(!isOccupied(nx,ny,excludeId))return [nx,ny];
    }
  }
  return null;
}
function spawnInstance(charId,x,y){
  const t=char(charId); if(!t)return null;
  const count=S.instances.filter(i=>i.charId===charId).length+1;
  const label=t.type==='enemy'?`${t.name} #${count}`:t.name;
  const rm=t.resourcesMax||{Vie:10,Mana:0,Bouclier:0};
  const newInst={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),charId,label,x,y,px:null,py:null,
    hp:rm.Vie||0,hpMax:rm.Vie||0,mana:rm.Mana||0,manaMax:rm.Mana||0,shield:rm.Bouclier||0,shieldMax:rm.Bouclier||0,
    remainingMove:t.move??6};
  S.instances.push(newInst); return newInst;
}
function removeInstance(id){
  S.instances=S.instances.filter(i=>i.id!==id);
  if(selectedToken===id)selectedToken=null;
  if(S.combat.active){
    const idx=S.combat.order.indexOf(id);
    if(idx!==-1){
      S.combat.order.splice(idx,1); delete S.combat.initiatives[id];
      if(idx<S.combat.turn)S.combat.turn--;
      if(!S.combat.order.length){S.combat.active=false;S.combat.turn=0;}
      else S.combat.turn=((S.combat.turn%S.combat.order.length)+S.combat.order.length)%S.combat.order.length;
    }
  }
}

  else if(currentPage==='characters')c.innerHTML=charactersPage();
  else if(currentPage==='abilities')c.innerHTML=abilitiesPage();
  else if(currentPage==='equipment')c.innerHTML=equipmentPage();

function updateTargetingBanner(){
  const banner=document.getElementById('targetingBanner'); if(!banner)return;
  if(activeAbility==='__dissipation__'&&currentPage==='table'){
    banner.innerHTML=`🧹 <b>Dissipation</b> — clique sur un jeton à purger (Échap pour annuler)`;
    banner.classList.add('show');
    return;
  }
  if(pendingPersistentOrigin&&currentPage==='table'){
    const pa=S.abilities.find(x=>x.id===pendingPersistentOrigin.abilityId);
    const stageTxt=pendingPersistentOrigin.stage==='angle'?'clique pour choisir la direction'
      :pendingPersistentOrigin.stage==='distance'?'clique pour choisir la distance'
      :'ajuste l’orientation puis clique pour lancer';
    banner.innerHTML=`🎯 <b>${esc(pa?.name||'Zone')}</b> — ${stageTxt} (Échap pour annuler)`;
    banner.classList.add('show');
    return;
  }
  const a=activeAbility?S.abilities.find(x=>x.id===activeAbility):null;
  if(a&&currentPage==='table'){
    const caster=selectedToken?inst(selectedToken):null;
    banner.innerHTML=`🎯 <b>${esc(caster?.label||'Lanceur')}</b> — ${iconInlineHtml(a)} ${esc(a.name)} : clique sur une cible ou une case (Échap pour annuler)`;

    banner.classList.remove('show');
  }
}

    if(!t.activeAuras||!t.activeAuras.length)return;
    const sw=t.sizeW||1, sh=t.sizeH||1;
    const [cx,cy]=instCenterPx(t);
    t.activeAuras.forEach(abilityId=>{
      const a=S.abilities.find(x=>x.id===abilityId); if(!a)return;
      const w=((a.areaSize||1)*2+sw)*cell, h=((a.areaSize||1)*2+sh)*cell;
      const px=cx-w/2, py=cy-h/2;

function zoneAxis(a,targetCell,originOverride,rangeCellsOverride){
  const c=S.map.cell;
  let cx,cy;
  if(originOverride){
    cx=originOverride[0]*c+c/2; cy=originOverride[1]*c+c/2;
  }else{
    const casterInst=selectedToken?inst(selectedToken):null;
    if(!casterInst)return null;
    [cx,cy]=instCenterPx(casterInst);
  }
  const tx=targetCell[0]*c+c/2, ty=targetCell[1]*c+c/2;
  const angle=Math.atan2(ty-cy,tx-cx);
  const rangeCells=(rangeCellsOverride!=null)?rangeCellsOverride:(a.range||1);
  return {cx,cy,angle,range:rangeCells*c};
}
/* Position (pixels) du lanceur, utilisée pour le placement en 3 clics des sorts persistants ligne/cône. */
function casterPixelPos(casterInst){
  return instCenterPx(casterInst);
}
/* Projette une case survolée sur l'axe (origine cx,cy à l'angle donné) pour obtenir une distance en cases, plafonnée à maxCells. */
function projectDistanceCells(cx,cy,angle,cell,maxCells){
  const c=S.map.cell;
  const hx=cell[0]*c+c/2, hy=cell[1]*c+c/2;
  const dx=Math.cos(angle), dy=Math.sin(angle);
  const proj=((hx-cx)*dx+(hy-cy)*dy)/c;
  const max=(maxCells>0)?maxCells:9999;
  return Math.max(0,Math.min(max,Math.round(proj)));
}
function lineConeHitTest(axis,areaType,c,coneStart,coneEnd,px,py){
  const {cx,cy,angle,range}=axis;
  const dx=Math.cos(angle), dy=Math.sin(angle);
  const rx=px-cx, ry=py-cy;
  const proj=rx*dx+ry*dy;
  const perp=Math.abs(rx*(-dy)+ry*dx);
  if(proj<0||proj>range)return false;
  if(areaType==='line')return perp<=c/2;
  const sw=(coneStart||1)*c/2, ew=(coneEnd||3)*c/2;
  return perp<=sw+(ew-sw)*(proj/range);
}
function footprintHitsLineCone(tx,ty,tw,th,axis,areaType,c,coneStart,coneEnd){
  // Touché dès qu'un coin ou le centre de la case occupée par le token est dans la zone.
  const pts=[[tx,ty],[tx+tw,ty],[tx,ty+th],[tx+tw,ty+th],[tx+tw/2,ty+th/2]].map(p=>[p[0]*c,p[1]*c]);
  return pts.some(([px,py])=>lineConeHitTest(axis,areaType,c,coneStart,coneEnd,px,py));
}
function lineConeMarkupFromAxis(a,axis){
  const {cx,cy,angle,range}=axis, c=S.map.cell;
  const dx=Math.cos(angle), dy=Math.sin(angle), px=-dy, py=dx;
  let poly;
  if(a.area==='line'){
    const hw=c/2;
    poly=[[cx+px*hw,cy+py*hw],[cx-px*hw,cy-py*hw],[cx-px*hw+dx*range,cy-py*hw+dy*range],[cx+px*hw+dx*range,cy+py*hw+dy*range]];
  }else{
    const sw=(a.coneStart||1)*c/2, ew=(a.coneEnd||3)*c/2;
    poly=[[cx+px*sw,cy+py*sw],[cx-px*sw,cy-py*sw],[cx+dx*range-px*ew,cy+dy*range-py*ew],[cx+dx*range+px*ew,cy+dy*range+py*ew]];
  }
  const pts=poly.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const mapW=S.map.cols*c, mapH=S.map.rows*c;
  if(a.zoneImage){
    const clipId='clip'+Math.random().toString(36).slice(2,9);
    return `<svg id="zonePreview" style="position:absolute;left:0;top:0;pointer-events:none;z-index:20" width="${mapW}" height="${mapH}"><defs><clipPath id="${clipId}"><polygon points="${pts}"/></clipPath></defs><image href="${esc(a.zoneImage)}" x="0" y="0" width="${mapW}" height="${mapH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})" opacity=".85"/><polygon points="${pts}" fill="none" stroke="#c084fc" stroke-width="2"/></svg>`;
  }
  const effect=a.effect?`<text x="${cx+dx*range/2}" y="${cy+dy*range/2}" font-size="${Math.max(24,c*0.8)}" text-anchor="middle" dominant-baseline="middle" opacity=".42">${esc(a.effect)}</text>`:'';
  return `<svg id="zonePreview" style="position:absolute;left:0;top:0;pointer-events:none;z-index:20" width="${mapW}" height="${mapH}"><polygon points="${pts}" fill="#a44cff38" stroke="#c084fc" stroke-width="2"/>${effect}</svg>`;
}
function lineConeMarkup(a,targetCell,originOverride,rangeCellsOverride){
  const axis=zoneAxis(a,targetCell,originOverride,rangeCellsOverride); if(!axis)return '';
  return lineConeMarkupFromAxis(a,axis);
}
function zoneMarkup(a,cell,originOverride,rangeCellsOverride){
  if(a.area==='line'||a.area==='cone')return lineConeMarkup(a,cell,originOverride,rangeCellsOverride);
  let size=a.areaSize||3, x=cell[0], y=cell[1];
  x=Math.max(0,Math.min(S.map.cols-size,x)); y=Math.max(0,Math.min(S.map.rows-size,y));
  const px=x*S.map.cell, py=y*S.map.cell, d=size*S.map.cell;
  const radius=a.area==='circle'?'border-radius:50%;':'';
  if(a.zoneImage){
    return `<div id="zonePreview" class="zone" style="left:${px}px;top:${py}px;width:${d}px;height:${d}px;${radius}background:none;border-color:#c084fc;overflow:hidden"><img src="${esc(a.zoneImage)}" style="width:100%;height:100%;object-fit:cover;opacity:.85"></div>`;
  }
  const effect=a.effect?`<span class="zone-effect" style="font-size:${Math.max(24,size*8)}px">${esc(a.effect)}</span>`:'';
  return `<div id="zonePreview" class="zone" style="left:${px}px;top:${py}px;width:${d}px;height:${d}px;${radius}">${effect}</div>`;
}
function updateZonePreview(){
  const map=document.getElementById('map'); if(!map)return;
  document.getElementById('zonePreview')?.remove();
  if(pendingPersistentOrigin){
    if(!hoverCell)return;
    const a=S.abilities.find(x=>x.id===pendingPersistentOrigin.abilityId);
    if(!a)return;
    const c=S.map.cell, zoneLen=a.zoneRange||a.range||1;
    if(a.area==='line'||a.area==='cone'){
      if(pendingPersistentOrigin.stage==='angle'){
        // 1er clic à venir : la zone suit la souris depuis le lanceur.
        map.insertAdjacentHTML('beforeend',zoneMarkup(a,hoverCell,null,zoneLen));
        return;
      }
      if(pendingPersistentOrigin.stage==='distance'){
        // 2e clic à venir : la zone glisse le long de la direction verrouillée, de 0 à la portée max.
        const {angle,casterPx}=pendingPersistentOrigin;
        const maxCells=a.range>0?a.range:9999;
        const distCells=projectDistanceCells(casterPx[0],casterPx[1],angle,hoverCell,maxCells);
        const originPx=[casterPx[0]+Math.cos(angle)*distCells*c,casterPx[1]+Math.sin(angle)*distCells*c];
        map.insertAdjacentHTML('beforeend',lineConeMarkupFromAxis(a,{cx:originPx[0],cy:originPx[1],angle,range:zoneLen*c}));
        return;
      }
      if(pendingPersistentOrigin.stage==='final'){
        // 3e clic à venir : réoriente la zone autour du point de distance déjà choisi.
        const {originPx}=pendingPersistentOrigin;
        const hx=hoverCell[0]*c+c/2, hy=hoverCell[1]*c+c/2;
        const angle=Math.atan2(hy-originPx[1],hx-originPx[0]);
        map.insertAdjacentHTML('beforeend',lineConeMarkupFromAxis(a,{cx:originPx[0],cy:originPx[1],angle,range:zoneLen*c}));
        return;
      }
      return;
    }
    map.insertAdjacentHTML('beforeend',zoneMarkup(a,hoverCell,pendingPersistentOrigin.origin));
    return;
  }
  if(!activeAbility||!hoverCell)return;
  const a=S.abilities.find(x=>x.id===activeAbility);
  if(!a||a.area==='single')return;
  map.insertAdjacentHTML('beforeend',zoneMarkup(a,hoverCell));
}

/* ============================= ANIMATIONS DE SORTS (FX) ============================= */
const fxImgCache={};
function getFxImg(url){
  if(!url)return null;
  if(!fxImgCache[url]){const im=new Image();im.crossOrigin='anonymous';im.src=url;fxImgCache[url]=im;}
  return fxImgCache[url];
}
const fxAvgColorCache={};
function getAvgColorFromImage(url,cb){
  if(!url)return;
  if(fxAvgColorCache[url]){cb(fxAvgColorCache[url]);return;}
  const img=getFxImg(url); if(!img)return;
  const compute=()=>{
    try{
      const cw=8,ch=8;
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      const cx=cv.getContext('2d');
      cx.drawImage(img,0,0,cw,ch);
      const data=cx.getImageData(0,0,cw,ch).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<data.length;i+=4){r+=data[i];g+=data[i+1];b+=data[i+2];n++;}
      const hex='#'+[Math.round(r/n),Math.round(g/n),Math.round(b/n)].map(v=>v.toString(16).padStart(2,'0')).join('');
      fxAvgColorCache[url]=hex;
      cb(hex);
    }catch(e){ /* image non accessible en canvas (CORS) : on garde la couleur par élément */ }
  };
  if(img.complete&&img.naturalWidth)compute(); else img.onload=compute;
}
function instCenterPx(t){
  const c=S.map.cell;
  const sw=t.sizeW||1, sh=t.sizeH||1;
  return [(S.freeMovement&&t.px!=null)?t.px:t.x*c+sw*c/2,(S.freeMovement&&t.py!=null)?t.py:t.y*c+sh*c/2];
}
function ensureFxCanvas(){
  const map=document.getElementById('map'); if(!map)return null;
  let cv=document.getElementById('fxCanvas');
  if(!cv){
    cv=document.createElement('canvas');
    cv.id='fxCanvas';
    cv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:32';
    map.appendChild(cv);
  }
  cv.width=S.map.cols*S.map.cell; cv.height=S.map.rows*S.map.cell;
  if(fxList.length&&!fxRafRunning){fxRafRunning=true;requestAnimationFrame(fxLoop);}
  return cv;
}
let fxList=[];
let fxRafRunning=false;
function fxStart(fx){
  fx.start=performance.now();
  fxList.push(fx);
  if(!fxRafRunning){fxRafRunning=true;requestAnimationFrame(fxLoop);}
}
function fxLoop(now){
  const cv=document.getElementById('fxCanvas');
  if(!cv){fxRafRunning=false;return;}
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const stillAlive=[], ended=[];
  fxList.forEach(fx=>{
    const elapsed=now-fx.start;
    if(elapsed>=fx.duration){ended.push(fx);return;}
    try{fx.draw(ctx,elapsed);}catch(e){}
    stillAlive.push(fx);
  });
  fxList=stillAlive;
  ended.forEach(fx=>{ if(fx.onEnd)fx.onEnd(); });
  if(fxList.length)requestAnimationFrame(fxLoop); else fxRafRunning=false;
}
function fxDrawFrame(ctx,img,frame,frames,rows,dx,dy,dw,dh){
  if(!img||!img.complete||!img.naturalWidth)return;
  rows=rows||1;
  const cols=Math.max(1,Math.ceil(frames/rows));
  const fw=img.naturalWidth/cols, fh=img.naturalHeight/rows;
  const row=Math.floor(frame/cols), col=frame%cols;
  ctx.drawImage(img,col*fw,row*fh,fw,fh,dx,dy,dw,dh);
}
function fxAddImpact(img,frames,rows,cx,cy,w,h,fps,clip){
  if(!img)return;
  const duration=Math.max(200,frames/fps*1000);
  fxStart({duration,draw(ctx,elapsed){
    const frame=Math.min(frames-1,Math.floor(elapsed/1000*fps));
    ctx.save(); if(clip)clip(ctx);
    fxDrawFrame(ctx,img,frame,frames,rows,cx-w/2,cy-h/2,w,h);
    ctx.restore();
  }});
}
function fxAddProjectile(img,frames,rows,fromX,fromY,toX,toY,size,fps,onArrive){
  const dist=Math.hypot(toX-fromX,toY-fromY);
  const speed=600; // px/s
  const duration=Math.max(120,dist/speed*1000);
  const angle=Math.atan2(toY-fromY,toX-fromX);
  fxStart({duration,draw(ctx,elapsed){
    const t=Math.min(1,elapsed/duration);
    const x=fromX+(toX-fromX)*t, y=fromY+(toY-fromY)*t;
    if(!img||!img.complete||!img.naturalWidth)return;
    const frame=frames>1?Math.floor(elapsed/1000*fps)%frames:0;
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    fxDrawFrame(ctx,img,frame,frames,rows||1,-size/2,-size/2,size,size);
    ctx.restore();
  },onEnd:onArrive});
}
function fxAddConeFill(cx,cy,angle,range,halfWStart,halfWEnd,color,duration){
  fxStart({duration,draw(ctx,elapsed){
    const t=Math.min(1,elapsed/duration);
    const curRange=range*t;
    const dx=Math.cos(angle),dy=Math.sin(angle),px=-dy,py=dx;
    const w=halfWStart+(halfWEnd-halfWStart)*t;
    ctx.beginPath();
    ctx.moveTo(cx+px*halfWStart,cy+py*halfWStart);
    ctx.lineTo(cx-px*halfWStart,cy-py*halfWStart);
    ctx.lineTo(cx-px*w+dx*curRange,cy-py*w+dy*curRange);
    ctx.lineTo(cx+px*w+dx*curRange,cy+py*w+dy*curRange);
    ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  }});
}
const fxConeImageCache = {};

function fxAddConeImage(cx, cy, angle, range, halfWStart, halfWEnd, imgSrc, duration) {
  if (!fxConeImageCache[imgSrc]) {
    fxConeImageCache[imgSrc] = new Image();
    fxConeImageCache[imgSrc].src = imgSrc;
  }
  var img = fxConeImageCache[imgSrc];

  fxStart({
    duration: duration,
    draw: function(ctx, elapsed) {
      var t = Math.min(1, elapsed / duration);
      var curRange = range * t;
      var dx = Math.cos(angle);
      var dy = Math.sin(angle);
      var px = -dy;
      var py = dx;
      var w = halfWStart + (halfWEnd - halfWStart) * t;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + px * halfWStart, cy + py * halfWStart);
      ctx.lineTo(cx - px * halfWStart, cy - py * halfWStart);
      ctx.lineTo(cx - px * w + dx * curRange, cy - py * w + dy * curRange);
      ctx.lineTo(cx + px * w + dx * curRange, cy + py * w + dy * curRange);
      ctx.closePath();

      ctx.clip();

      if (img.complete && img.naturalWidth !== 0) {
        var pattern = ctx.createPattern(img, 'repeat');
        if (pattern) {
          // ========================================================
          // CORRECTION DU ZOOM : On adapte l'image à la taille des cases
          // ========================================================
          var matrix = new DOMMatrix();
          
          // Exemple : On veut que l'image fasse la taille de 2 cases de la grille (cell * 2)
          var targetSize = (S.map?.cell ?? 32) * 1; 
          var scaleX = targetSize / img.naturalWidth;
          var scaleY = targetSize / img.naturalHeight;
          
          // On applique l'échelle (le dé-zoom) à la texture
          matrix = matrix.scale(scaleX, scaleY);
		  matrix = matrix.translate(-elapsed * 1.2, 0); 
          pattern.setTransform(matrix);
          // ========================================================

          ctx.fillStyle = pattern;
          ctx.globalAlpha = 0.6; // Opacité (60%) pour voir la grille à travers
          ctx.fill();
        }
      }
      ctx.restore();
    }
  });
}
const FX_ELEMENT_COLORS={Feu:'#ff6a3c',Eau:'#3ca0ff',Terre:'#8a6b3c',Air:'#c9e6ff',Glace:'#7fd8ff',Foudre:'#ffe066',Lumière:'#fff3b0',Ténèbres:'#8b5cf6',Neutre:'#c084fc',Physique:'#e0e0e0'};
function fxElementColor(el){return (FX_ELEMENT_COLORS[el]||'#c084fc')+'99';}
function playAbilityFX(a,casterInst,targets,start){
  if(!casterInst)return;
  ensureFxCanvas();
  const cell=S.map.cell, fps=a.animFps||60;
  const projImg=a.projectileImage?getFxImg(a.projectileImage):null;
  const impactImg=a.impactSpritesheet?getFxImg(a.impactSpritesheet):null;
  const projFrames=Math.max(1,a.projectileFrames||1);
  const projRows=Math.max(1,a.projectileRows||1);
  const impactFrames=Math.max(1,a.impactFrames||1);
  const [fromX,fromY]=instCenterPx(casterInst);
  const doImpact=(cx,cy,size,clip)=>{ if(impactImg)fxAddImpact(impactImg,impactFrames,a.impactRows||1,cx,cy,size,size,fps,clip); };
  const doImpactZoneOrPerToken=(cx,cy,size,clip)=>{
    if(a.impactPerToken&&(targets||[]).length){
      targets.forEach(t=>{
        const [tx,ty]=instCenterPx(t);
        const tsize=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
        doImpact(tx,ty,tsize);
      });
    }else{
      doImpact(cx,cy,size,clip);
    }
  };

  if(a.area==='single'){
    (targets||[]).forEach(t=>{
      const [tx,ty]=instCenterPx(t);
      const size=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
      if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,tx,ty,cell*0.9,fps,()=>doImpact(tx,ty,size));
      else doImpact(tx,ty,size);
    });
    return;
  }
  if(a.area==='square'||a.area==='circle'){
    const size=(a.areaSize||3)*cell;
    const cx=start[0]*cell+size/2, cy=start[1]*cell+size/2;
    const clip=a.area==='circle'?(ctx=>{ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.clip();}):null;
    if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,cx,cy,cell*0.9,fps,()=>doImpactZoneOrPerToken(cx,cy,size,clip));
    else doImpactZoneOrPerToken(cx,cy,size,clip);
    return;
  }
  if(a.area==='self'){
    const sw=casterInst.sizeW||1, sh=casterInst.sizeH||1;
    const size=((a.areaSize||1)*2+Math.max(sw,sh))*cell;
    doImpactZoneOrPerToken(fromX,fromY,size);
    return;
  }
  if(a.area==='line'){
    const axis=zoneAxis(a,start); if(!axis)return;
    const endX=axis.cx+Math.cos(axis.angle)*axis.range;
    const endY=axis.cy+Math.sin(axis.angle)*axis.range;
    const size=cell*1.4;
    if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,endX,endY,cell*0.9,fps,()=>doImpactZoneOrPerToken(endX,endY,size));
    else doImpactZoneOrPerToken(endX,endY,size);
    return;
  }
  if(a.area==='cone'){
    const axis=zoneAxis(a,start); if(!axis)return;
    const c=cell;
    const sw=((a.coneStart||1)*c/2)*0.2;
    const ew=(a.coneEnd||3)*c/2;
    const duration=Math.max(200,(axis.range/500)*1000);
    if (a.zoneImage) {
      // Lance l'affichage du cône avec l'image (flammes)
      fxAddConeImage(axis.cx, axis.cy, axis.angle, axis.range, sw, ew, a.zoneImage, duration);
    } else {
      let color=fxElementColor(a.element);
      fxAddConeFill(axis.cx, axis.cy, axis.angle, axis.range, sw, ew, color, duration);
    }
  }
  }

function charBreadcrumb(catId){
  const chain=[]; let cur=catId;
  while(cur){const c=(S.characterCategories||[]).find(x=>x.id===cur); if(!c)break; chain.unshift(c); cur=c.parent_id;}
  const root=`<button class="btn ghost" style="padding:3px 8px" onclick="openCharCategory(null)" ondragover="event.preventDefault()" ondrop="handleCharCategoryDrop(event,null)">🏠 Racine</button>`;
  const rest=chain.map(c=>`<span class="tiny muted">›</span> <button class="btn ghost" style="padding:3px 8px" onclick="openCharCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleCharCategoryDrop(event,'${c.id}')">${esc(c.name)}</button>`).join(' ');
  return `<div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:8px">${root} ${rest}</div>`;
}

function handleCharCategoryDrop(ev,categoryId){
  ev.preventDefault(); ev.stopPropagation();
  if(!isMJ())return;
  const data=ev.dataTransfer.getData('text/plain');
  if(!data||data.startsWith('map:'))return;
  const c=char(data); if(!c)return;
  moveCharToCategory(data,categoryId);
}

  if(!isMJ())return;
  const c=char(charId); if(!c)return;
  c.categoryId=categoryId;
  saveState(); render();
  toast('✅ Fiche déplacée.');
}
function charResultsHtml(){
  const mj=isMJ();
  const query=charSearchQuery.trim().toLowerCase();
  if(query){
    const results=S.characters.filter(c=>c.name.toLowerCase().includes(query));
    return `<div class="asset-list">${results.length?results.map(charItemHtml).join(''):'<p class="tiny muted">Aucun personnage ne correspond.</p>'}</div>`;
  }
  const breadcrumb=charBreadcrumb(currentCharCategory);
  const subCats=(S.characterCategories||[]).filter(c=>(c.parent_id||null)===(currentCharCategory||null));
  const charsHere=S.characters.filter(c=>(c.categoryId||null)===(currentCharCategory||null));
  const catsHtml=subCats.map(c=>{
    const subCount=(S.characterCategories||[]).filter(cc=>cc.parent_id===c.id).length;
    const charCount=S.characters.filter(ch=>ch.categoryId===c.id).length;
    return `<div class="asset-item" onclick="openCharCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleCharCategoryDrop(event,'${c.id}')" style="cursor:pointer">
      <div class="asset-icon">📁</div><div class="asset-info"><b>${esc(c.name)}</b><small>${subCount} sous-dossier(s) · ${charCount} fiche(s)</small></div>
      ${mj?`<button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();openRenameCharCategoryModal('${c.id}')" title="Renommer">✏️</button><button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();confirmDeleteCharCategory('${c.id}')" title="Supprimer le dossier">🗑️</button>`:''}
    </div>`;
  }).join('');
  const charsHtml=charsHere.map(charItemHtml).join('');
  const emptyMsg=(!subCats.length&&!charsHere.length)?'<p class="tiny muted">Ce dossier est vide.</p>':'';
  return `${breadcrumb}${mj?'<p class="tiny muted">Glisse un élément sur la carte pour créer un token.</p>':''}<div class="asset-list">${catsHtml}${charsHtml}${emptyMsg}</div>${mj?'<div style="margin-top:8px"><button class="btn" style="width:100%" onclick="openCharacter()">＋ Nouveau personnage / monstre</button></div>':''}`;
}

function charCatDescendants(rootId){
