<style>

.turn-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:70;background:#17191fe8;border:1px solid #5a426e;border-radius:9px;padding:7px 12px;box-shadow:0 8px 25px #0008}

.map-drop-hint{position:absolute;inset:0;display:none;place-items:center;background:#9b4dff18;border:2px dashed #c084fc88;z-index:60;pointer-events:none;font-size:18px;font-weight:700}.map-drop-hint.show{display:grid}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>✦ <span>NarbuDR</span></h2>
    <p id="authDesc">Connectez-vous pour rejoindre la table de jeu</p>
    <div class="field"><label>Adresse Email</label><input type="email" id="authEmail" placeholder="nom@exemple.com"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="authPassword" placeholder="••••••••"></div>
    <button class="btn primary" id="authBtn" onclick="handleAuth()" style="width:100%;margin-top:10px;padding:12px">Se connecter</button>
    <div class="auth-tabs" id="authToggleMode">
      Pas de compte ? <button onclick="toggleAuthMode(true)">Créer un compte</button>
    </div>
  </div>
</div>

<div class="app">
<aside class="sidebar">
  <div class="brand">✦ <span>NarbuDR</span></div>
  <button class="nav active" data-page="table">🗺️ <span>Table de jeu</span></button>
  <button class="nav" data-page="characters">🧙 <span>Personnages</span></button>
  <button class="nav" data-page="abilities">✨ <span>Capacités</span></button>
  <button class="nav" data-page="library">📚 <span>Bibliothèque</span></button>
  <div class="spacer"></div>
  <div class="server">Serveur Supabase<br><b>● Temps réel actif</b></div>
</aside>
<main class="main">
<header class="top"><h1 id="pageTitle">Table de jeu</h1><div class="actions"><button class="btn primary" onclick="render()">🔄 Rafraîchir</button></div></header>

<section class="content" id="content"></section>
</main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="targeting-banner" id="targetingBanner"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= CONFIGURATION SUPABASE ============================= */
const SUPABASE_URL = "https://hrnwadoceetyscndbkgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Smcvfpk46VOcV5EBJAScuQ_kgv-KRw4";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let isSignUpMode = false;

// Identifiant secret de votre compte Maître du Jeu
const MJ_UUID = "17b03a0a-f866-4d92-b668-f8c70884b8b1";

function isMJ() {
  return currentUser && currentUser.id === MJ_UUID;
}

// Vérifier la session au chargement
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('authOverlay').style.display = 'none';
    initGameNetwork();
  }
});

function toggleAuthMode(signUp) {
  isSignUpMode = signUp;
  document.getElementById('authDesc').textContent = signUp ? "Créez votre compte de joueur" : "Connectez-vous pour rejoindre la table de jeu";
  document.getElementById('authBtn').textContent = signUp ? "S'inscrire" : "Se connecter";
  document.getElementById('authToggleMode').innerHTML = signUp ? 
    `Déjà un compte ? <button onclick="toggleAuthMode(false)">Se connecter</button>` : 
    `Pas de compte ? <button onclick="toggleAuthMode(true)">Créer un compte</button>`;
}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { toast("⚠️ Veuillez remplir tous les champs."); return; }
  
  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = "Chargement...";

  if (isSignUpMode) {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; return; }
    toast("✅ Compte créé ! Connexion...");
  }
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; return; }
  
  currentUser = data.user;
  document.getElementById('authOverlay').style.display = 'none';
  initGameNetwork();
}

/* ============================= DONNÉES DE BASE ============================= */
const DEFAULT={
  characters:[
    {id:'p1',name:'Zephyr',type:'player',icon:'🧙',move:6,stats:{Force:40,Magie:76,Agilité:82,Vitesse:41},resourcesMax:{Vie:290,Mana:215,Bouclier:100},def:{CA:16,DM:5},res:{Feu:0,Eau:0,Terre:0,Air:0,Glace:0,Foudre:0,Lumière:0,Ténèbres:0},visibleForPlayers:true},
    {id:'m1',name:'Golem de cendre',type:'enemy',icon:'👹',move:5,stats:{Force:80,Magie:20,Vitesse:15},resourcesMax:{Vie:50,Mana:0,Bouclier:2},def:{CA:12,DM:2},res:{Feu:20,Eau:0,Terre:30,Air:0,Glace:10,Foudre:-10,Lumière:0,Ténèbres:0},visibleForPlayers:false},
    {id:'m2',name:'Sorcier gobelin',type:'enemy',icon:'👺',move:6,stats:{Force:35,Magie:55,Vitesse:20},resourcesMax:{Vie:65,Mana:30,Bouclier:0},def:{CA:10,DM:3},res:{Feu:0,Eau:0,Terre:0,Air:15,Glace:0,Foudre:0,Lumière:0,Ténèbres:20},visibleForPlayers:false}
  ],
  abilities:[
    {id:'a1',name:"Balle d'air",icon:'💨',type:'Sort',formula:'3d20',stat:'Magie',defense:'DM',element:'Air',area:'single',areaSize:1,range:8,manaCost:10,characterIds:['p1'],desc:"Projectile perforant.",effect:'💨'},
    {id:'a2',name:'Explosion de feu',icon:'🔥',type:'Sort',formula:'2d20 + 5',stat:'Magie',defense:'DM',element:'Feu',area:'square',areaSize:4,range:6,manaCost:30,characterIds:['p1'],desc:"Explosion de zone.",effect:'🔥'}
  ],
  instances:[],
  map:{cols:18,rows:12,cell:44},
  chat:[]
};

let S = structuredClone(DEFAULT);
let mapZoom=1, mapPan={x:0,y:0};
let combat={active:false,order:[],turn:0,initiatives:{}};
let collapsedAssets={players:false,enemies:false};
let sidePanelTab='library';
let stageFullscreen=false;
let dragCandidate=null;
let panState=null;
let currentPage='table';
let selectedToken=null;
let activeAbility=null;
let hoverCell=null;

/* ============================= LOGIQUE RÉSEAU TEMPS REEL ============================= */
async function initGameNetwork() {
  const resChars = await supabaseClient.from('characters').select('*');
  const resAbils = await supabaseClient.from('abilities').select('*');
  const resInsts = await supabaseClient.from('instances').select('*');

  if (resChars.data && resChars.data.length > 0) S.characters = resChars.data;
  if (resAbils.data && resAbils.data.length > 0) S.abilities = resAbils.data;
  if (resInsts.data) S.instances = resInsts.data;

  if (!resChars.data || resChars.data.length === 0) {
    await supabaseClient.from('characters').insert(DEFAULT.characters);
    await supabaseClient.from('abilities').insert(DEFAULT.abilities);
    S.characters = DEFAULT.characters;
    S.abilities = DEFAULT.abilities;
  }

  // Écoute dynamique de Supabase Realtime
  supabaseClient.channel('table-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'instances' }, payload => {
      if (payload.eventType === 'INSERT') {
        S.instances.push(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const idx = S.instances.findIndex(i => i.id === payload.new.id);
        if (idx !== -1) S.instances[idx] = payload.new;
      } else if (payload.eventType === 'DELETE') {
        S.instances = S.instances.filter(i => i.id !== payload.old.id);
      }
      render();
    })
    .subscribe();

  render();
}


/* ============================= UTILITAIRES ============================= */
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1800);}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function opt(value,label,current){return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`;}
function parseNum(v){const n=+v;return Number.isFinite(n)?n:0;}
function char(id){return S.characters.find(c=>c.id===id);}
function inst(id){return S.instances.find(i=>i.id===id);}
function instTemplate(instance){return instance?char(instance.charId):null;}
function characterAbilities(charId){return S.abilities.filter(a=>(a.characterIds||[]).includes(charId));}
function pct(v,m){return m?Math.max(0,Math.min(100,v/m*100)):0;}

function roll(expr){
  expr=String(expr).replace(/\s+/g,''); let bonus=0;
  const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
  const m=expr.match(/(\d*)d(\d+)/i); if(!m)return {total:(+expr||0)+bonus,rolls:[],bonus};
  const n=+(m[1]||1), sides=+m[2], rolls=[]; for(let i=0;i<n;i++)rolls.push(1+Math.floor(Math.random()*sides));
  return {total:rolls.reduce((a,x)=>a+x,0)+bonus,rolls,bonus};
}
function outcome(d){
  if(d===100)return ['Échec ultime',0]; if(d>=95)return ['Échec critique',0]; if(d>=90)return ['Échec',0];
  if(d>=75)return ['Légère réussite',.5]; if(d>=50)return ['Légère réussite',.75]; if(d>=25)return ['Réussite',1];
  return ['Réussite critique',2];
}
function addLog(html){S.chat.push(html); if(S.chat.length>120)S.chat.shift();}

/* ============================= TOKENS ============================= */
function isOccupied(x,y,excludeId){return S.instances.some(i=>i.id!==excludeId&&i.x===x&&i.y===y);}
function findFreeCell(x,y,excludeId){
  if(!isOccupied(x,y,excludeId))return [x,y];
  for(let r=1;r<=18;r++){
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=S.map.cols||ny>=S.map.rows)continue;
      if(!isOccupied(nx,ny,excludeId))return [nx,ny];
    }
  }
  return null;
}

async function spawnInstance(charId,x,y){
  if(!isMJ()) { toast("⛔ Seul le Maître du Jeu peut invoquer des pions."); return; }
  const t=char(charId); if(!t)return;
  const count=S.instances.filter(i=>i.charId===charId).length+1;
  const label=t.type==='enemy'?`${t.name} #${count}`:t.name;
  const rm=t.resourcesMax||{Vie:10,Mana:0,Bouclier:0};
  
  const newInst={
    id:'i'+Date.now().toString(36), charId, label, x, y,
    hp:rm.Vie||0, hp_max:rm.Vie||0, mana:rm.Mana||0, mana_max:rm.Mana||0, 
    shield:rm.Bouclier||0, shield_max:rm.Bouclier||0, remaining_move:t.move??6,
    owner_id: null
  };
  
  await supabaseClient.from('instances').insert([newInst]);
}

async function removeInstance(id){
  if(!isMJ()) { toast("⛔ Seul le MJ peut retirer des pions."); return; }
  await supabaseClient.from('instances').delete().eq('id', id);
  if(selectedToken===id)selectedToken=null;
}

async function updateInstanceOnServer(t) {
  await supabaseClient.from('instances').update({
    x: t.x, y: t.y, hp: t.hp, mana: t.mana, shield: t.shield, remaining_move: t.remaining_move
  }).eq('id', t.id);
}

/* ============================= RENDU ============================= */
function render(){
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===currentPage));
  const c=document.getElementById('content'); if(!c)return;
  if(currentPage==='table')c.innerHTML=tablePage();
  else if(currentPage==='characters')c.innerHTML=charactersPage();
  else if(currentPage==='abilities')c.innerHTML=abilitiesPage();
  else if(currentPage==='library')c.innerHTML=libraryPage();
  updateTargetingBanner();
  if(currentPage==='table')setupMapInteractions();
}

function updateTargetingBanner(){
  const banner=document.getElementById('targetingBanner'); if(!banner)return;
  const a=activeAbility?S.abilities.find(x=>x.id===activeAbility):null;
  if(a&&currentPage==='table'){
    banner.innerHTML=`🎯 Capacité active : ${a.icon} <b>${esc(a.name)}</b> — Clique sur une case (Échap pour annuler)`;
    banner.classList.add('show');
  }else{
    banner.classList.remove('show');
  }
}

function tablePage(){
  return `<div class="map-layout" id="mapLayout">
  <div class="card map-card">
    <div class="map-toolbar">
      <button class="btn" onclick="toggleFullscreen()">${stageFullscreen?'✕':'⛶ Plein écran'}</button>
      ${isMJ() ? `<span class="pill" style="background:#5c2493">👑 Mode MJ</span>` : `<span class="pill" style="background:#245393">🧙 Mode Joueur</span>`}
    </div>
    <div class="map-wrap" id="mapWrap">
      <div class="map" id="map" style="width:${S.map.cols*S.map.cell}px;height:${S.map.rows*S.map.cell}px">${mapCells()}${tokensHtml()}</div>
    </div>
    <div class="bottom-abilities">${(() => {
      const selInst=selectedToken?inst(selectedToken):null;
      if(!selInst)return '<span class="tiny muted">Sélectionnez un pion sur la carte.</span>';
      return characterAbilities(selInst.charId).map(a=>`<button class="btn ${activeAbility===a.id?'primary':''}" onclick="startAbility('${a.id}')">${a.icon} ${esc(a.name)}</button>`).join('');
    })()}</div>
  </div>
  <div class="card side-panel">${sidePanelHtml()}</div>
  </div>`;
}

function mapCells(){
  let out=''; const m=S.map;
  for(let y=0;y<m.rows;y++)for(let x=0;x<m.cols;x++)out+=`<div class="cell" style="left:${x*m.cell}px;top:${y*m.cell}px;width:${m.cell}px;height:${m.cell}px"></div>`;
  return out;
}

function tokensHtml(){
  return S.instances.map(t=>{
    const tpl=instTemplate(t); if(!tpl)return '';
    const canSeeStats = isMJ() || tpl.visibleForPlayers || tpl.type === 'player';
    const px=t.x*S.map.cell+S.map.cell/2, py=t.y*S.map.cell+S.map.cell/2;
    return `<div class="token-wrap ${selectedToken===t.id?'selected':''}" data-token="${t.id}" style="left:${px}px;top:${py}px">
      <div class="token-hud">
        ${canSeeStats ? `<div class="hud-row">❤️ ${t.hp}/${t.hp_max}</div><div class="mini-bar mini-hp"><i style="width:${pct(t.hp,t.hp_max)}%"></i></div>` : `<div class="hud-row">❤️ Caché</div>`}
      </div>
      <div class="token ${tpl.type}" title="${esc(t.label)}">${tpl.icon}</div>
      <div class="token-label">${esc(t.label)} ${!canSeeStats ? '🙈' : ''}</div>
    </div>`;
  }).join('');
}

function sidePanelHtml(){
  return `<div class="side-tabs">
    <button class="tab ${sidePanelTab==='library'?'active':''}" onclick="sidePanelTab='library';render();">📚 Bibliothèque</button>
    <button class="tab ${sidePanelTab==='chat'?'active':''}" onclick="sidePanelTab='chat';render();">💬 Chat</button>
  </div>
  <div class="asset-panel">${sidePanelTab==='library'?assetPanel():chatPanel()}</div>`;
}

function assetPanel(){
  if(!isMJ()) return `<p class="muted tiny">Seul le MJ peut glisser-déposer des monstres depuis la bibliothèque.</p>`;
  return S.characters.map(c=>`<div class="asset-item" draggable="true" ondragstart="assetDragStart(event,'${c.id}')">
    <div class="asset-icon">${c.icon}</div><b>${esc(c.name)}</b>
  </div>`).join('');
}

function chatPanel(){
  return `<h2>💬 Journal</h2><div class="log">${S.chat.slice().reverse().map(e=>`<div>${e}</div>`).join('')}</div>`;
}

/* ============================= INTERACTIONS ============================= */
function setupMapInteractions(){
  const wrap=document.getElementById('mapWrap'); if(!wrap)return;
  wrap.ondragover=e=>e.preventDefault();
  wrap.ondrop=async e=>{
    e.preventDefault(); if(!isMJ()) return;
    const charId=e.dataTransfer.getData('text/plain');
    const pt=mapPoint(e.clientX,e.clientY);
    const free=findFreeCell(pt[0],pt[1]);
    if(free) spawnInstance(charId,free[0],free[1]);
  };

  wrap.onmousedown=e=>{
    if(e.button===2){
      panState={startX:e.clientX,startY:e.clientY,origX:mapPan.x,origY:mapPan.y};
      wrap.classList.add('panning'); return;
    }
    const tw=e.target.closest('.token-wrap');
    if(tw){
      const id=tw.dataset.token; const t=inst(id);
      const canControl = isMJ() || t.owner_id === currentUser.id || instTemplate(t).type === 'player';
      if(activeAbility){
        const a=S.abilities.find(x=>x.id===activeAbility); if(a) resolveAbility(a,[t.x,t.y]);
        return;
      }
      selectedToken=id;
      if(canControl) {
        dragCandidate={id,startX:e.clientX,startY:e.clientY,origX:t.x,origY:t.y,moved:false};
      } else {
        toast("🚫 Permission refusée pour ce pion.");
      }
      render(); return;
    }
    if(selectedToken){selectedToken=null;render();}
  };

    window.onmousemove=e=>{
    if(panState){
      mapPan.x=panState.origX+(e.clientX-panState.startX); mapPan.y=panState.origY+(e.clientY-panState.startY);
      applyMapTransform(); return;
    }
    if(dragCandidate){
      dragCandidate.moved=true; const pt=mapPoint(e.clientX,e.clientY); const t=inst(dragCandidate.id);
      if(t && pt){
        // CORRECTIF ICI : On sépare bien le X du Y pour que la base de données comprenne
        t.x=pt[0]; t.y=pt[1];
        const el=document.querySelector(`[data-token="${dragCandidate.id}"]`);
        if(el){
          el.style.left=(pt[0]*S.map.cell+S.map.cell/2)+'px';
          el.style.top=(pt[1]*S.map.cell+S.map.cell/2)+'px';
        }
      }
    }
  };

  window.onmouseup=async ()=>{
    const mapWrapEl = document.getElementById('mapWrap');
    if(panState){panState=null;wrap.classList.remove('panning');}
    if(dragCandidate){
      const t=inst(dragCandidate.id);
      if(dragCandidate.moved && t){
        if(isOccupied(t.x,t.y,t.id)){
          t.x=dragCandidate.origX; t.y=dragCandidate.origY; toast("🚫 Case occupée.");
        } else {
          addLog(`↦ <b>${esc(t.label)}</b> se déplace en (${t.x+1}, ${t.y+1})`);
          await updateInstanceOnServer(t);
        }
      }
      dragCandidate=null; render();
    }
  };
}

/* ============================= SORTS ============================= */
function startAbility(id){ activeAbility=id; toast("🎯 Sélectionnez une cible sur la carte."); }
async function resolveAbility(a,start){
  const targets=S.instances.filter(i=>i.x===start && i.y===start);
  const caster=inst(selectedToken);
  if(!targets.length || !caster) { activeAbility=null; render(); return; }
  for(const t of targets){
    const r=roll(a.formula);
    if(a.type==='Soin'){
      t.hp=Math.min(t.hp_max,t.hp+r.total);
      addLog(`💚 Soin : <b>${esc(caster.label)}</b> soigne <b>${esc(t.label)}</b> de ${r.total} PV.`);
    } else {
      t.hp=Math.max(0,t.hp-r.total);
      addLog(`⚔️ Attaque : <b>${esc(caster.label)}</b> inflige ${r.total} dégâts à <b>${esc(t.label)}</b>.`);
      if(t.hp<=0) {
        addLog(`💀 <b>${esc(t.label)}</b> est KO.`);
        await supabaseClient.from('instances').delete().eq('id', t.id); continue;
      }
    }
    await updateInstanceOnServer(t);
  }
  activeAbility=null; render();
}
/* ============================= CONFIG PAGES ============================= */

  function charactersPage(){
  return `<div class="card">
    <h2>🧙 Configuration des fiches (Mode MJ uniquement)</h2>
    ${S.characters.map(c=>`<div class="ability" style="justify-content:space-between; display:flex; align-items:center; margin-bottom:8px; padding:10px;">
      <b>c.icon {esc(c.name)}</b> — \({c.type === 'player' ? 'Joueur' : 'Monstre'}\){isMJ() ? `<button class="btn ${c.visibleForPlayers ? 'primary' : ''}" onclick="toggleCharVisibility('${c.id}')">${c.visibleForPlayers ? '👁 Visible des joueurs' : '🙈 Masqué pour les joueurs'}</button>` : ''}
    </div>`).join('')}
  </div>`;
}


async function toggleCharVisibility(id) {
  if(!isMJ()) return; const c=char(id); if(!c)return;
  c.visibleForPlayers = !c.visibleForPlayers;
  await supabaseClient.from('characters').update({visibleForPlayers: c.visibleForPlayers}).eq('id', id);
  render();
}

function abilitiesPage(){ return `<div class="card"><h2>✨ Capacités</h2><p class="muted">Gérées automatiquement en ligne.</p></div>`; }
function libraryPage(){ return `<div class="card"><h2>📚 Bibliothèque</h2><p class="muted">Contenu synchronisé.</p></div>`; }
function assetDragStart(ev,charId){ ev.dataTransfer.setData('text/plain',charId); }
function toggleFullscreen(){ stageFullscreen=!stageFullscreen; document.body.classList.toggle('stage-fullscreen',stageFullscreen); render(); }

document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{currentPage=n.dataset.page;activeAbility=null;render();});
</script>
</body>
</html>
