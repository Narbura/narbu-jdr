    if(a.type==='Bouclier'){

      const amount=applyMult(Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);

    let damage=applyMult(Math.ceil(raw*mult*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
    const wpPart=weaponPhysDamage(wpRaw,mult,casterTpl.stats[a.stat]||0,a.dmgMult,lines);
    const elemParts=elemBonusDamage(elemRoll.list,mult,casterTpl.stats[a.stat]||0,a.dmgMult,tTpl,t,lines);
    const fin=finalizeDamage([{raw:damage,el:a.element,pool:a.defense==='CA'?'CA':(a.defense==='DM'?'DM':null)},{raw:wpPart,el:'Physique',pool:'CA'},...elemParts],tTpl,t);

function tokenInPersistentZone(t,z){

  if(z.area==='self'){

function applyPersistentZones(nt,onlyDamage){

  const tTpl=instTemplate(nt);
  S.persistentZones.forEach(z=>{
    if(!inst(nt.id)||nt.isKO)return;

function applyRest(ratio){
  if(!isMJ())return;
  if(S.combat.active){toast('⛔ Repos impossible pendant le combat.');return;}
  const players=S.instances.filter(t=>instTemplate(t)?.type==='player'&&!t.isKO);
  if(!players.length){toast('⚠️ Aucun joueur sur la carte.');return;}
  const lines=[`${ratio>=1?'🛏️ <b>Repos long</b>':'🏕️ <b>Repos court</b>'} — PV et mana restaurés à ${Math.round(ratio*100)}%.`];
  players.forEach(t=>{
    const hpGain=Math.min(t.hpMax-t.hp,Math.ceil(t.hpMax*ratio));
    const manaGain=Math.min(t.manaMax-t.mana,Math.ceil(t.manaMax*ratio));
    t.hp+=Math.max(0,hpGain); t.mana+=Math.max(0,manaGain);

function getHotkeyMap(){try{return JSON.parse(localStorage.getItem('narbudr-my-hotkeys')||'{}');}catch(e){return {};}}
function setHotkeyMap(m){localStorage.setItem('narbudr-my-hotkeys',JSON.stringify(m));saveUiPrefsToProfile();}
function myHotkeyFor(charId,abilityId){return (getHotkeyMap()[charId]||{})[abilityId]||null;}
function uiCtx(id){return `oncontextmenu="event.preventDefault();promptSetHotkey('__ui__','${id}')"`;}
function hkTag(id){const k=myHotkeyFor('__ui__',id);return k?`[${esc(k)}] `:'';}
function promptSetHotkey(charId,abilityId){
  const key=prompt('Touche pour ce raccourci (1-9, lettre, ou symbole comme & é " \' ( § è ! ç à) — laisse vide pour retirer :','');
  if(key===null)return;
  const m=getHotkeyMap();
  if(!m[charId])m[charId]={};
  const trimmed=key;
  if(!trimmed){delete m[charId][abilityId];}
  else if(/^\S$/.test(trimmed)){
    Object.keys(m[charId]).forEach(aid=>{if(m[charId][aid]===trimmed)delete m[charId][aid];});
    m[charId][abilityId]=trimmed;
  }else{toast('⚠️ Touche invalide (un seul caractère, sans espace).');return;}
  if(charId==='__ui__'&&(abilityId==='ui_start'||abilityId==='ui_end')){const o=abilityId==='ui_start'?'ui_end':'ui_start';if(m[charId][abilityId])m[charId][o]=m[charId][abilityId];else delete m[charId][o];}
  setHotkeyMap(m);
  render();
}

function startAbility(id){
  if(!selectedToken){toast('Sélectionne d’abord un personnage sur la carte.');return;}
  if(!canControlInstance(selectedToken)){toast('⛔ Vous ne contrôlez pas ce personnage.');return;}
  if(S.combat.active&&S.combat.order[S.combat.turn]!==selectedToken){toast('⏳ Ce n’est pas le tour de ce personnage.');return;}
  const caster=inst(selectedToken);
  if(caster?.isKO){toast('💀 Ce personnage est inconscient.');return;}
  const a=S.abilities.find(x=>x.id===id); if(!a)return;
  if(a.type==='Compétence'){toast('🎓 Les compétences sont passives.');return;}
  if(a.type==='Passif'){ toggleAuraForCaster(id); return; }
  if(a.type==='Transformation'&&a.manaCost>0&&caster&&(caster.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${caster.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    return;
  }
  if(a.type==='Transformation'){ castTransformation(a); return; }
  if(a.area==='self'){
    if(a.type==='Persistant')resolvePersistentAbility(a,caster,[caster.x,caster.y]);
    else if(a.type==='Buff')resolveBuffZone(a,caster,[caster.x,caster.y]);
    else resolveAbility(a,[caster.x,caster.y]);
    return;
  }
  pendingPersistentOrigin=(a.type==='Persistant'&&(a.area==='line'||a.area==='cone'))?{abilityId:id}:null;
  activeAbility=id; hoverCell=null; render();
  toast(pendingPersistentOrigin?'🎯 La zone suit la souris — ←/→ ou clic droit maintenu pour orienter, clic pour lancer':'🎯 Ciblage : clique sur une cible ou une case (Échap pour annuler)');
}
function transformInstance(instId,targetCharId,allowRevert){
  const t=inst(instId); const newChar=char(targetCharId);
  if(!t||!newChar)return false;
  if(allowRevert){
    if(!t.origForm)t.origForm={charId:t.charId,label:t.label,hp:t.hp,hpMax:t.hpMax,mana:t.mana,manaMax:t.manaMax,shield:t.shield,shieldMax:t.shieldMax};
  }else t.origForm=null;
  t.savedForms=t.savedForms||{};
  const sv=allowRevert?t.savedForms[targetCharId]:null;
  t.charId=targetCharId;
  t.label=newChar.name;
  if(sv){
    t.hpMax=sv.hpMax; t.hp=sv.hp; t.manaMax=sv.manaMax; t.mana=sv.mana; t.shieldMax=sv.shieldMax; t.shield=sv.shield;
  }else{
    t.hpMax=newChar.resourcesMax?.Vie||1; t.hp=t.hpMax;
    t.manaMax=newChar.resourcesMax?.Mana||0; t.mana=t.manaMax;
    t.shieldMax=newChar.resourcesMax?.Bouclier||0; t.shield=t.shieldMax;
  }
  t.isKO=false; t.movementBlocked=false; t.transformedByKO=false;
  return true;
}
function revertButtonHtml(selInst){
  if(!selInst||!selInst.origForm)return '';
  return `<button class="btn" onclick="revertTransformation()" title="Reprendre ta forme d'origine (PV / mana / bouclier d'avant la transformation)">↩️ Détransformer</button>`;
}
function revertTransformation(){
  {const tk=selectedToken?inst(selectedToken):null; if(tk&&tk.transformedByKO&&S.combat.active){toast('💀 Vous êtes dans un état trop critique pour reprendre votre forme précédente.');return;}}
  if(!selectedToken){toast('Sélectionne d’abord un personnage.');return;}
  if(!canControlInstance(selectedToken)){toast('⛔ Vous ne contrôlez pas ce personnage.');return;}
  if(S.combat.active&&S.combat.order[S.combat.turn]!==selectedToken){toast('⏳ Ce n’est pas le tour de ce personnage.');return;}
  const t=inst(selectedToken); if(!t||!t.origForm)return;
  const o=t.origForm;
  if(!char(o.charId)){toast('⚠️ La forme d’origine n’existe plus.');return;}
  const fromName=t.label;
  t.savedForms=t.savedForms||{};
  t.savedForms[t.charId]={hp:t.hp,hpMax:t.hpMax,mana:t.mana,manaMax:t.manaMax,shield:t.shield,shieldMax:t.shieldMax};
  t.charId=o.charId; t.label=o.label;
  t.hpMax=o.hpMax; t.hp=t.transformedByKO?1:Math.max(1,o.hp);
  t.manaMax=o.manaMax; t.mana=o.mana;
  t.shieldMax=o.shieldMax; t.shield=o.shield;
  t.origForm=null; t.isKO=false; t.movementBlocked=false; t.transformedByKO=false;
  addLog(`↩️ <b>${esc(fromName)}</b> reprend sa forme d'origine : <b>${esc(t.label)}</b>.`);
  activeAbility=null; hoverCell=null;
  if(S.combat.active&&S.combat.order[S.combat.turn]===t.id)advanceTurn();
  saveState(); render();
}
function castTransformation(a){
  if(!a.transformCharId||!char(a.transformCharId)){toast('⚠️ Cette capacité n’a pas de personnage de transformation valide.');return;}
  const caster=inst(selectedToken); if(!caster)return;
  const fromName=caster.label;
  if(a.manaCost>0)caster.mana=Math.max(0,(caster.mana||0)-a.manaCost);
  transformInstance(caster.id,a.transformCharId,a.allowRevert);
  addLog(`🔄 <b>${esc(fromName)}</b> se transforme en <b>${esc(caster.label)}</b> (${esc(a.name)}).`);
  activeAbility=null; hoverCell=null;
  if(S.combat.active&&S.combat.order[S.combat.turn]===caster.id)advanceTurn();
  saveState(); render();
}
function handleInstanceDeath(t,killer){
  const tpl=instTemplate(t);
  const options=tpl?characterAbilities(tpl.id).filter(a=>a.type==='Transformation'&&a.triggerOnDeath):[];
  const usable=options.find(a=>a.transformCharId&&char(a.transformCharId)&&(t.mana||0)>=(a.manaCost||0));
  if(usable){
    const fromName=t.label;
    if(usable.manaCost>0)t.mana=Math.max(0,(t.mana||0)-usable.manaCost);
    transformInstance(t.id,usable.transformCharId,usable.allowRevert);
    t.transformedByKO=!!usable.allowRevert;
    addLog(`💀➡️🔄 <b>${esc(fromName)}</b> tombe à 0 PV et se transforme automatiquement en <b>${esc(t.label)}</b> (${esc(usable.name)}).`);
  }else if(tpl&&tpl.type==='player'){
    if(t.isKO){
      addLog(`💀 <b>${esc(t.label)}</b> succombe définitivement et est retiré de la carte.`);
      removeInstance(t.id);
    }else{
      t.isKO=true;
      t.movementBlocked=true;
      t.hp=t.hpMax;
      addLog(`💀 <b>${esc(t.label)}</b> tombe inconscient (KO).`);
    }
  }else{
    awardXp(killer,tpl);
    removeInstance(t.id);
  }
}

function saveCharacter(id){
  if(!isMJ()){toast('⛔ Seul le MJ peut créer ou modifier les fiches.');return;}
  const c=id?char(id):{id:'c'+Date.now()};
  c.name=document.getElementById('c_name').value||'Sans nom';
  c.icon=document.getElementById('c_icon').value||'🧙';
  c.iconImage=document.getElementById('c_iconimage').value.trim()||null;
  c.type=document.getElementById('c_type').value;
  c.move=parseNum(document.getElementById('c_move').value)||6;
  const oldSW=c.sizeW||1, oldSH=c.sizeH||1;
  c.sizeW=Math.max(1,Math.min(20,Math.round(parseNum(document.getElementById('c_sizew').value))||1));
  c.sizeH=Math.max(1,Math.min(20,Math.round(parseNum(document.getElementById('c_sizeh').value))||1));
  const tplSizeChanged=(c.sizeW!==oldSW||c.sizeH!==oldSH);
  c.ownerId=document.getElementById('c_owner').value||null;
  c.categoryId=document.getElementById('c_category').value||null;
  c.hidden=document.getElementById('c_hidden').value==='true';
  c.critDurabilityDmg=Math.max(0,parseNum(document.getElementById('c_critdur').value)||0);
  c.ultimateDurabilityDmg=Math.max(0,parseNum(document.getElementById('c_ultdur').value)||0);
  c.profileImage=document.getElementById('c_profileimage').value.trim()||null;
  const oldLevel=c.level||1;
  c.level=Math.max(1,Math.round(parseNum(document.getElementById('c_level').value))||1);
  c.xp=Math.max(0,Math.round(parseNum(document.getElementById('c_xp').value)));
  c.xp=Math.min(c.xp,xpNeeded(c.level)-1);
  c.xpValue=Math.max(0,Math.round(parseNum(document.getElementById('c_xpvalue').value)));
  c.bio=rteHtml('c_bio');
  c.inventory=rteHtml('c_inventory');
  c.resourcesMax={Vie:maxHpFromCon(document.getElementById('s_con').value),Mana:parseNum(document.getElementById('c_manamax').value),Bouclier:parseNum(document.getElementById('c_shieldmax').value)};
  c.stats={...(c.stats||{}),Constitution:parseNum(document.getElementById('s_con').value),Endurance:parseNum(document.getElementById('s_end').value),Social:parseNum(document.getElementById('s_soc').value),Artisanat:parseNum(document.getElementById('s_craft').value),Force:parseNum(document.getElementById('s_force').value),Magie:parseNum(document.getElementById('s_magic').value),Agilité:parseNum(document.getElementById('s_agi').value),Vitesse:parseNum(document.getElementById('s_speed').value)};
  reconcileLevelPoints(c);
  c.resourcesMax.Vie=maxHpFromCon(c.stats.Constitution);
  c.def={CA:parseNum(document.getElementById('d_ca').value),DM:parseNum(document.getElementById('d_dm').value),'CA naturelle':parseNum(document.getElementById('d_ca').value)};
  c.res={
    Feu:parseNum(document.getElementById('r_fire').value),
    Eau:parseNum(document.getElementById('r_eau').value),
    Terre:parseNum(document.getElementById('r_terre').value),
    Air:parseNum(document.getElementById('r_air').value),
    Glace:parseNum(document.getElementById('r_glace').value),
    Foudre:parseNum(document.getElementById('r_foudre').value),
    Lumière:parseNum(document.getElementById('r_lumiere').value),
    Ténèbres:parseNum(document.getElementById('r_tenebres').value),
    Poison:parseNum(document.getElementById('r_poison').value)
  };
  c.oppAttack={formula:document.getElementById('oa_formula').value.trim(),type:document.getElementById('oa_type').value,element:document.getElementById('oa_element').value,impactImage:document.getElementById('oa_impact').value.trim()||null,impactFrames:Math.max(1,parseNum(document.getElementById('oa_impact_frames').value)||1),impactRows:Math.max(1,parseNum(document.getElementById('oa_impact_rows').value)||1),animFps:Math.max(1,Math.min(60,parseNum(document.getElementById('oa_animfps').value)||60)),spriteAuto:document.getElementById('oa_spriteauto').value||false};
  const skChecks=[...document.querySelectorAll('.skill-active-check')];
  if(skChecks.length)c.inactiveSkills=skChecks.filter(el=>!el.checked).map(el=>el.value);
  if(c.type==='player'){
    c.equipmentSlots=c.equipmentSlots||{};
    const oldSlots={...c.equipmentSlots};
    EQUIP_SLOTS.forEach(([k])=>{const el=document.getElementById('eqslot_'+k);if(el)c.equipmentSlots[k]=el.value||null;});
    c.equipmentSlots.diversIds=[...document.querySelectorAll('.eq-divers-check:checked')].map(el=>el.value);
    EQUIP_SLOTS.forEach(([k])=>{if(oldSlots[k]!==c.equipmentSlots[k]&&c.eqDur)delete c.eqDur[k];});
  }
  if(!id)S.characters.push(c);
  S.instances.filter(i=>i.charId===c.id).forEach(i=>{
    i.hpMax=c.resourcesMax.Vie; i.manaMax=c.resourcesMax.Mana; i.shieldMax=c.resourcesMax.Bouclier;
    i.hp=Math.min(i.hp,i.hpMax); i.mana=Math.min(i.mana,i.manaMax); i.shield=Math.min(i.shield,i.shieldMax);
    let newW=i.sizeW||1, newH=i.sizeH||1, sizeDirty=false;
    document.querySelectorAll(`#modal input[data-inst="${i.id}"][data-dirty="1"]`).forEach(el=>{
      const v=Math.round(parseNum(el.value));
      if(el.dataset.field==='hp')i.hp=Math.max(0,Math.min(i.hpMax,v));
      else if(el.dataset.field==='mana')i.mana=Math.max(0,Math.min(i.manaMax,v));
      else if(el.dataset.field==='sizew'){newW=Math.max(1,Math.min(20,v));sizeDirty=true;}
      else if(el.dataset.field==='sizeh'){newH=Math.max(1,Math.min(20,v));sizeDirty=true;}
    });
    if(!sizeDirty&&tplSizeChanged){newW=c.sizeW;newH=c.sizeH;sizeDirty=true;}
    if(sizeDirty){
      if(footprintOverlap(i.id,i.x,i.y,newW,newH)){
        toast(`🚫 Taille de ${i.label} inchangée — chevauche un autre jeton ou dépasse la carte.`);
      }else{
        i.sizeW=newW; i.sizeH=newH;
        c.sizeW=newW; c.sizeH=newH;
      }
    }
    if(i.hp<=0){addLog(`💀 <b>${esc(i.label)}</b> tombe à 0 PV.`);handleInstanceDeath(i);}
  });
  if(id&&c.level>oldLevel)levelUpChar(c.id);
  saveState(); closeModal(); render();
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');const m=document.getElementById('modal');m.classList.remove('modal-fullscreen');m.classList.remove('note-focus-mode');noteFocusMode=false;sheetModalChar=null;m.style.position='';m.style.left='';m.style.top='';m.style.margin='';}
/* Déplacer / agrandir la fenêtre modale à la souris */
let modalDrag=null;
document.addEventListener('mousedown',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  const modal=document.getElementById('modal');
  if(modal.classList.contains('modal-fullscreen'))return;
  const rect=modal.getBoundingClientRect();
  modal.style.position='fixed'; modal.style.left=rect.left+'px'; modal.style.top=rect.top+'px'; modal.style.margin='0';
  modalDrag={startX:e.clientX,startY:e.clientY,origLeft:rect.left,origTop:rect.top};
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!modalDrag)return;
  const modal=document.getElementById('modal');
  modal.style.left=(modalDrag.origLeft+(e.clientX-modalDrag.startX))+'px';
  modal.style.top=(modalDrag.origTop+(e.clientY-modalDrag.startY))+'px';
});
document.addEventListener('mouseup',()=>{modalDrag=null;});
document.addEventListener('dblclick',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  document.getElementById('modal').classList.toggle('modal-fullscreen');
});

}
function onAbilitySearchInput(v){abilitySearchQuery=v;const c=document.getElementById('abilityResultsContainer');if(c)c.innerHTML=abilityResultsHtml();}
function onAbilityTypeFilter(v){abilityTypeFilter=v;const c=document.getElementById('abilityResultsContainer');if(c)c.innerHTML=abilityResultsHtml();}
function onAbilityCharFilter(v){abilityCharFilter=v;const c=document.getElementById('abilityResultsContainer');if(c)c.innerHTML=abilityResultsHtml();}
function abilityResultsHtml(){
  const mj=isMJ();
  const q=abilitySearchQuery.trim().toLowerCase();
  let list=S.abilities;
  if(q)list=list.filter(a=>a.name.toLowerCase().includes(q));
  if(abilityTypeFilter)list=list.filter(a=>a.type===abilityTypeFilter);
  if(abilityCharFilter)list=list.filter(a=>(a.characterIds||[]).includes(abilityCharFilter));
  if(!list.length)return '<p class="tiny muted">Aucune capacité ne correspond.</p>';
  return list.map(a=>{
    const linked=(a.characterIds||[]).map(cid=>char(cid)).filter(Boolean);
    const linkedText=linked.length?linked.map(c=>c.name).join(', '):'aucun personnage lié';
    const isTransfo=a.type==='Transformation';
    const infoLine=isTransfo
      ? `Transformation → ${esc(char(a.transformCharId)?.name||'—')} · Mana ${a.manaCost||0} · Auto à la mort : ${a.triggerOnDeath?'Oui':'Non'}`
      : a.type==='Compétence'
      ? `Compétence · ${a.skillStat&&a.skillMod?esc(a.skillStat)+' '+(a.skillMod>0?'+':'')+a.skillMod:'aucun effet sur les jets'}`
      : a.type==='Passif'
      ? `Aura (${esc(a.area)} ${a.areaSize}) · ${esc(a.formula)} · Effet : ${a.auraEffect==='heal'?'Soin':a.auraEffect==='shield'?'Bouclier':'Dégâts'} · Mana/tick ${a.manaCost||0}`
      : a.type==='Buff'
      ? `Buff/Débuff · ${esc(a.formula)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?'Ligne droite':a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3}`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · ${a.duration} tour(s) · Portée ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`
      : a.type==='Persistant'
      ? `Zone persistante · ${esc(a.formula)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?`Ligne (zone ${a.zoneRange||a.range} cases)`:a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3} (zone ${a.zoneRange||a.range} cases)`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · ${a.duration} tour(s) · Portée origine ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`
      : `${esc(a.type)}${a.hotkey?` [${esc(a.hotkey)}]`:''} · ${esc(a.formula)} · ${esc(a.stat)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?'Ligne droite':a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3}`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · Portée ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`;
    return `<div class="ability"><div class="icon">${iconBoxHtml(a,'9px')}</div><div class="ability-info"><b>${esc(a.name)}</b><small>${infoLine} · Niv. ${a.level||1}</small><br><small class="muted">🔗 ${esc(linkedText)}</small></div>${mj?`<button class="btn" onclick="openAbility('${a.id}')">Modifier</button>${isTransfo?'':`<button class="btn ghost" onclick="openAdvancedAbility('${a.id}')" title="Aperçu macro">🔴</button>`}`:''}</div>`;
  }).join('');
}
function openAbility(id){

  const defOpts=[['DM',"Défense magique"],['CA',"Classe d'armure"],['none','Aucune']].map(([v,l])=>opt(v,l,a.defense)).join('');

  const linkedIds=a.characterIds||[];

  <div class="field full">
    <label>Icône personnalisée (remplace l'emoji partout)</label>
    <div class="icon-dropzone" onclick="document.getElementById('a_icon_file').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleIconDrop(event,'a_iconimage','a_icon_preview')">
      <div id="a_icon_preview" class="icon-preview">${a.iconImage?`<img src="${esc(a.iconImage)}">`:`<span>${esc(a.icon)}</span>`}</div>
      <p class="tiny muted">Glisse une image ici (PNG/JPG/WebP), ou clique pour parcourir</p>
      <input type="file" id="a_icon_file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="handleIconFileInput(event,'a_iconimage','a_icon_preview')">
    </div>

    ${a.iconImage?`<button type="button" class="btn ghost" style="margin-top:6px" onclick="clearIconImage('a_iconimage','a_icon_preview',document.getElementById('a_icon').value)">↺ Revenir à l'emoji</button>`:''}
    ${imagePickerHtml('a_iconimage','a_icon_preview')}
  </div>
  <div class="field"><label>Type</label><select id="a_type" onchange="toggleAbilityTypeFields()">${typeOpts}</select></div>
  <div class="field"><label>Niveau de la capacité</label><input id="a_level" type="number" min="1" value="${a.level||1}"></div>

  <div class="field" id="ability_passif_extra" style="display:${a.type==='Passif'?'':'none'}"><label>Effet de l'aura</label><select id="a_auraeffect">${opt('damage','Dégâts',a.auraEffect)}${opt('heal','Soin',a.auraEffect)}${opt('shield','Bouclier',a.auraEffect)}</select><p class="tiny muted">Aura auto-centrée sur le lanceur (zone = Carré ou Cercle uniquement), se déclenche à chaque début de son tour.</p></div>
  <div class="field" id="ability_buff_extra" style="display:${(a.type==='Buff'||a.type==='Persistant')?'':'none'}"><label>Durée (tours)</label><input id="a_duration" type="number" min="1" value="${a.duration||3}"><p class="tiny muted">${a.type==='Persistant'?"Nombre de tours avant que la zone persistante ne s'estompe. Chaque token qui commence son tour dans la zone subit l'effet (calculé comme si le lanceur agissait à chaque fois).":"Cible unique ou zone (voir champ Zone ci-dessous). Effet auto à chaque début de tour de la/les cible(s) pendant N tours. Choisis toi-même la défense ciblée (dont « Aucune »)."}</p></div>

  <div class="field" id="a_coneend_field" style="display:${a.area==='cone'?'':'none'}"><label>Largeur à l'arrivée (cases)</label><input id="a_coneend" type="number" min="1" value="${a.coneEnd||3}"></div>

function saveAbility(id){
  if(!isMJ()){toast('⛔ Seul le MJ peut créer ou modifier les capacités.');return;}
  const target=id?S.abilities.find(x=>x.id===id):{id:'a'+Date.now()};
  target.name=document.getElementById('a_name').value||'Capacité';
  target.icon=document.getElementById('a_icon').value||'✨';
  target.iconImage=document.getElementById('a_iconimage').value.trim()||null;
  target.type=document.getElementById('a_type').value;
  target.manaCost=Math.max(0,+document.getElementById('a_manacost').value||0);
  target.level=Math.max(1,Math.round(+document.getElementById('a_level').value||1));
  if(target.type==='Transformation'){
    target.transformCharId=document.getElementById('a_transformchar').value||null;
    target.triggerOnDeath=document.getElementById('a_triggerondeath').checked;
    target.allowRevert=document.getElementById('a_allowrevert').checked;
    target.formula='0'; target.stat='Force'; target.defense='none'; target.element='Neutre';
    target.area='single'; target.areaSize=1; target.range=0; target.desc=''; target.effect=''; target.dmgMult=''; target.atkDice='1d100';
  }else if(target.type==='Compétence'){
    target.formula='0'; target.stat='Force'; target.defense='none'; target.element='Neutre';
    target.area='single'; target.areaSize=1; target.range=0; target.effect=''; target.dmgMult=''; target.atkDice='1d100';
    target.manaCost=0; target.transformCharId=null; target.triggerOnDeath=false; target.allowRevert=false;
    target.desc=rteHtml('a_skilldesc');
    target.skillStat=document.getElementById('a_skillstat').value||'';
    target.skillMod=parseNum(document.getElementById('a_skillmod').value);
  }else{
    target.formula=document.getElementById('a_formula').value||'1d20';
    target.dmgMult=document.getElementById('a_dmgmult').value.trim();
    target.atkDice=document.getElementById('a_atkdice').value.trim()||'1d100';
    target.stat=document.getElementById('a_stat').value;
    target.defense=document.getElementById('a_def').value;
    target.element=document.getElementById('a_element').value;
    target.area=document.getElementById('a_area').value;
    target.areaSize=+document.getElementById('a_size').value||1;
    target.coneStart=Math.max(1,+document.getElementById('a_conestart').value||1);
    target.coneEnd=Math.max(1,+document.getElementById('a_coneend').value||3);
    target.range=Math.max(0,+document.getElementById('a_range').value||0);
    target.zoneRange=Math.max(1,+document.getElementById('a_zonerange').value||target.range||3);
    target.desc=rteHtml('a_desc');
    target.effect=document.getElementById('a_effect').value||'✨';
    target.impactPerToken=document.getElementById('a_impactpertoken')?.checked||false;
    target.zoneImage=document.getElementById('a_zoneimage').value.trim()||null;
    target.projectileImage=document.getElementById('a_projectile').value.trim()||null;
    target.projectileFrames=Math.max(1,+document.getElementById('a_proj_frames').value||1);
    target.projectileRows=Math.max(1,+document.getElementById('a_proj_rows').value||1);
    target.impactSpritesheet=document.getElementById('a_impact').value.trim()||null;
    target.impactFrames=Math.max(1,+document.getElementById('a_impact_frames').value||1);
    target.impactRows=Math.max(1,+document.getElementById('a_impact_rows').value||1);
    target.animFps=Math.max(1,Math.min(60,+document.getElementById('a_animfps').value||60));
    target.spriteAuto=document.getElementById('a_spriteauto')?.value||false;
    target.spinImage=(target.area==='self'?document.getElementById('a_spin')?.value.trim():'')||null;
    target.spinSpeed=Math.max(0.1,parseFloat(document.getElementById('a_spinspeed')?.value)||2);
    target.spinDuration=Math.max(0.2,parseFloat(document.getElementById('a_spindur')?.value)||1);
    target.transformCharId=null; target.triggerOnDeath=false; target.allowRevert=false;
    target.auraEffect=document.getElementById('a_auraeffect')?document.getElementById('a_auraeffect').value:'damage';
    target.duration=Math.max(1,+(document.getElementById('a_duration')?.value)||3);
    if(target.type==='Passif'){
      if(target.area!=='circle'&&target.area!=='square')target.area='square';
    }

  }
  target.characterIds=[...document.querySelectorAll('.ac-check:checked')].map(el=>el.value);
  if(!id)S.abilities.push(target);
  if(target.type==='Transformation'&&!target.transformCharId){toast('⚠️ Choisis un personnage vers lequel se transformer.');}
  saveState(); closeModal(); render();
}

const CRITICAL_LABELS={echecUltime:'💀 Échec ultime',echecCritique:'❌ Échec critique',reussiteCritique:'✨ Réussite critique',reussiteUltime:'🌟 Réussite ultime'};
function openHudSettings(){
  if(!isMJ())return;
  const hs=S.hudSettings||{};
  const critHtml=Object.entries(CRITICAL_LABELS).map(([key,label])=>{

    <div class="row" style="gap:6px;margin-top:6px;align-items:center">
      <input type="file" id="hud_${key}_audiofile" accept="audio/*" onchange="handleHudAudioInput(event,'${key}')" style="flex:1">
      <span class="tiny muted" id="hud_${key}_audiolabel">${cfg.audio?'🔊 Son défini':'Aucun son'}</span>
      ${cfg.audio?`<button type="button" class="btn ghost" onclick="clearHudAudio('${key}')">🗑️</button>`:''}
    </div>
    <input type="hidden" id="hud_${key}_audio" value="${esc(cfg.audio||'')}">
    </div>`;
  }).join('');
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>🎯 HUD et critique</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  <div class="form">

  <div class="field"><label>Durée des pop-ups critiques (ms)</label><input id="hud_critdur" type="number" min="100" value="${hs.criticalDurationMs??1000}"></div>

  document.getElementById('modalBg').classList.add('open');

async function handleHudAudioInput(ev,key){
  if(!isMJ())return;
  const file=ev.target.files[0]; if(!file)return;
  toast('⏳ Envoi du son…');
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath=`audio_${Date.now()}_${safeName}`;
    const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
    if(upErr){ toast('❌ Échec de l\'envoi : '+upErr.message); return; }
    const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
    document.getElementById(`hud_${key}_audio`).value=pub.publicUrl;
    const lbl=document.getElementById(`hud_${key}_audiolabel`); if(lbl)lbl.textContent='🔊 Son défini';
    toast('✅ Son envoyé.');
  }catch(e){ console.error('handleHudAudioInput',e); toast('❌ Erreur lors de l\'envoi du son.'); }
}
function clearHudAudio(key){
  const el=document.getElementById(`hud_${key}_audio`); if(el)el.value='';
  const lbl=document.getElementById(`hud_${key}_audiolabel`); if(lbl)lbl.textContent='Aucun son';
}
function saveHudSettings(){
  if(!isMJ())return;
  if(!S.hudSettings)S.hudSettings={};
  S.hudSettings.resourceDurationMs=Math.max(100,parseNum(document.getElementById('hud_resdur').value)||1000);
  S.hudSettings.criticalDurationMs=Math.max(100,parseNum(document.getElementById('hud_critdur').value)||1000);
  S.hudSettings.critical={};
  Object.keys(CRITICAL_LABELS).forEach(key=>{
    S.hudSettings.critical[key]={
      image:document.getElementById(`hud_${key}_img`).value.trim()||null,
      audio:document.getElementById(`hud_${key}_audio`).value.trim()||null
    };
  });
  saveState(); closeModal(); render();
  toast('✅ Réglages HUD enregistrés.');
}

function useConsumable(charId,defId){
  if(!canControlChar(charId))return;
  const c=char(charId); if(!c)return;
  const entry=(c.consumablesOwned||[]).find(x=>x.id===defId);
  if(!entry||entry.qty<=0){toast('⚠️ Aucune charge restante.');return;}
  const def=(S.consumables||[]).find(x=>x.id===defId); if(!def){toast('⚠️ Consommable introuvable.');return;}
  const targets=S.instances.filter(i=>i.charId===charId);
  if(!targets.length){toast('⚠️ Ce personnage n’a pas de jeton sur la carte.');return;}
  targets.forEach(t=>{
    if(def.resource==='Mana'){t.mana=Math.min(t.manaMax,t.mana+def.amount);broadcastHud(t.id,{mana:def.amount});}
    else {t.hp=Math.min(t.hpMax,t.hp+def.amount);broadcastHud(t.id,{hp:def.amount});}
  });
  entry.qty-=1;
  if(entry.qty<=0)c.consumablesOwned=c.consumablesOwned.filter(x=>x.id!==defId);
  addLog(`🧪 <b>${esc(c.name)}</b> utilise <b>${esc(def.name)}</b> (+${def.amount} ${def.resource==='Mana'?'💧 Mana':'❤️ PV'}).`);

function saveEquipment(id){
  if(!isMJ())return;
  if(!S.equipment)S.equipment=[];
  const target=id?S.equipment.find(x=>x.id===id):{id:'eq'+Date.now()};
  target.name=document.getElementById('eq_name').value||'Équipement';
  target.icon=document.getElementById('eq_icon').value||'🎽';
  target.iconImage=document.getElementById('eq_iconimage').value.trim()||null;
  target.image=document.getElementById('eq_image').value.trim()||null;
  target.itemType=document.getElementById('eq_itemtype').value;
  target.poids=Math.max(0,parseFloat(document.getElementById('eq_poids').value)||0);
  target.durabilityMax=Math.max(0,parseNum(document.getElementById('eq_durabilitymax')?.value)||0);
  if(target.itemType==='weapon'){
    target.category='arme';
    target.damageFormula=document.getElementById('eq_damage').value.trim();
    target.weaponStat=document.getElementById('eq_weaponstat').value||'Force';
    target.elemDamage={}; ELEMENT_RES_KEYS.forEach(k=>{const v=(document.getElementById('eq_ed_'+k)?.value||'').trim(); if(v)target.elemDamage[k]=v;});
    if(!target.damageFormula&&!weaponHasElem(target))target.damageFormula='1d20';
    target.ca=0; target.dm=0;
    target.description='';
    target.res={Feu:0,Eau:0,Terre:0,Air:0,Glace:0,Foudre:0,Lumière:0,Ténèbres:0,Poison:0};
  }else if(target.itemType==='divers'){
    target.category='divers';
    target.damageFormula='';
    target.ca=0; target.dm=0;
    target.description=document.getElementById('eq_description').value||'';
    target.res={Feu:0,Eau:0,Terre:0,Air:0,Glace:0,Foudre:0,Lumière:0,Ténèbres:0,Poison:0};
  }else{
    target.category=document.getElementById('eq_category').value||'torse';
    target.damageFormula='';
    target.description='';
    target.ca=parseNum(document.getElementById('eq_ca').value);
    target.dm=parseNum(document.getElementById('eq_dm').value);
    target.res={
      Feu:parseNum(document.getElementById('eq_r_fire').value),
      Eau:parseNum(document.getElementById('eq_r_eau').value),
      Terre:parseNum(document.getElementById('eq_r_terre').value),
      Air:parseNum(document.getElementById('eq_r_air').value),
      Glace:parseNum(document.getElementById('eq_r_glace').value),
      Foudre:parseNum(document.getElementById('eq_r_foudre').value),
      Lumière:parseNum(document.getElementById('eq_r_lumiere').value),
      Ténèbres:parseNum(document.getElementById('eq_r_tenebres').value),
      Poison:parseNum(document.getElementById('eq_r_poison').value)
    };
  }
  if(target.itemType!=='weapon')target.elemDamage={};
  if(target.itemType==='divers'||target.category==='anneau'||target.category==='amulette')target.durabilityMax=0;
  if(!id)S.equipment.push(target);
  saveState(); closeModal(); render();
}
function confirmDeleteEquipment(id){
  if(!isMJ())return;

  S.characters.forEach(c=>{if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{if(c.equipmentSlots[k]===id)c.equipmentSlots[k]=null;});}});
  S.equipment=(S.equipment||[]).filter(x=>x.id!==id);

}

function myCharacterCard(c){
  const tab=mySheetTabs[c.id]||'bio';
  const abilities=characterAbilities(c.id);

  const skillsHtml=skillList.length?skillList.map(a=>{const off=(c.inactiveSkills||[]).includes(a.id);const inf=(a.skillStat&&+a.skillMod)?`Jet de ${a.skillStat} : ${a.skillMod>0?'+':''}${a.skillMod}`:'Aucun effet sur les jets';return `<div class="ability" style="${off?'opacity:.5':''}"><div class="icon">${iconBoxHtml(a,'9px')}</div><div class="ability-info"><b>${esc(a.name)}</b> <span class="pill">Niv. ${a.level||1}</span> <span class="pill">${off?'⏸ Inactive':'✅ Active'}</span><small>${esc(inf)}</small><div class="tiny rte-view">${a.desc||''}</div></div></div>`;}).join(''):'<p class="tiny muted">Aucune compétence.</p>';

function hotbarPoolEntries(){
  const c=char(hotbarEditChar);

  const consumables=(c.consumablesOwned||[]).filter(o=>o.qty>0).map(o=>({id:o.id,def:(S.consumables||[]).find(x=>x.id===o.id)})).filter(x=>x.def);
  let entries=[
    ...STAT_TESTS.map(st=>({id:'stat_'+st,label:statTestLabel(st),icon:statTestIcon(st),type:'Test'})),
    ...abilities.map(a=>({id:a.id,label:a.name,icon:a,type:a.type})),
    ...consumables.map(o=>({id:o.id,label:o.def.name,icon:o.def,type:'Consommable'}))
  ];
  const q=hotbarPoolSearch.trim().toLowerCase();
  if(q)entries=entries.filter(e=>e.label.toLowerCase().includes(q));

}

const MAPS_BUCKET='JDR';
function handleIconDrop(ev,hiddenId,previewId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  if(!isMJ())return;
  const files=ev.dataTransfer.files;
  if(!files||!files.length)return;
  const file=files[0];
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
function handleIconFileInput(ev,hiddenId,previewId){
  if(!isMJ())return;
  const file=ev.target.files[0]; if(!file)return;
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
async function uploadIconImage(file,hiddenId,previewId){
  toast('⏳ Envoi de l’icône…');
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath=`icon_${Date.now()}_${safeName}`;
    const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
    if(upErr){ toast('❌ Échec de l’envoi : '+upErr.message); return; }
    const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
    const hidden=document.getElementById(hiddenId); if(hidden)hidden.value=pub.publicUrl;
    const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<img src="${esc(pub.publicUrl)}">`;
    const niceName=file.name.replace(/\.[^.]+$/,'');
    try{ await supabaseClient.from('image_library').insert({storage_path:filePath,display_name:niceName,category_id:null}); }catch(e2){ console.error('image_library insert',e2); }
    loadImageLibrary();
    toast('✅ Icône envoyée.');
  }catch(e){ console.error('uploadIconImage',e); toast('❌ Erreur lors de l’envoi de l’icône.'); }
}
function clearIconImage(hiddenId,previewId,fallbackEmoji){
  const hidden=document.getElementById(hiddenId); if(hidden)hidden.value='';
  const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<span>${esc(fallbackEmoji||'❓')}</span>`;
}

function loadImageDimensions(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight});
    img.onerror=()=>reject(new Error('image illisible'));
    img.src=src;
  });
}
function openMapSizeModal(onConfirm){

  <div class="field"><label>Colonnes</label><input id="map_cols_input" type="number" min="2" max="60" value="${S.map.cols||20}"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="map_cols_confirm">Valider</button></div>`;

function applyMapBackground(cols,publicUrl,naturalW,naturalH){
  const rows=Math.max(2,Math.round(cols*naturalH/naturalW));
  S.map.cols=cols; S.map.rows=rows; S.map.backgroundImage=publicUrl;
  mapZoom=1; mapPan={x:0,y:0};
  addLog(`🗺️ Le MJ a changé le fond de carte (${cols}×${rows} cases).`);
  saveState(); render();
  toast(`🗺️ Carte mise à jour (${cols}×${rows} cases).`);
}
function handleMapImageFile(file){
  const objectUrl=URL.createObjectURL(file);
  loadImageDimensions(objectUrl).then(dims=>{
    openMapSizeModal(async cols=>{
      toast('⏳ Envoi de la carte en cours…');
      try{
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const filePath=`map_${Date.now()}_${safeName}`;
        const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
        if(upErr){ toast('❌ Échec de l\'envoi : '+upErr.message); return; }
        const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
        const niceName=file.name.replace(/\.[^.]+$/,'');
        const { error:metaErr } = await supabaseClient.from('map_library').insert({storage_path:filePath,display_name:niceName,category_id:currentMapCategory});
        if(metaErr)console.error('map_library insert',metaErr);
        applyMapBackground(cols,pub.publicUrl,dims.w,dims.h);
        await loadMapLibrary(); render();
      }catch(e){ console.error('handleMapImageFile',e); toast('❌ Erreur lors de l\'envoi de la carte.'); }
      finally{ URL.revokeObjectURL(objectUrl); }
    });
  }).catch(()=>{ toast('⚠️ Impossible de lire cette image.'); URL.revokeObjectURL(objectUrl); });
}
function handleMapImageUrl(url){
  loadImageDimensions(url).then(dims=>{
    openMapSizeModal(cols=>applyMapBackground(cols,url,dims.w,dims.h));
  }).catch(()=>toast('⚠️ Impossible de charger cette image.'));
}

async function loadMapLibrary(){
  try{
    const [{data:files,error:filesErr},{data:meta,error:metaErr}] = await Promise.all([
      supabaseClient.storage.from(MAPS_BUCKET).list('',{limit:1000,sortBy:{column:'created_at',order:'desc'}}),
      supabaseClient.from('map_library').select('*')
    ]);
    if(filesErr){ console.error('loadMapLibrary(storage)',filesErr); return; }
    if(metaErr) console.error('loadMapLibrary(meta)',metaErr);
    const metaByPath={};
    (meta||[]).forEach(m=>metaByPath[m.storage_path]=m);
    const validFiles=(files||[]).filter(f=>f.name && !f.name.startsWith('.') && /^map_/i.test(f.name));
    // Rattrapage : des cartes envoyées avant la mise en place des catégories n'ont pas encore de métadonnées.
    const orphans=validFiles.filter(f=>!metaByPath[f.name]);
    if(orphans.length && isMJ()){
      for(const f of orphans){
        try{
          const { data:inserted, error:insErr } = await supabaseClient.from('map_library').insert({storage_path:f.name,display_name:f.name,category_id:null}).select().single();
          if(!insErr && inserted) metaByPath[f.name]=inserted;
        }catch(e){ console.error('backfill map_library',e); }
      }
    }
    mapLibrary=validFiles.map(f=>{
      const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(f.name);
      const m=metaByPath[f.name];
      return { id:m?.id||null, storagePath:f.name, url:pub.publicUrl, displayName:m?.display_name||f.name, categoryId:m?.category_id||null };
    });
  }catch(e){ console.error('loadMapLibrary',e); }

function descendantCategoryIds(rootId){
  const ids=[rootId];
  let frontier=[rootId];
  while(frontier.length){
    const children=mapCategories.filter(c=>frontier.includes(c.parent_id)).map(c=>c.id);
    ids.push(...children);
    frontier=children;
  }
  return ids;
}
function confirmDeleteCategory(id){
  if(!isMJ())return;
  const cat=mapCategories.find(x=>x.id===id); if(!cat)return;
  const ids=descendantCategoryIds(id);
  const affectedMaps=mapLibrary.filter(m=>ids.includes(m.categoryId));
  const subCount=ids.length-1;
  const warning=(affectedMaps.length||subCount)
    ? `Ce dossier contient ${subCount>0?`${subCount} sous-dossier(s) et `:''}${affectedMaps.length} carte(s). Les supprimer effacera <b>définitivement</b> ces cartes (fichier et fiche) de la base de données — cette action est irréversible.`
    : `Ce dossier est vide.`;
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>⚠️ Supprimer « ${esc(cat.name)} »</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  <p class="tiny muted">${warning}</p>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn" style="background:var(--danger);border-color:var(--danger)" id="cat_delete_confirm">Supprimer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('cat_delete_confirm').onclick=()=>deleteCategory(id,ids,affectedMaps);
}
async function deleteCategory(id,descendantIds,affectedMaps){
  if(!isMJ())return;
  toast('⏳ Suppression en cours…');
  try{
    if(affectedMaps.length){
      const paths=affectedMaps.map(m=>m.storagePath).filter(Boolean);
      if(paths.length){
        const { error:storErr } = await supabaseClient.storage.from(MAPS_BUCKET).remove(paths);
        if(storErr) console.error('remove storage files',storErr);
      }
      const mapIds=affectedMaps.map(m=>m.id).filter(Boolean);
      if(mapIds.length){
        const { error:delMapsErr } = await supabaseClient.from('map_library').delete().in('id',mapIds);
        if(delMapsErr) console.error('delete map_library rows',delMapsErr);
      }
    }
    const { error:delCatErr } = await supabaseClient.from('map_categories').delete().eq('id',id);
    if(delCatErr){ toast('❌ '+delCatErr.message); return; }
    const subIds=descendantIds.filter(i=>i!==id);
    if(subIds.length){
      const { error:delSubErr } = await supabaseClient.from('map_categories').delete().in('id',subIds);
      if(delSubErr) console.error('delete descendant categories',delSubErr);
    }
  }catch(e){ console.error('deleteCategory',e); toast('❌ Erreur lors de la suppression.'); return; }
  closeModal();
  if(currentMapCategory && descendantIds.includes(currentMapCategory)) currentMapCategory=null;
  await Promise.all([loadMapCategories(),loadMapLibrary()]);
  render();
  toast('🗑️ Dossier supprimé.');
}

function mapsResultsHtml(){
  const mj=isMJ();
  const query=mapSearchQuery.trim().toLowerCase();

  if(query){
    const results=mapLibrary.filter(m=>m.displayName.toLowerCase().includes(query));
    return `<div class="asset-list">${results.length?results.map(mapItemHtml).join(''):'<p class="tiny muted">Aucune carte ne correspond à cette recherche.</p>'}</div>`;
  }

  const breadcrumb=mapBreadcrumb(currentMapCategory);
  const subCats=mapCategories.filter(c=>(c.parent_id||null)===(currentMapCategory||null));
  const mapsHere=mapLibrary.filter(m=>(m.categoryId||null)===(currentMapCategory||null));
  const catsHtml=subCats.map(c=>{
    const subCount=mapCategories.filter(cc=>cc.parent_id===c.id).length;
    const mapCount=mapLibrary.filter(m=>m.categoryId===c.id).length;
    return `<div class="asset-item" onclick="openMapCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleCategoryDrop(event,'${c.id}')" style="cursor:pointer">
      <div class="asset-icon">📁</div><div class="asset-info"><b>${esc(c.name)}</b><small>${subCount} sous-dossier(s) · ${mapCount} carte(s)</small></div>
      <button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();openRenameCategoryModal('${c.id}')" title="Renommer le dossier">✏️</button>
      <button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();confirmDeleteCategory('${c.id}')" title="Supprimer le dossier">🗑️</button>
    </div>`;
  }).join('');
  const mapsHtml=mapsHere.length?mapsHere.map(mapItemHtml).join(''):'';
  const emptyMsg=(!subCats.length&&!mapsHere.length)?'<p class="tiny muted">Ce dossier est vide.</p>':'';

  return `${breadcrumb}
  <p class="tiny muted">${mj?'Glisse une image (PNG/JPG/WebP) depuis ton ordinateur directement sur la carte pour l’ajouter dans ce dossier, ou réutilise un terrain ci-dessous en le glissant sur la carte.':'Seul le MJ peut changer le fond de la carte.'}</p>
  <div class="asset-list">${catsHtml}${mapsHtml}${emptyMsg}</div>`;
}

  while(frontier.length){const children=imageCategories.filter(c=>frontier.includes(c.parent_id)).map(c=>c.id);ids.push(...children);frontier=children;}
  return ids;
}
function confirmDeleteImageCategory(id){
  if(!isMJ())return;
  const cat=imageCategories.find(x=>x.id===id); if(!cat)return;
  const ids=imageDescendantCategoryIds(id);
  const affected=imageLibrary.filter(m=>ids.includes(m.categoryId));
  const subCount=ids.length-1;
  const warning=(affected.length||subCount)
    ? `Ce dossier contient ${subCount>0?`${subCount} sous-dossier(s) et `:''}${affected.length} image(s). Les supprimer effacera <b>définitivement</b> ces images (fichier et fiche) — action irréversible.`
    : `Ce dossier est vide.`;
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>⚠️ Supprimer « ${esc(cat.name)} »</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p class="tiny muted">${warning}</p>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn" style="background:var(--danger);border-color:var(--danger)" id="imgcat_delete_confirm">Supprimer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('imgcat_delete_confirm').onclick=()=>deleteImageCategory(id,ids,affected);
}
async function deleteImageCategory(id,descendantIds,affected){
  if(!isMJ())return;
  toast('⏳ Suppression en cours…');
  try{
    if(affected.length){
      const paths=affected.map(m=>m.storagePath).filter(Boolean);
      if(paths.length){ const { error } = await supabaseClient.storage.from(MAPS_BUCKET).remove(paths); if(error)console.error(error); }
      const imgIds=affected.map(m=>m.id).filter(Boolean);
      if(imgIds.length){ const { error } = await supabaseClient.from('image_library').delete().in('id',imgIds); if(error)console.error(error); }
    }
    const { error:delCatErr } = await supabaseClient.from('image_categories').delete().eq('id',id);
    if(delCatErr){ toast('❌ '+delCatErr.message); return; }
    const subIds=descendantIds.filter(i=>i!==id);
    if(subIds.length){ const { error } = await supabaseClient.from('image_categories').delete().in('id',subIds); if(error)console.error(error); }
  }catch(e){ console.error('deleteImageCategory',e); toast('❌ Erreur lors de la suppression.'); return; }
  closeModal();
  if(currentImageCategory && descendantIds.includes(currentImageCategory)) currentImageCategory=null;
  await Promise.all([loadImageCategories(),loadImageLibrary()]);
  render();
  toast('🗑️ Dossier supprimé.');
}
function openRenameImageModal(id){
  if(!isMJ())return;
  const m=imageLibrary.find(x=>x.id===id); if(!m)return;
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>Renommer l'image</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="field"><label>Nom</label><input id="img_rename_input" value="${esc(m.displayName)}" maxlength="60"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="img_rename_confirm">Enregistrer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('img_rename_confirm').onclick=()=>renameImage(id,document.getElementById('img_rename_input').value.trim());
}
async function renameImage(id,newName){
  if(!isMJ())return;
  if(!newName){toast('⚠️ Le nom ne peut pas être vide.');return;}
  try{
    const { error } = await supabaseClient.from('image_library').update({display_name:newName}).eq('id',id);
    if(error){toast('❌ '+error.message);return;}
  }catch(e){ console.error('renameImage',e); toast('❌ Erreur réseau.'); return; }
  const m=imageLibrary.find(x=>x.id===id); if(m)m.displayName=newName;
  closeModal(); render();
  toast('✅ Image renommée.');
}
function confirmDeleteImage(id){
  if(!isMJ())return;
  const m=imageLibrary.find(x=>x.id===id); if(!m)return;
  if(!confirm(`Supprimer définitivement « ${m.displayName} » du serveur ?`))return;
  deleteImage(id);
}
async function deleteImage(id){
  const m=imageLibrary.find(x=>x.id===id); if(!m)return;
  toast('⏳ Suppression…');
  try{
    if(m.storagePath){ const { error } = await supabaseClient.storage.from(MAPS_BUCKET).remove([m.storagePath]); if(error)console.error(error); }
    if(m.id){ const { error } = await supabaseClient.from('image_library').delete().eq('id',m.id); if(error)console.error(error); }
  }catch(e){ console.error('deleteImage',e); toast('❌ Erreur lors de la suppression.'); return; }
  imageLibrary=imageLibrary.filter(x=>x.id!==id);
  render();
  toast('🗑️ Image supprimée.');
}

function showMoveMenu(x,y,kind,itemId){
  if(!itemId)return;
  closeTokenMenu();
  const cats=kind==='note'?(S.noteCategories||[]):imageCategories;
  const fn=kind==='note'?'moveNoteToCategory':'moveImageToCategory';
  const path=id=>{const p=[];let cur=id;while(cur){const c=cats.find(k=>k.id===cur);if(!c)break;p.unshift(c.name);cur=c.parent_id;}return p.join(' › ');};
  const items=`<div class="tiny muted" style="padding:4px 8px">Déplacer vers…</div><button class="btn ghost" onclick="${fn}('${itemId}',null)">🏠 Racine</button>`+cats.map(c=>`<button class="btn ghost" onclick="${fn}('${itemId}','${c.id}')">📁 ${esc(path(c.id))}</button>`).join('');
  const m=document.createElement('div'); m.id='tokenMenu'; m.className='token-menu';
  m.style.left=Math.min(x,innerWidth-260)+'px'; m.style.top=Math.min(y,innerHeight*0.4)+'px'; m.style.maxHeight='60vh'; m.style.overflow='auto'; m.innerHTML=items; document.body.appendChild(m);
}
function noteDragStart(ev,noteId){
  ev.dataTransfer.setData('text/plain','note:'+noteId);
  ev.dataTransfer.effectAllowed='move';
}
function handleNoteCategoryDrop(ev,categoryId){
  ev.preventDefault(); ev.stopPropagation();
  const data=ev.dataTransfer.getData('text/plain');
  if(!data||!data.startsWith('note:'))return;
  moveNoteToCategory(data.slice(5),categoryId);
}
function moveNoteToCategory(noteId,categoryId){
  const n=(S.notes||[]).find(x=>x.id===noteId); if(!n)return;
  n.categoryId=categoryId;
  saveState(); render();
  toast('✅ Note déplacée.');
}
function noteBreadcrumb(catId){
  const chain=[]; let cur=catId;
  while(cur){const c=(S.noteCategories||[]).find(x=>x.id===cur); if(!c)break; chain.unshift(c); cur=c.parent_id;}
  const root=`<button class="btn ghost" style="padding:3px 8px" onclick="openNoteCategory(null)" ondragover="event.preventDefault()" ondrop="handleNoteCategoryDrop(event,null)">🏠 Racine</button>`;
  const rest=chain.map(c=>`<span class="tiny muted">›</span> <button class="btn ghost" style="padding:3px 8px" onclick="openNoteCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleNoteCategoryDrop(event,'${c.id}')">${esc(c.name)}</button>`).join(' ');
  return `<div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:8px">${root} ${rest}</div>`;
}
function openNoteCategory(id){currentNoteCategory=id;render();}
function notesResultsHtml(){
  const query=noteSearchQuery.trim().toLowerCase();
  if(query){
    const results=(S.notes||[]).filter(n=>n.title.toLowerCase().includes(query));
    return `<div class="asset-list">${results.length?results.map(noteItemHtml).join(''):'<p class="tiny muted">Aucune note ne correspond.</p>'}</div>`;
  }
  const breadcrumb=noteBreadcrumb(currentNoteCategory);
  const subCats=(S.noteCategories||[]).filter(c=>(c.parent_id||null)===(currentNoteCategory||null));

    </div>`;
  }).join('');
  const notesHtml=notesHere.map(noteItemHtml).join('');

function renameNoteCategory(id,name){

  const c=(S.noteCategories||[]).find(x=>x.id===id); if(c)c.name=name;
  saveState(); closeModal(); render();
}
function noteCatDescendants(rootId){
  const ids=[rootId]; let frontier=[rootId];
  while(frontier.length){const children=(S.noteCategories||[]).filter(c=>frontier.includes(c.parent_id)).map(c=>c.id);ids.push(...children);frontier=children;}
  return ids;
}
function confirmDeleteNoteCategory(id){
  if(!isMJ())return;
  const cat=(S.noteCategories||[]).find(x=>x.id===id); if(!cat)return;
  const ids=noteCatDescendants(id);
  const affected=(S.notes||[]).filter(n=>ids.includes(n.categoryId));
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>⚠️ Supprimer « ${esc(cat.name)} »</h2><button class="modal-close" onclick="closeModal()">✕</button></div>

  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn" style="background:var(--danger);border-color:var(--danger)" onclick="deleteNoteCategory('${id}')">Supprimer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
}
function deleteNoteCategory(id){
  if(!isMJ())return;
  const ids=noteCatDescendants(id);
  S.notes.forEach(n=>{if(ids.includes(n.categoryId))n.categoryId=null;});
  S.noteCategories=(S.noteCategories||[]).filter(c=>!ids.includes(c.id));
  if(ids.includes(currentNoteCategory))currentNoteCategory=null;
  saveState(); closeModal(); render();
}

let noteFocusMode=false;
function toggleNoteFocusMode(){
  noteFocusMode=!noteFocusMode;
  const modal=document.getElementById('modal');
  modal.classList.toggle('note-focus-mode',noteFocusMode);
  const btn=document.getElementById('noteFocusBtn');
  if(btn)btn.textContent=noteFocusMode?'✕ Quitter le focus':'🔎 Mode focus';

function saveNote(id){
  if(!isMJ())return;
  const title=(document.getElementById('note_title').value||'').trim()||'Sans titre';
  const text=rteHtml('note_text');
  const image=document.getElementById('note_image').value.trim()||null;
  const categoryId=document.getElementById('note_category').value||null;
  if(!S.notes)S.notes=[];
  let n=S.notes.find(x=>x.id===id);
  if(!n){n={id,categoryId};S.notes.push(n);}
  n.title=title; n.text=text; n.image=image; n.categoryId=categoryId;
  saveState(); closeModal(); render();
  toast('✅ Note enregistrée.');
}
function deleteNote(id){
  if(!isMJ())return;
  if(!confirm('Supprimer cette note ?'))return;
  S.notes=(S.notes||[]).filter(x=>x.id!==id);
  saveState(); render();
}
function showNoteToPlayers(id){
  if(!isMJ())return;
  const n=(S.notes||[]).find(x=>x.id===id); if(!n)return;
  S.notesReveal={noteId:id,ts:Date.now()};
  addLog(`📝 Le MJ montre la note « ${esc(n.title)} » aux joueurs.`);

  toast('👁 Note affichée à tous les joueurs.');

  if(S.notesReveal && S.notesReveal.ts!==lastShownNotesReveal){
    lastShownNotesReveal=S.notesReveal.ts;
    const n=(S.notes||[]).find(x=>x.id===S.notesReveal.noteId);
    if(n)openNoteViewModal(n);
  }
}

  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>📝 ${esc(n.title)}</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>

}

/* ============================= CHANGEMENT DE NIVEAU ============================= */
function levelUpChar(charId){S.instances.filter(i=>i.charId===charId).forEach(i=>broadcastLevelUp(i.id));}
function broadcastLevelUp(instId){
  gameChannel?.send({type:'broadcast',event:'levelup',payload:{instId}});
  showLevelUp(instId);
}
function showLevelUp(instId){
  if(currentPage!=='table')return;
  setTimeout(()=>{
    const lu=S.levelUpSettings||{}, t=inst(instId); if(!t)return;
    const cell=S.map.cell, z=mapZoom, sw=t.sizeW||1, sh=t.sizeH||1;
    if(lu.spriteImage){
      ensureFxCanvas();
      const [cx,cy]=instCenterPx(t), size=Math.max(cell*1.4,Math.max(sw,sh)*cell*1.4);
      fxAddImpact(getFxImg(lu.spriteImage,lu.spriteAuto),Math.max(1,lu.frames||1),Math.max(1,lu.rows||1),cx,cy,size,size,Math.max(1,lu.fps||24));
    }
    const el=document.querySelector(`[data-token="${instId}"]`); if(!el)return;
    const rect=el.getBoundingClientRect(), dur=lu.durationMs??2000, mult=lu.sizeMult??4;
    const pos=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top-cell*z}px;transform:translate(-50%,-100%);z-index:9999;pointer-events:none;`;
    let node;
    if(lu.image){
      node=document.createElement('img'); node.src=lu.image;
      node.style.cssText=pos+`width:${cell*sw*mult*z}px;height:${cell*sh*mult*z}px;object-fit:fill`;
    }else{
      node=document.createElement('div'); node.textContent='LEVEL UP';
      node.style.cssText=pos+`color:#ffd54a;font-weight:900;white-space:nowrap;font-size:${Math.max(20,cell*Math.max(sw,sh)*0.5*z)}px;text-shadow:0 2px 4px #000,0 0 10px #000`;
    }
    document.body.appendChild(node);
    setTimeout(()=>node.remove(),dur);
  },300);
}
function levelUpPage(){
  if(!isMJ())return `<div class="card"><p class="muted">Réservé au Maître du Jeu.</p></div>`;
  const lu=S.levelUpSettings||{};
  const drop=(hid,pid,fid,val,emoji,label)=>`<div class="icon-dropzone" onclick="document.getElementById('${fid}').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleIconDrop(event,'${hid}','${pid}')"><div id="${pid}" class="icon-preview" style="width:90px;height:90px;font-size:36px">${val?`<img src="${esc(val)}">`:`<span>${emoji}</span>`}</div><p class="tiny muted">${label}</p><input type="file" id="${fid}" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="handleIconFileInput(event,'${hid}','${pid}')"></div><input type="hidden" id="${hid}" value="${esc(val||'')}">${imagePickerHtml(hid,pid)}<button type="button" class="btn ghost" style="margin-top:6px" onclick="clearIconImage('${hid}','${pid}','${emoji}')">↺ Retirer</button>`;
  return `<div class="card" style="max-width:760px"><h2>📈 Changement de niveau</h2>
  <p class="tiny muted">Effets affichés à tous quand un personnage gagne un niveau. Astuce : clic droit sur un jeton → « Tester l'animation de niveau ».</p>
  <div class="field full"><label>💥 Spritesheet sur le personnage (s'adapte à sa taille)</label>${drop('lu_sprite','lu_sprite_preview','lu_sprite_file',lu.spriteImage,'🎉','Glisse une image ici ou clique. Vide = pas d\'animation.')}
  <div class="row" style="gap:10px;margin-top:8px;flex-wrap:wrap">
    <div class="field" style="max-width:180px"><label>Nombre de frames</label><input id="lu_frames" type="number" min="1" value="${lu.frames||1}"></div>
    <div class="field" style="max-width:180px"><label>Nombre de lignes</label><input id="lu_rows" type="number" min="1" value="${lu.rows||1}"></div>
    <div class="field" style="max-width:180px"><label>Vitesse (FPS)</label><input id="lu_fps" type="number" min="1" max="60" value="${lu.fps||24}"></div>
  </div>${spriteAutoSelect('lu_spriteauto',lu.spriteAuto)}</div>
  <div class="field full" style="margin-top:14px"><label>🖼️ Image au-dessus du jeton (vide = « LEVEL UP » jaune)</label>${drop('lu_img','lu_img_preview','lu_img_file',lu.image,'🖼️','Glisse une image ici ou clique.')}
  <div class="row" style="gap:10px;margin-top:8px;flex-wrap:wrap">
    <div class="field" style="max-width:220px"><label>Durée d'affichage (ms)</label><input id="lu_dur" type="number" min="100" value="${lu.durationMs??2000}"></div>
    <div class="field" style="max-width:220px"><label>Taille (× la taille du jeton)</label><input id="lu_size" type="number" min="0.5" step="0.5" value="${lu.sizeMult??4}"></div>
  </div></div>
  <div class="modal-actions"><button class="btn primary" onclick="saveLevelUpSettings()">Enregistrer</button></div></div>`;
}
function saveLevelUpSettings(){
  if(!isMJ())return;
  const v=id=>document.getElementById(id)?.value||'';
  S.levelUpSettings={
    spriteImage:v('lu_sprite').trim()||null,
    frames:Math.max(1,parseNum(v('lu_frames'))||1),
    rows:Math.max(1,parseNum(v('lu_rows'))||1),
    fps:Math.max(1,Math.min(60,parseNum(v('lu_fps'))||24)),
    spriteAuto:v('lu_spriteauto')||false,
    image:v('lu_img').trim()||null,
    durationMs:Math.max(100,parseNum(v('lu_dur'))||2000),
    sizeMult:Math.max(0.5,parseFloat(v('lu_size'))||4)
  };
  saveState(); render();
  toast('✅ Réglages enregistrés.');
}

/* ============================= GRILLE : OPACITÉ ET AFFICHAGE (préférence locale, jamais synchronisée) ============================= */
function applyGridOpacity(){
  document.documentElement.style.setProperty('--grid-opacity', gridVisible?(gridOpacity/100):0);
}
function onGridOpacityInput(value){
  gridOpacity=Math.max(0,Math.min(100,parseInt(value,10)||0));
  localStorage.setItem('narbudr-grid-opacity',String(gridOpacity));
  const label=document.getElementById('gridOpacityValue');
  if(label)label.textContent=gridOpacity+'%';
  applyGridOpacity();
}
function toggleGridVisible(){
  gridVisible=!gridVisible;
  localStorage.setItem('narbudr-grid-visible',gridVisible?'1':'0');
  applyGridOpacity();
  const btn=document.getElementById('gridToggleBtn');
  if(btn)btn.innerHTML=hkTag('ui_grid')+(gridVisible?'▦':'⬜')+' Grille';
}
function toggleGridOpacityPopover(){
  gridPopoverOpen=!gridPopoverOpen;
  const pop=document.getElementById('gridOpacityPopover');
  if(pop)pop.style.display=gridPopoverOpen?'block':'none';
}
document.addEventListener('click',e=>{
  if(!gridPopoverOpen)return;
  const pop=document.getElementById('gridOpacityPopover');
  const gearBtn=e.target.closest('button[title="Réglage de l\'opacité de la grille"]');
  if(pop && !pop.contains(e.target) && !gearBtn){
    gridPopoverOpen=false;
    pop.style.display='none';
  }
});
applyGridOpacity();

function toggleFullscreen(){
  stageFullscreen=!stageFullscreen;
  document.body.classList.toggle('stage-fullscreen',stageFullscreen);
  if(stageFullscreen)document.documentElement.requestFullscreen?.().then(()=>navigator.keyboard?.lock?.(['Escape'])).catch(()=>{});
  else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  render();
}
function exitStageFullscreen(){
  if(!stageFullscreen)return;
  stageFullscreen=false;
  document.body.classList.remove('stage-fullscreen');
  if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  render();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&stageFullscreen){stageFullscreen=false;document.body.classList.remove('stage-fullscreen');render();}
});

/* ============================= RACCOURCIS CLAVIER ============================= */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(pendingPersistentOrigin){pendingPersistentOrigin=null;activeAbility=null;hoverCell=null;render();return;}
    if(activeAbility){activeAbility=null;hoverCell=null;render();return;}
    if(multiSel.length){multiSel=[];render();return;}
    if(stageFullscreen){exitStageFullscreen();return;}
  }
  if(e.key==='Delete'&&(selectedToken||multiSel.length)&&!activeAbility){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
    if(multiSel.length){
      if(!isMJ()||S.combat.active)return;
      const n=multiSel.length;
      multiSel.forEach(id=>removeInstance(id));
      multiSel=[];
      addLog(`🗑 Le MJ retire ${n} tokens de la carte.`);
      saveState();render();toast(`🗑 ${n} tokens retirés`);
      return;
    }
    if(!isMJ()){toast('⛔ Seul le MJ peut retirer un token de la carte.');return;}
    const t=inst(selectedToken);
    if(t){removeInstance(selectedToken);saveState();render();toast('🗑 Token retiré de la carte');}
  }
});
document.addEventListener('keydown',e=>{
  if(!pendingPersistentOrigin||!activeAbility||!/^Arrow/.test(e.key))return;
  const a=S.abilities.find(x=>x.id===pendingPersistentOrigin.abilityId),c=inst(selectedToken); if(!a||!c)return;
  e.preventDefault();
  const p=pendingPersistentOrigin,o=persistentLiveOrigin(a,c),step=(e.shiftKey?15:1)*Math.PI/180;
  p.angle=persistentAngle(p,o,c)+((e.key==='ArrowLeft'||e.key==='ArrowUp')?-step:step);
  updateZonePreview();
});
const ARROW_DELTAS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
/* Déplacement en combat : case par case (diagonale = 1), avec attaques d'opportunité et dégâts de zones persistantes à chaque case */
function walkCombatPath(t,tx,ty){
  const sw=t.sizeW||1, sh=t.sizeH||1, id=t.id;
  t.px=null; t.py=null;
  while(t.x!==tx||t.y!==ty){
    const nx=t.x+Math.sign(tx-t.x), ny=t.y+Math.sign(ty-t.y);
    if(footprintOverlap(id,nx,ny,sw,sh)){toast('🚫 Chemin bloqué — déplacement interrompu.');break;}
    const old={x:t.x,y:t.y,sizeW:sw,sizeH:sh};
    t.x=nx; t.y=ny;
    t.remainingMove=(t.remainingMove??0)-1;
    checkOpportunityAttacks(id,old);
    if(!inst(id))return;
    applyZoneDamageOnMove(t);
    if(!inst(id)||t.isKO)return;
  }
}
function moveSelectedTokenBy(dx,dy){
  if(!selectedToken)return;
  const id=selectedToken, t=inst(id); if(!t)return;
  if(!canControlInstance(id)){toast('⛔ Vous ne contrôlez pas ce personnage.');return;}
  if(S.combat.active&&S.combat.order[S.combat.turn]!==id){toast('⏳ Ce n’est pas le tour de ce personnage.');return;}
  if(t.movementBlocked){toast('🚫 Ce personnage est immobilisé.');return;}
  if(effectiveMove(instTemplate(t))<=0&&characterTotalWeight(instTemplate(t))>0){toast('🚫 Trop lourd pour se déplacer !');return;}
  const sw=t.sizeW||1, sh=t.sizeH||1;
  const nx=t.x+dx, ny=t.y+dy;
  if(nx<0||ny<0||nx+sw>S.map.cols||ny+sh>S.map.rows)return;
  if(footprintOverlap(id,nx,ny,sw,sh)){toast('🚫 Case(s) déjà occupée(s).');return;}
  const oldX=t.x, oldY=t.y;
  if(S.combat.active){
    const remaining=t.remainingMove??effectiveMove(instTemplate(t));
    if(remaining<1){toast('🚫 Déplacement maximal atteint pour ce tour.');return;}
    t.remainingMove=remaining-1;
  }
  t.x=nx; t.y=ny; t.px=null; t.py=null;
  addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
  if(S.combat.active)checkOpportunityAttacks(id,{x:oldX,y:oldY,sizeW:sw,sizeH:sh});
  applyZoneDamageOnMove(t);
  saveState(); render();
}
document.addEventListener('keydown',e=>{
  if(e.key.length!==1||/\s/.test(e.key))return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(document.getElementById('modalBg')?.classList.contains('open'))return;
  if(currentPage!=='table')return;
  const m=getHotkeyMap()['__ui__']||{};
  const id=Object.keys(m).find(k=>m[k]===e.key);
  const acts={ui_next:()=>S.combat.active&&nextTurn(),ui_start:()=>S.combat.active?endCombat():startCombat(),ui_end:()=>S.combat.active?endCombat():startCombat(),ui_fullscreen:toggleFullscreen,ui_grid:toggleGridVisible,ui_ff:toggleFriendlyFire,ui_hud:toggleHudEnabled,ui_free:toggleFreeMovement};
  if(!id||!acts[id])return;
  e.preventDefault(); e.stopImmediatePropagation(); acts[id]();
});
document.addEventListener('keydown',e=>{
  if(e.key.length!==1||/\s/.test(e.key))return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(document.getElementById('modalBg')?.classList.contains('open'))return;
  if(currentPage!=='table'||!selectedToken)return;
  const selInst=inst(selectedToken); if(!selInst||!canControlInstance(selInst.id))return;
  const hkMap=getHotkeyMap()[selInst.charId]||{};
  const itemId=Object.keys(hkMap).find(aid=>hkMap[aid]===e.key);
  if(!itemId)return;
  if(itemId.startsWith('stat_')){
    e.preventDefault();
    rollStatTest(itemId.slice(5));
    return;
  }
  const a=S.abilities.find(x=>x.id===itemId);
  if(a){
    e.preventDefault();
    if(activeAbility){activeAbility=null;hoverCell=null;}
    startAbility(a.id);
    return;
  }
  const tpl=instTemplate(selInst);
  const owns=tpl&&(tpl.consumablesOwned||[]).find(o=>o.id===itemId&&o.qty>0);
  if(owns){
    e.preventDefault();
    useConsumable(tpl.id,itemId);
  }
});
document.addEventListener('keydown',e=>{
  if(!ARROW_DELTAS[e.key])return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(document.getElementById('modalBg')?.classList.contains('open'))return;
  if(currentPage!=='table'||activeAbility||!selectedToken)return;
  e.preventDefault();
  const [dx,dy]=ARROW_DELTAS[e.key];
  moveSelectedTokenBy(dx,dy);
});

/* ============================= TACTILE (tablette) ============================= */
(function(){
  let st=null, lpTimer=null;
  const fake=(t,target,button)=>({button:button||0,target,clientX:t.clientX,clientY:t.clientY,stopPropagation(){},preventDefault(){}});
  const W=()=>document.getElementById('mapWrap');
  const moveTo=t=>{ if(window.onmousemove)window.onmousemove({clientX:t.clientX,clientY:t.clientY}); };
  const up=()=>{ if(window.onmouseup)window.onmouseup(); };
  function onStart(e){
    const wrap=W();
    if(!e.target.closest)return;
    if(!e.target.closest('#tokenMenu'))closeTokenMenu();
    if(!wrap||!e.target.closest('#mapWrap'))return;
    if(document.getElementById('modalBg').classList.contains('open'))return;
    e.preventDefault();
    e.target.addEventListener('touchmove',onMove,{passive:false});
    e.target.addEventListener('touchend',onEnd,{passive:false});
    e.target.addEventListener('touchcancel',onEnd,{passive:false});
    clearTimeout(lpTimer);
    if(e.touches.length>=2&&activeAbility&&pendingPersistentOrigin&&st&&(st.mode==='aim'||st.mode==='rot')){
      const pa=S.abilities.find(x=>x.id===pendingPersistentOrigin.abilityId),pc=inst(selectedToken);
      if(pa&&pc){const p=pendingPersistentOrigin;if(!p.rotating){const o=persistentLiveOrigin(pa,pc);p.angle=persistentAngle(p,o,pc);p.frozen=o;p.rotating=true;}st.mode='rot';moveTo(e.touches[1]);}
      return;
    }
    if(e.touches.length>=2){
      if(st&&st.mode==='pinch')return;
      if(st)up();
      const a=e.touches[0],b=e.touches[1];
      st={mode:'pinch',d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2,z:mapZoom,px:mapPan.x,py:mapPan.y};
      return;
    }
    const t=e.touches[0], tw=e.target.closest('.token-wrap');
    st={sx:t.clientX,sy:t.clientY,moved:false,mode:'pan'};
    if(activeAbility){
      st.mode='aim'; moveTo(t);
      lpTimer=setTimeout(()=>{ if(st&&st.mode==='aim'&&!st.moved){ st.mode='menu'; pendingPersistentOrigin=null; activeAbility=null; hoverCell=null; render(); toast('❎ Ciblage annulé'); } },700);
      return;
    }
    if(tw&&e.target.closest('.token-resize-handle')&&isMJ()){ st.mode='resize'; startTokenResize(fake(t,e.target),tw.dataset.token); return; }
    if(tw){
      const id=tw.dataset.token;
      st.mode='token'; wrap.onmousedown(fake(t,e.target));
      lpTimer=setTimeout(()=>{ if(st&&st.mode==='token'&&!st.moved){ dragCandidate=null; st.mode='menu'; showTokenMenu(st.sx,st.sy,id); } },600);
      return;
    }
    wrap.onmousedown(fake(t,e.target,2));
  }
  function onMove(e){
    if(!st)return;
    e.preventDefault();
    const wrap=W(); if(!wrap)return;
    if(st.mode==='rot'){const t2=e.touches[1];if(t2)moveTo(t2);return;}
    if(st.mode==='pinch'){
      if(e.touches.length<2)return;
      const a=e.touches[0],b=e.touches[1];
      const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;
      const z=Math.max(.4,Math.min(3,st.z*d/st.d));
      const r=wrap.getBoundingClientRect();
      const ptx=(st.cx-r.left-st.px)/st.z, pty=(st.cy-r.top-st.py)/st.z;
      mapZoom=z;
      mapPan.x=(a.clientX+b.clientX)/2-r.left-ptx*z;
      mapPan.y=(a.clientY+b.clientY)/2-r.top-pty*z;
      applyMapTransform();
      return;
    }
    const t=e.touches[0]; if(!t)return;
    if(!st.moved&&Math.hypot(t.clientX-st.sx,t.clientY-st.sy)>8){ st.moved=true; clearTimeout(lpTimer); }
    if(st.mode==='menu')return;
    if(st.mode==='pan'&&!st.moved)return;
    moveTo(t);
  }
  function onEnd(e){
    clearTimeout(lpTimer);
    if(!st)return;
    e.preventDefault();
    if(st.mode==='rot'){if(e.touches.length<2){const p=pendingPersistentOrigin;if(p){p.rotating=false;p.frozen=null;}st.mode='aim';st.moved=true;}return;}
    if(e.touches.length>0)return;
    const t=e.changedTouches[0], wrap=W(), m=st.mode, moved=st.moved;
    st=null;
    if(m==='pinch'||m==='menu')return;
    const target=document.elementFromPoint(t.clientX,t.clientY)||wrap;
    if(m==='aim'){ if(wrap)wrap.onmousedown(fake(t,target)); return; }
    if(m==='pan'){ up(); if(!moved&&wrap){ wrap.onmousedown(fake(t,target)); up(); } return; }
    up();
  }
  document.addEventListener('touchstart',onStart,{passive:false});
})();

/* ============================= NAVIGATION / INIT ============================= */
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{currentPage=n.dataset.page;activeAbility=null;hoverCell=null;render();});
