<script>

/* ============================= CONFIGURATION SUPABASE ============================= */
const SUPABASE_URL = "https://hrnwadoceetyscndbkgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Smcvfpk46VOcV5EBJAScuQ_kgv-KRw4";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Identifiant Supabase (auth.users.id) du Maître du Jeu
const MJ_UUID = "17b03a0a-f866-4d92-b668-f8c70884b8b1";

let currentUser = null;
let isSignUpMode = false;
let profiles = [];        // liste des comptes joueurs enregistrés {id,email}
let gameChannel = null;   // canal Realtime Supabase

/* ============================= PERMISSIONS ============================= */
function isMJ(){ return !!currentUser && currentUser.id === MJ_UUID; }
function isOwner(charId){ const c=char(charId); return !!c && !!currentUser && c.ownerId===currentUser.id; }
function canControlChar(charId){ return isMJ() || isOwner(charId); }
function canControlInstance(instId){ const i=inst(instId); return i ? canControlChar(i.charId) : false; }

/* ============================= AUTH SUPABASE ============================= */
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('authOverlay').style.display = 'none';
    initApp();
  }
});

function toggleAuthMode(signUp) {
  isSignUpMode = signUp;
  document.getElementById('authDesc').textContent = signUp ? "Créez votre compte de joueur" : "Connectez-vous pour rejoindre la table de jeu";
  document.getElementById('authBtn').textContent = signUp ? "S'inscrire" : "Se connecter";
  document.getElementById('authToggleMode').innerHTML = signUp ?
    `Déjà un compte ? <button onclick="toggleAuthMode(false)">Se connecter</button>` :
    `Pas de compte ? <button onclick="toggleAuthMode(true)">Créer un compte</button>`;
}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { toast("⚠️ Veuillez remplir tous les champs."); return; }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = "Chargement...";

  if (isSignUpMode) {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; toggleAuthMode(true); return; }
    toast("✅ Compte créé ! Connexion en cours...");
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; btn.textContent = isSignUpMode ? "S'inscrire" : "Se connecter"; return; }

  currentUser = data.user;
  document.getElementById('authOverlay').style.display = 'none';
  await initApp();
}

async function logout(){
  if(saveDebounceTimer){ await flushSave(); }
  if(gameChannel){ supabaseClient.removeChannel(gameChannel); gameChannel=null; }
  await supabaseClient.auth.signOut();
  currentUser=null;
  document.getElementById('authOverlay').style.display='flex';
  toggleAuthMode(false);
}

    normalizeState();

  pushUndoCheckpoint();
}

/* flushSave : compare l'état local au dernier état serveur et n'envoie QUE les lignes/colonnes modifiées. */
async function flushSave(){
  clearTimeout(saveDebounceTimer); saveDebounceTimer=null;
  if(!lastSaved){pendingChat=[];return;}
  if(saveInFlight){saveQueued=true;return;}
  saveInFlight=true;
  const old=lastSaved; let chat=[];
  try{
    const snap=computeSnapshot();
    const rows={}, delta={cols:{},notes:[],notesDel:[],insts:[],instsDel:[],chat:[]};
    COL_SPECS.forEach(s=>{
      if(snap.cols[s.k]===old.cols[s.k])return;
      const v=s.get(); delta.cols[s.k]=v;
      const r=rows[s.t]=rows[s.t]||{[s.pk]:SID}; r[s.c]=v;
      noteOwn('c:'+s.k,snap.cols[s.k]);
    });
    const noteUp=[], instUp=[];
    (S.notes||[]).forEach(n=>{if(snap.notes[n.id]!==old.notes[n.id]){noteUp.push(noteRow(n));delta.notes.push(n);noteOwn('n:'+n.id,snap.notes[n.id]);}});
    Object.keys(old.notes).forEach(id=>{if(!(id in snap.notes))delta.notesDel.push(id);});
    S.instances.forEach(i=>{if(snap.insts[i.id]!==old.insts[i.id]){const ts=Math.max(Date.now(),(instTs[i.id]||0)+1);i._ts=ts;instTs[i.id]=ts;snap.insts[i.id]=canon(instRow(i));instUp.push(instRow(i));delta.insts.push(i);noteOwn('i:'+i.id,snap.insts[i.id]);}});
    Object.keys(old.insts).forEach(id=>{if(!(id in snap.insts))delta.instsDel.push(id);});
    chat=pendingChat.splice(0);
    delta.chat=chat.map(c=>({cid:c.raw_data.cid,html:c.message}));
    lastSaved=snap;
    const ops=[];
    Object.entries(rows).forEach(([t,r])=>ops.push(supabaseClient.from(t).upsert(r)));
    if(noteUp.length)ops.push(supabaseClient.from('game_notes').upsert(noteUp));
    if(delta.notesDel.length)ops.push(supabaseClient.from('game_notes').delete().in('id',delta.notesDel));
    if(instUp.length)ops.push(supabaseClient.from('game_character_instances').upsert(instUp));
    if(delta.instsDel.length)ops.push(supabaseClient.from('game_character_instances').delete().in('id',delta.instsDel));
    if(chat.length)ops.push(supabaseClient.from('game_chat').insert(chat));
    if(ops.length){
      try{ const p={...delta}; if(JSON.stringify(p).length<230000)gameChannel?.send({type:'broadcast',event:'delta',payload:p}); }catch(e){}
      const res=await Promise.all(ops);
      const bad=res.find(r=>r&&r.error);
      if(bad)throw bad.error;
    }
  }catch(e){
    console.error('flushSave',e);
    lastSaved=old; pendingChat=chat.concat(pendingChat);
    toast('⚠️ Erreur de sauvegarde — nouvelle tentative à la prochaine action.');
  }
  saveInFlight=false;
  if(saveQueued){saveQueued=false;flushSave();}
}
async function persistState(){
  bumpRev(); pushUndoCheckpoint();
  try{localStorage.setItem('arcanum-vtt', JSON.stringify(S));}catch(e){}

function saveState(immediate){

}

/* ---- Application des changements reçus d'autres clients ---- */
function applyRemoteCol(k,val){
  const s=COL_SPECS.find(x=>x.k===k); if(!s||val===null||val===undefined||!lastSaved)return false;
  const cn=canon(val);
  if(cn===lastSaved.cols[k]||isOwnEcho('c:'+k,cn))return false;
  s.set(val); touched.push(['c',k]); return true;
}
function handleColRow(table,r){
  let ch=false;
  COL_SPECS.filter(s=>s.t===table).forEach(s=>{if(applyRemoteCol(s.k,r[s.c]))ch=true;});
  return ch;
}
function applyRemoteNote(n){
  if(!n||!lastSaved)return false;
  const cn=canon(noteRow(n));
  if(cn===lastSaved.notes[n.id]||isOwnEcho('n:'+n.id,cn))return false;
  if(!S.notes)S.notes=[];
  const i=S.notes.findIndex(x=>x.id===n.id);
  if(i>=0)S.notes[i]=n; else S.notes.push(n);
  touched.push(['n',n.id]); return true;
}
function applyRemoteInst(o){
  if(!o||!o.id||!lastSaved)return false;
  const ts=o._ts||0;
  if(ts&&ts<=(instTs[o.id]||0))return false;
  const cn=canon(instRow(o));
  if(cn===lastSaved.insts[o.id]||isOwnEcho('i:'+o.id,cn))return false;
  const i=S.instances.findIndex(x=>x.id===o.id);
  if(i>=0)S.instances[i]=o; else S.instances.push(o);
  if(ts)instTs[o.id]=ts;
  touched.push(['i',o.id]); return true;
}
function applyRemoteDel(type,id){
  if(!id||!lastSaved)return false;
  if(type==='i'){
    if(!inst(id))return false;
    S.instances=S.instances.filter(x=>x.id!==id); delete lastSaved.insts[id]; delete instTs[id];
    if(selectedToken===id)selectedToken=null;
    return true;
  }
  if(!(S.notes||[]).some(x=>x.id===id))return false;
  S.notes=S.notes.filter(x=>x.id!==id); delete lastSaved.notes[id];
  return true;
}
function applyRemoteChat(cid,html){
  if(cid&&seenChat.has(cid))return false;
  if(cid)seenChat.add(cid);
  S.chat.push(html); if(S.chat.length>120)S.chat.shift();
  return true;
}
function afterRemote(){
  normalizeState();
  touched.forEach(([t,k])=>{
    if(t==='c'){const s=COL_SPECS.find(x=>x.k===k);if(s)lastSaved.cols[k]=canon(s.get());}
    else if(t==='i'){const o=inst(k);if(o)lastSaved.insts[k]=canon(instRow(o));}
    else if(t==='n'){const o=(S.notes||[]).find(x=>x.id===k);if(o)lastSaved.notes[k]=canon(noteRow(o));}
  });
  touched=[];
  syncTurnSelection();
  render();
}
function subscribeRealtime(){
  if(gameChannel){ supabaseClient.removeChannel(gameChannel); gameChannel=null; }
  gameChannel=supabaseClient.channel('game_state_sync');
  const pg=(table,cb)=>{gameChannel.on('postgres_changes',{event:'*',schema:'public',table},cb);};
  pg('game_sessions',p=>{if(p.new&&handleColRow('game_sessions',p.new))afterRemote();});
  pg('game_maps',p=>{if(p.new&&handleColRow('game_maps',p.new))afterRemote();});
  pg('game_rules_library',p=>{if(p.new&&handleColRow('game_rules_library',p.new))afterRemote();});
  pg('game_notes',p=>{
    const c=p.eventType==='DELETE'?applyRemoteDel('n',p.old&&p.old.id):applyRemoteNote(p.new&&noteFromRow(p.new));
    if(c)afterRemote();
  });
  pg('game_character_instances',p=>{
    const c=p.eventType==='DELETE'?applyRemoteDel('i',p.old&&p.old.id):applyRemoteInst(p.new&&p.new.raw_instance_data);
    if(c)afterRemote();
  });
  pg('game_chat',p=>{if(p.eventType==='INSERT'&&p.new&&applyRemoteChat(p.new.raw_data&&p.new.raw_data.cid,p.new.message))afterRemote();});
  gameChannel
    .on('broadcast',{event:'delta'},payload=>{
      const d=payload.payload||{}; let ch=false;
      Object.entries(d.cols||{}).forEach(([k,v])=>{if(applyRemoteCol(k,v))ch=true;});
      (d.notes||[]).forEach(n=>{if(applyRemoteNote(n))ch=true;});
      (d.notesDel||[]).forEach(id=>{if(applyRemoteDel('n',id))ch=true;});
      (d.insts||[]).forEach(o=>{if(applyRemoteInst(o))ch=true;});
      (d.instsDel||[]).forEach(id=>{if(applyRemoteDel('i',id))ch=true;});
      (d.chat||[]).forEach(c=>{if(applyRemoteChat(c.cid,c.html))ch=true;});
      if(ch)afterRemote();
    })
    .on('broadcast',{event:'fx'},payload=>{
      const d=payload.payload||{};
      const a=S.abilities.find(x=>x.id===d.abilityId);
      const casterInst=inst(d.casterId);
      if(!a||!casterInst)return;
      const targets=(d.targetIds||[]).map(id=>inst(id)).filter(Boolean);
      if(currentPage==='table')playAbilityFX(a,casterInst,targets,d.start);
    })
    .on('broadcast',{event:'hud'},payload=>{
      const d=payload.payload||{};
      showHudFloating(d.instId,d.deltas);
    })
    .on('broadcast',{event:'levelup'},payload=>{
      showLevelUp((payload.payload||{}).instId);
    })
    .on('broadcast',{event:'crit'},payload=>{
      const d=payload.payload||{};
      showCriticalPopup(d.instId,d.key);
    })
    .on('broadcast',{event:'oppfx'},payload=>{
      const d=payload.payload||{};
      if(currentPage==='table')playOppImpactAt(d.targetId,d.image,d.frames,d.rows,d.fps,d.auto);
    })
    .on('broadcast',{event:'dice'},payload=>{
      const d=payload.payload||{};
      playDiceRoll(d.sides,d.values);
    })
    .subscribe();
}

/* ---- Points de caractéristique gagnés par niveau ---- */
function levelPointsEarned(lvl){let n=0;for(let l=2;l<=(lvl||1);l++)n+=(l%5===0)?20:5;return n;}
function statPointsAvailable(c){return Math.max(0,levelPointsEarned(c.level||1)-(c.statPointsSpent||0));}
function statStep(val){return val<50?{gain:2,cost:1}:val<100?{gain:1,cost:1}:{gain:1,cost:2};}

function pendingSim(c){
  const vals={...(c.stats||{})}; let cost=0;
  (pendingStats[c.id]||[]).forEach(s=>{const st=statStep(vals[s]||0);vals[s]=(vals[s]||0)+st.gain;cost+=st.cost;});
  return {vals,cost};

function statPointUp(cid,stat){
  const c=char(cid); if(!c||!canControlChar(cid))return;

  if(statPointsAvailable(c)-sim.cost<st.cost){toast('⚠️ Pas assez de points.');return;}

function statPointDown(cid,stat){

function cancelStatPoints(cid){pendingStats[cid]=[];refreshSheet(cid);}
function confirmStatPoints(cid){
  const c=char(cid); if(!c||!canControlChar(cid))return;
  const steps=pendingStats[cid]||[]; if(!steps.length)return;
  steps.forEach(s=>{
    const st=statStep(c.stats[s]||0);
    c.stats[s]=(c.stats[s]||0)+st.gain;
    c.statPointsSpent=(c.statPointsSpent||0)+st.cost;
    (c.statHistory=c.statHistory||[]).push({stat:s,gain:st.gain,cost:st.cost});

/* Si le niveau baisse : annule les gains de stats (les plus récents d'abord) tant que les points dépensés dépassent ceux du niveau */
function reconcileLevelPoints(c){
  c.statHistory=c.statHistory||[]; c.statPointsSpent=c.statPointsSpent||0;
  const earned=levelPointsEarned(c.level||1);
  while(c.statPointsSpent>earned&&c.statHistory.length){
    const h=c.statHistory.pop();
    c.stats[h.stat]=Math.max(0,(c.stats[h.stat]||0)-h.gain);
    c.statPointsSpent-=h.cost;
  }
  if(c.statPointsSpent>earned)c.statPointsSpent=earned;

}

/* ---- Durabilité (armures hors anneaux/amulette, et armes) — suivie par jeton ---- */
const DURABILITY_HIT_SLOTS={1:'torse',2:'jambes',3:'tete',4:'pieds',5:'main',6:'bouclier'};
function tplOf(x){return x&&x.charId?char(x.charId):x;}
function slotItem(t,slotKey){const c=tplOf(t);return c?equip(c.equipmentSlots?.[slotKey]):null;}
function getEqDurability(t,slotKey){
  const item=slotItem(t,slotKey);
  if(!item||!item.durabilityMax)return null;
  const c=tplOf(t); if(!c.eqDur)c.eqDur={};
  if(c.eqDur[slotKey]===undefined)c.eqDur[slotKey]=item.durabilityMax;
  return c.eqDur[slotKey];
}
function setEqDurability(t,slotKey,val){
  const item=slotItem(t,slotKey);
  if(!item||!item.durabilityMax)return;
  const c=tplOf(t); if(!c.eqDur)c.eqDur={};
  c.eqDur[slotKey]=Math.max(0,Math.min(item.durabilityMax,Math.round(val)));
}
function damageEqDurability(t,slotKey,amount){
  const cur=getEqDurability(t,slotKey);
  if(cur===null||!amount)return;
  setEqDurability(t,slotKey,cur-amount);
}
function repairEqDurability(t,slotKey){
  const item=slotItem(t,slotKey);
  if(item)setEqDurability(t,slotKey,item.durabilityMax||0);
}
function equipStatFactor(t,slotKey){
  const item=slotItem(t,slotKey);
  if(!item||!item.durabilityMax)return 1;
  const dur=getEqDurability(t,slotKey);
  if(dur<=0)return 0;
  if(dur<item.durabilityMax/2)return 0.5;
  return 1;
}
function applyMonsterDurabilityHit(casterTpl,targetInst,targetTpl,label,lines){
  if(!casterTpl||casterTpl.type!=='enemy'||!targetTpl||targetTpl.type!=='player'||!targetInst)return;

  else if(label==='Réussite ultime')amount=casterTpl.ultimateDurabilityDmg||0;
  else return;

  if(!eligible.length)return; // toutes les pièces sont brisées : plus d'effet
  const d5=eligible[Math.floor(Math.random()*eligible.length)];

  const item=equip(targetTpl.equipmentSlots?.[slotKey]);
  const slotLabel=(EQUIP_SLOTS.find(s=>s[0]===slotKey)||['',''])[1];

    damageEqDurability(targetInst,slotKey,amount);
    lines.push(`🔧 ${esc(item.name)} de <b>${esc(targetInst.label)}</b> perd ${amount} de durabilité (${getEqDurability(targetInst,slotKey)}/${item.durabilityMax}).`);

function weaponHasElem(w){return !!w&&ELEMENT_RES_KEYS.some(k=>String((w.elemDamage||{})[k]||'').trim());}
function weaponElemText(w){const l=ELEMENT_RES_KEYS.filter(k=>String((w.elemDamage||{})[k]||'').trim()).map(k=>`${k} ${esc(w.elemDamage[k])}`);return l.length?' · '+l.join(', '):'';}
function rollWeaponElems(w,casterInst){

function elemBonusDamage(list,mult,statVal,dmgMult,tTpl,t,lines){

/* Toutes les sources d'un même élément sont additionnées, la résistance s'applique une seule fois par élément,
   puis la CA (groupe physique) et la DM (groupe élémentaire) ne sont déduites qu'une seule fois chacune. */
function finalizeDamage(parts,tTpl,t){
  const groups={}, detail=[];
  parts.forEach(p=>{if(!(p.raw>0))return;const k=p.pool+'|'+p.el;const g=groups[k]=groups[k]||{pool:p.pool,el:p.el,raw:0};g.raw+=p.raw;});
  const d=effectiveDef(tTpl,t); let ca=0,dm=0,free=0;
  Object.values(groups).forEach(g=>{
    const res=(effectiveRes(tTpl,t)[g.el]||0)/100;
    g.v=Math.max(0,Math.ceil(g.raw*(1-res)));
    if(res)detail.push(`🛡 ${esc(g.el)} : ${g.raw} → ${g.v} (résistance ${Math.round(res*100)}%)`);
    if(g.pool==='CA')ca+=g.v;else if(g.pool==='DM')dm+=g.v;else free+=g.v;
  });
  const caR=Math.min(ca,d.CA||0), dmR=Math.min(dm,d.DM||0);
  return {total:(ca-caR)+(dm-dmR)+free,detail,txt:(caR?` (−${caR} CA)`:'')+(dmR?` (−${dmR} DM)`:'')};
}
function rollWithWeapon(formula,weaponUsed,casterInst){
  const r=roll(formula);
  broadcastDiceRoll(formulaSides(formula),r.rolls);
  let total=r.total, wpTotal=0;
  let logLine=`🎲 ${esc(formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`;
  if(weaponUsed&&weaponUsed.damageFormula){
    const f=casterInst?equipStatFactor(casterInst,'arme'):1;
    if(f>0){
      const w=roll(weaponUsed.damageFormula);
      broadcastDiceRoll(formulaSides(weaponUsed.damageFormula),w.rolls);
      const wt=f<1?Math.ceil(w.total*f):w.total;
      total+=wt; wpTotal=wt;
      logLine+=` + arme « ${esc(weaponUsed.name)} »${f<1?' (abîmée, ÷2)':''} ${esc(weaponUsed.damageFormula)} : ${w.rolls.join(' + ')}${w.bonus?` + ${w.bonus}`:''} = ${wt}`;
    }else{

    }

function effectiveDef(c,t){
  if(!c)return {CA:0,DM:0,'CA naturelle':0};
  if(c.type!=='player')return {CA:c.def?.CA||0,DM:c.def?.DM||0,'CA naturelle':c.def?.['CA naturelle']||0};
  const nat=naturalRes(c);
  let ca=(c.def?.CA||0)+nat.ca, dm=(c.def?.DM||0)+nat.dm;
  if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e){const f=t?equipStatFactor(t,k):1;ca+=Math.ceil((e.ca||0)*f);dm+=Math.ceil((e.dm||0)*f);}});}
  return {CA:ca,DM:dm,'CA naturelle':c.def?.['CA naturelle']||0};
}
function effectiveRes(c,t){
  if(!c)return {};
  const out={...(c.res||{})};
  ELEMENT_RES_KEYS.forEach(k=>{if(out[k]===undefined)out[k]=0;});
  if(c.type==='player'&&c.equipmentSlots){
    EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e&&e.res){const f=t?equipStatFactor(t,k):1;ELEMENT_RES_KEYS.forEach(rk=>{if(e.res[rk])out[rk]=(out[rk]||0)+Math.ceil(e.res[rk]*f);});}});
  }
  return out;
}
function characterTotalWeight(c){
  if(!c||c.type!=='player'||!c.equipmentSlots)return 0;
  let w=0;
  EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e)w+=e.poids||0;});
  (c.equipmentSlots.diversIds||[]).forEach(id=>{const e=equip(id);if(e)w+=e.poids||0;});
  return w;
}
function weightMalusText(w,force){
  if(w>force*3)return ' ⚠️ il vous semble impossible de vous déplacer correctement avec un équipement aussi lourd';
  if(w>force*2)return ' ⚠️ Votre équipement est très lourd pour vous, malus de -4 de déplacement';

function effectiveMove(c){
  if(!c)return 0;
  const base=c.move??6;

  const w=characterTotalWeight(c), force=c.stats?.Force||0;
  if(w>force*3)return 0;
  if(w>force*2)return Math.max(0,base-4);
  if(w>force)return Math.max(0,base-1);
  return base;
}

function diceLoop(now){
  const stillAlive=[];
  activeDice.forEach(d=>{
    const elapsed=now-d.start;
    if(elapsed<0){stillAlive.push(d);return;}
    d.ctx.clearRect(0,0,d.size,d.size);
    if(elapsed<d.spinMs){
      const frame=Math.floor(elapsed/1000*d.fps)%d.frames;
      fxDrawFrame(d.ctx,d.img,frame,d.frames,d.rows,0,0,d.size,d.size);
    }else{
      fxDrawFrame(d.ctx,d.img,d.targetFrame,d.frames,d.rows,0,0,d.size,d.size);
      if(!d.landed){d.landed=true;d.canvas.classList.add('landed');}
    }
    if(elapsed<d.spinMs+d.holdMs)stillAlive.push(d); else d.canvas.remove();
  });
  activeDice=stillAlive;
  if(activeDice.length)requestAnimationFrame(diceLoop); else diceRafRunning=false;

  const fps=Math.max(1,ds.fps||24);

      canvas.width=size; canvas.height=size; canvas.style.cssText=`width:${size}px;height:${size}px`;
      overlay.appendChild(canvas);

      if(!diceRafRunning){diceRafRunning=true;requestAnimationFrame(diceLoop);}
    }else{

function roll(expr){
  expr=String(expr).replace(/\s+/g,''); let bonus=0;
  const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
  const m=expr.match(/(\d*)d(\d+)/i); if(!m)return {total:(+expr||0)+bonus,rolls:[],bonus};
  const n=+(m[1]||1), sides=+m[2], rolls=[]; for(let i=0;i<n;i++)rolls.push(1+Math.floor(Math.random()*sides));
  return {total:rolls.reduce((a,x)=>a+x,0)+bonus,rolls,bonus};
}
function applyMult(value,multStr){
  if(!multStr)return value;
  const m=String(multStr).trim().toLowerCase().replace(',','.');
  const mDiv=m.match(/^\/\s*(\d+(\.\d+)?)$/);
  const mMul=m.match(/^x\s*(\d+(\.\d+)?)$/);
  if(mDiv){const d=+mDiv[1]; if(d>0)return Math.ceil(value/d);}
  if(mMul){const x=+mMul[1]; if(x>0)return Math.ceil(value*x);}
  return value;
}
function combineFormula(abilityFormula,weaponFormula){
  const parse=(expr)=>{
    expr=String(expr||'').replace(/\s+/g,'');
    let bonus=0; const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
    const m=expr.match(/^(\d*)d(\d+)/i);
    if(!m)return {n:0,sides:20,bonus:bonus+(+expr||0)};
    return {n:+(m[1]||1),sides:+m[2],bonus};
  };
  const a=parse(abilityFormula), w=parse(weaponFormula);
  const n=a.n+w.n, sides=a.sides||w.sides||20, bonus=a.bonus+w.bonus;
  if(n<=0)return abilityFormula;
  return `${n}d${sides}${bonus?(bonus>0?'+':'')+bonus:''}`;
}

}

}
function rollStatTest(stat){

  const casterInst=inst(selectedToken); if(!casterInst)return;

/* ============================= INSTANCES (TOKENS) ============================= */
function isOccupied(x,y,excludeId){return S.instances.some(i=>i.id!==excludeId&&i.x===x&&i.y===y);}
function footprintOverlap(id,x,y,sw,sh){
  const x2=x+sw, y2=y+sh;
  if(x<0||y<0||x2>S.map.cols||y2>S.map.rows)return true;
  return S.instances.some(o=>{
    if(o.id===id)return false;
    const osw=o.sizeW||1, osh=o.sizeH||1, ox2=o.x+osw, oy2=o.y+osh;
    return x<ox2 && x2>o.x && y<oy2 && y2>o.y;
  });
}
function nearestCellCoord(rawPos,maxIndex){
  // rawPos est exprimé en unités de case (ex: 4.3 = case 4, proche du centre 4.5)
  if(Number.isInteger(rawPos)){
    // exactement sur la frontière entre deux cases -> tirage au sort parmi les cases valides adjacentes
    const candidates=[rawPos-1,rawPos].filter(v=>v>=0&&v<=maxIndex);
    if(!candidates.length)return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
    return candidates[Math.floor(Math.random()*candidates.length)];
  }
  return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
}
function snapAllTokensToGrid(){
  S.instances.forEach(t=>{
    const rawX=(t.px!=null?t.px:t.x*S.map.cell+S.map.cell/2)/S.map.cell;
    const rawY=(t.py!=null?t.py:t.y*S.map.cell+S.map.cell/2)/S.map.cell;
    t.x=nearestCellCoord(rawX,S.map.cols-1);
    t.y=nearestCellCoord(rawY,S.map.rows-1);
    t.px=null; t.py=null;
  });
}

/* ---- HUD flottant de ressources (dégâts/soins/bouclier) ---- */
function broadcastHud(instId,deltas){
  if(!deltas||(!deltas.hp&&!deltas.mana&&!deltas.shield))return;
  gameChannel?.send({type:'broadcast',event:'hud',payload:{instId,deltas}});
  showHudFloating(instId,deltas);
}
function showHudFloating(instId, deltas) {
  if (!S.hudEnabled || currentPage !== 'table') return;
  
  // Réduit à 100ms ou 0ms pour une réactivité instantanée !
  setTimeout(() => {
    const el = document.querySelector(`[data-token="${instId}"]`);
    if (!el) return;
    
    const dur = S.hudSettings?.resourceDurationMs ?? 1000;
    
    // 1. On cherche si un texte existe DEJÀ sur ce token
    let wrap = el.querySelector('.hud-floating-text');
    
    if (wrap) {
      // Si un texte existe déjà, on annule sa disparition programmée pour prolonger sa vie
      if (wrap.timeoutId) clearTimeout(wrap.timeoutId);
      
      // On récupère les anciennes valeurs ou on démarre à 0
      const currentHp = wrap.dataset.hp ? parseInt(wrap.dataset.hp) : 0;
      const currentMana = wrap.dataset.mana ? parseInt(wrap.dataset.mana) : 0;
      const currentShield = wrap.dataset.shield ? parseInt(wrap.dataset.shield) : 0;
      
      // On AJOUTE les nouveaux dégâts/soins aux anciens
      deltas.hp = (deltas.hp ?? 0) + currentHp;
      deltas.mana = (deltas.mana ?? 0) + currentMana;
      deltas.shield = (deltas.shield ?? 0) + currentShield;
    } else {
      // Sinon, on crée le conteneur pour la première fois
      wrap = document.createElement('div');
      wrap.className = 'hud-floating-text';
      wrap.style.cssText = 'position:absolute;left:50%;bottom:calc(var(--tok-h,var(--cell-size,32px))/2 + 4px);transform:translateX(-50%);pointer-events:none;z-index:85;text-align:center;white-space:nowrap;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000,0 0 4px #000';
      el.appendChild(wrap);
    }
    
    // 2. On sauvegarde les valeurs cumulées dans le HTML pour le prochain clic rapide
    wrap.dataset.hp = deltas.hp || 0;
    wrap.dataset.mana = deltas.mana || 0;
    wrap.dataset.shield = deltas.shield || 0;
    
    // 3. On génère le rendu visuel (avec votre logique de couleur Vert/Rouge)
    const lines = [];
    if (deltas.hp) lines.push(`<div style="color:${deltas.hp > 0 ? '#2ecc71' : '#ef6262'}">${deltas.hp > 0 ? '+' : ''}${deltas.hp} PV</div>`);
    if (deltas.mana) lines.push(`<div style="color:${deltas.mana > 0 ? '#2ecc71' : '#5da5ff'}">${deltas.mana > 0 ? '+' : ''}${deltas.mana} Mana</div>`);
    if (deltas.shield) lines.push(`<div style="color:${deltas.shield > 0 ? '#2ecc71' : '#e7b85c'}">${deltas.shield > 0 ? '+' : ''}${deltas.shield} Bouclier</div>`);
    
    if (!lines.length) {
      wrap.remove();
      return;
    }
    
    wrap.innerHTML = lines.join('');
    
    // 4. On relance le chrono de disparition à zéro (durée complète)
    wrap.timeoutId = setTimeout(() => wrap.remove(), dur);
    
  }, 100); // Délai d'attente de 100ms seulement
}

function findFreeCell(x,y,excludeId){
  if(!isOccupied(x,y,excludeId))return [x,y];
  const maxR=Math.max(S.map.cols,S.map.rows);
  for(let r=1;r<=maxR;r++){
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=S.map.cols||ny>=S.map.rows)continue;
      if(!isOccupied(nx,ny,excludeId))return [nx,ny];
    }
  }
  return null;
}
function spawnInstance(charId,x,y){
  const t=char(charId); if(!t)return null;
  let sw=Math.max(1,t.sizeW||1), sh=Math.max(1,t.sizeH||1);
  const ox=x, oy=y;
  x=Math.max(0,Math.min(S.map.cols-sw,x)); y=Math.max(0,Math.min(S.map.rows-sh,y));
  if(footprintOverlap('',x,y,sw,sh)){sw=1;sh=1;x=ox;y=oy;toast('⚠️ Pas la place pour la taille par défaut — token placé en 1×1.');}
  const count=S.instances.filter(i=>i.charId===charId).length+1;
  const label=t.type==='enemy'?`${t.name} #${count}`:t.name;
  const rm=t.resourcesMax||{Vie:10,Mana:0,Bouclier:0};
  const newInst={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),charId,label,x,y,sizeW:sw,sizeH:sh,px:null,py:null,
    hp:rm.Vie||0,hpMax:rm.Vie||0,mana:rm.Mana||0,manaMax:rm.Mana||0,shield:rm.Bouclier||0,shieldMax:rm.Bouclier||0,
    remainingMove:effectiveMove(t)};
  S.instances.push(newInst); return newInst;
}
function removeInstance(id){
  S.instances=S.instances.filter(i=>i.id!==id);
  if(selectedToken===id)selectedToken=null;
  if(S.combat.active){
    const idx=S.combat.order.indexOf(id);
    if(idx!==-1){
      S.combat.order.splice(idx,1); delete S.combat.initiatives[id];
      if(idx<S.combat.turn)S.combat.turn--;
      if(!S.combat.order.length){S.combat.active=false;S.combat.turn=0;}
      else S.combat.turn=((S.combat.turn%S.combat.order.length)+S.combat.order.length)%S.combat.order.length;
    }
  }
}

function zoneAxis(a,targetCell,originOverride,rangeCellsOverride){
  const c=S.map.cell;
  let cx,cy;
  if(originOverride){
    cx=originOverride[0]*c+c/2; cy=originOverride[1]*c+c/2;
  }else{
    const casterInst=selectedToken?inst(selectedToken):null;
    if(!casterInst)return null;
    [cx,cy]=instCenterPx(casterInst);
  }
  const tx=targetCell[0]*c+c/2, ty=targetCell[1]*c+c/2;
  const angle=Math.atan2(ty-cy,tx-cx);
  const rangeCells=(rangeCellsOverride!=null)?rangeCellsOverride:(a.range||1);
  return {cx,cy,angle,range:rangeCells*c};
}
/* Position (pixels) du lanceur, utilisée pour le placement en 3 clics des sorts persistants ligne/cône. */
function casterPixelPos(casterInst){
  return instCenterPx(casterInst);

/* Projette une case survolée sur l'axe (origine cx,cy à l'angle donné) pour obtenir une distance en cases, plafonnée à maxCells. */
function projectDistanceCells(cx,cy,angle,cell,maxCells){
  const c=S.map.cell;
  const hx=cell[0]*c+c/2, hy=cell[1]*c+c/2;
  const dx=Math.cos(angle), dy=Math.sin(angle);
  const proj=((hx-cx)*dx+(hy-cy)*dy)/c;
  const max=(maxCells>0)?maxCells:9999;
  return Math.max(0,Math.min(max,Math.round(proj)));
}
function lineConeHitTest(axis,areaType,c,coneStart,coneEnd,px,py){
  const {cx,cy,angle,range}=axis;
  const dx=Math.cos(angle), dy=Math.sin(angle);
  const rx=px-cx, ry=py-cy;
  const proj=rx*dx+ry*dy;
  const perp=Math.abs(rx*(-dy)+ry*dx);
  if(proj<0||proj>range)return false;
  if(areaType==='line')return perp<=c/2;
  const sw=(coneStart||1)*c/2, ew=(coneEnd||3)*c/2;
  return perp<=sw+(ew-sw)*(proj/range);
}
function footprintHitsLineCone(tx,ty,tw,th,axis,areaType,c,coneStart,coneEnd){
  for(let cx=0;cx<tw;cx++)for(let cy=0;cy<th;cy++)for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){
    if(lineConeHitTest(axis,areaType,c,coneStart,coneEnd,(tx+cx+i/4)*c,(ty+cy+j/4)*c))return true;
  }
  return false;
}
function lineConeMarkupFromAxis(a,axis){
  const {cx,cy,angle,range}=axis, c=S.map.cell;
  const dx=Math.cos(angle), dy=Math.sin(angle), px=-dy, py=dx;
  let poly;
  if(a.area==='line'){
    const hw=c/2;
    poly=[[cx+px*hw,cy+py*hw],[cx-px*hw,cy-py*hw],[cx-px*hw+dx*range,cy-py*hw+dy*range],[cx+px*hw+dx*range,cy+py*hw+dy*range]];
  }else{
    const sw=(a.coneStart||1)*c/2, ew=(a.coneEnd||3)*c/2;
    poly=[[cx+px*sw,cy+py*sw],[cx-px*sw,cy-py*sw],[cx+dx*range-px*ew,cy+dy*range-py*ew],[cx+dx*range+px*ew,cy+dy*range+py*ew]];
  }
  const pts=poly.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const mapW=S.map.cols*c, mapH=S.map.rows*c;
  if(a.zoneImage){
    const clipId='clip'+Math.random().toString(36).slice(2,9);
    return `<svg id="zonePreview" style="position:absolute;left:0;top:0;pointer-events:none;z-index:40" width="${mapW}" height="${mapH}"><defs><clipPath id="${clipId}"><polygon points="${pts}"/></clipPath></defs><image href="${esc(a.zoneImage)}" x="0" y="0" width="${mapW}" height="${mapH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})" opacity=".85"/><polygon points="${pts}" fill="none" stroke="#c084fc" stroke-width="2"/></svg>`;
  }
  const effect=a.effect?`<text x="${cx+dx*range/2}" y="${cy+dy*range/2}" font-size="${Math.max(24,c*0.8)}" text-anchor="middle" dominant-baseline="middle" opacity=".42">${esc(a.effect)}</text>`:'';
  return `<svg id="zonePreview" style="position:absolute;left:0;top:0;pointer-events:none;z-index:40" width="${mapW}" height="${mapH}"><polygon points="${pts}" fill="#a44cff38" stroke="#c084fc" stroke-width="2"/>${effect}</svg>`;
}
function lineConeMarkup(a,targetCell,originOverride,rangeCellsOverride){
  const axis=zoneAxis(a,targetCell,originOverride,rangeCellsOverride); if(!axis)return '';
  return lineConeMarkupFromAxis(a,axis);
}
function zoneMarkup(a,cell,originOverride,rangeCellsOverride){
  if(a.area==='line'||a.area==='cone')return lineConeMarkup(a,cell,originOverride,rangeCellsOverride);
  let size=a.areaSize||3, x=cell[0], y=cell[1];
  x=Math.max(0,Math.min(S.map.cols-size,x)); y=Math.max(0,Math.min(S.map.rows-size,y));
  const px=x*S.map.cell, py=y*S.map.cell, d=size*S.map.cell;
  const radius=a.area==='circle'?'border-radius:50%;':'';
  if(a.zoneImage){
    return `<div id="zonePreview" class="zone" style="z-index:40;left:${px}px;top:${py}px;width:${d}px;height:${d}px;${radius}background:none;border-color:#c084fc;overflow:hidden"><img src="${esc(a.zoneImage)}" style="width:100%;height:100%;object-fit:cover;opacity:.85"></div>`;
  }
  const effect=a.effect?`<span class="zone-effect" style="font-size:${Math.max(24,size*8)}px">${esc(a.effect)}</span>`:'';
  return `<div id="zonePreview" class="zone" style="z-index:40;left:${px}px;top:${py}px;width:${d}px;height:${d}px;${radius}">${effect}</div>`;
}
function clampZone(a,s){const z=a.areaSize||3;return [Math.max(0,Math.min(S.map.cols-z,s[0])),Math.max(0,Math.min(S.map.rows-z,s[1]))];}
function clampToRange(ci,cell,range){
  if(!ci||!(range>0))return cell;
  const sw=ci.sizeW||1,sh=ci.sizeH||1;
  if(footprintDistance(ci.x,ci.y,sw,sh,cell[0],cell[1],1,1)<=range)return cell;
  const cx=ci.x+(sw-1)/2,cy=ci.y+(sh-1)/2,vx=cell[0]-cx,vy=cell[1]-cy;
  for(let k=1;k>=0;k-=0.02){
    const nx=Math.round(cx+vx*k),ny=Math.round(cy+vy*k);
    if(footprintDistance(ci.x,ci.y,sw,sh,nx,ny,1,1)<=range)return [nx,ny];
  }
  return [ci.x,ci.y];
}
function persistentLiveOrigin(a,ci){
  const p=pendingPersistentOrigin,c=S.map.cell,b=instCenterPx(ci);
  let o=p.frozen||p.mousePx||b;
  if(a.range>0&&!p.frozen){
    const maxPx=a.range*c+Math.max(ci.sizeW||1,ci.sizeH||1)*c/2;
    const dx=o[0]-b[0],dy=o[1]-b[1],d=Math.hypot(dx,dy);
    if(d>maxPx)o=[b[0]+dx*maxPx/d,b[1]+dy*maxPx/d];
  }
  return o;
}
function persistentAngle(p,o,ci){
  if(p.angle!=null)return p.angle;
  const b=instCenterPx(ci);
  return Math.atan2(o[1]-b[1],o[0]-b[0]);
}
function updateZonePreview(){
  const map=document.getElementById('map'); if(!map)return;
  document.getElementById('zonePreview')?.remove();
  const caster=selectedToken?inst(selectedToken):null;

    const o=persistentLiveOrigin(a,caster);
    map.insertAdjacentHTML('beforeend',lineConeMarkupFromAxis(a,{cx:o[0],cy:o[1],angle:persistentAngle(p,o,caster),range:(a.zoneRange||a.range||1)*S.map.cell}));
    return;
  }
  if(!activeAbility||!hoverCell)return;

  let cell=hoverCell;
  if(a.area==='square'||a.area==='circle')cell=clampToRange(caster,hoverCell,a.range);
  map.insertAdjacentHTML('beforeend',zoneMarkup(a,cell));
}

function occRuns(a,n){
  const r=[]; let s=-1;
  for(let i=0;i<=a.length;i++){ if(i<a.length&&a[i]){if(s<0)s=i;} else if(s>=0){r.push([s,i]);s=-1;} }
  while(r.length>n){let bi=0,bg=1e9;for(let i=0;i<r.length-1;i++){const g=r[i+1][0]-r[i][1];if(g<bg){bg=g;bi=i;}}r.splice(bi,2,[r[bi][0],r[bi+1][1]]);}
  return r.length===n?r:null;
}
/* Découpe en n zones : essaie des seuils croissants pour séparer même des sprites qui se frôlent ; renvoie les bornes de coupe */
function splitCuts(counts,n,total){
  const max=Math.max(...counts); if(!max)return null;
  for(const f of [0,0.02,0.04,0.08,0.15]){
    const r=occRuns(counts.map(v=>v>max*f),n);
    if(r){
      const cuts=[0];
      for(let i=0;i<r.length-1;i++)cuts.push(Math.round((r[i][1]+r[i+1][0])/2));
      cuts.push(total);
      return cuts;
    }
  }
  return null;
}
function spriteRectsFromAlpha(d,W,H,frames,rows){
  const px=(x,y)=>d[(y*W+x)*4+3]>8;
  const rowCnt=new Array(H).fill(0);
  for(let y=0;y<H;y++){let c=0;for(let x=0;x<W;x++)if(px(x,y))c++;rowCnt[y]=c;}
  const rc=splitCuts(rowCnt,rows,H); if(!rc)return null;
  const cols=Math.ceil(frames/rows), list=[];
  for(let b=0;b<rows;b++){
    const y0=rc[b],y1=rc[b+1];
    const count=Math.min(cols,frames-b*cols); if(count<=0)break;
    const colCnt=new Array(W).fill(0);
    for(let x=0;x<W;x++){let c=0;for(let y=y0;y<y1;y++)if(px(x,y))c++;colCnt[x]=c;}
    const cc=splitCuts(colCnt,count,W); if(!cc)return null;
    for(let i=0;i<count;i++){
      const x0=cc[i],x1=cc[i+1];
      let xmin=x1,xmax=x0,ymin=y1,ymax=y0;
      for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(px(x,y)){if(x<xmin)xmin=x;if(x>xmax)xmax=x;if(y<ymin)ymin=y;if(y>ymax)ymax=y;}
      if(xmax<xmin)return null;
      list.push({x:xmin,y:ymin,w:xmax-xmin+1,h:ymax-ymin+1});
    }
  }
  if(list.length!==frames)return null;
  return {list,maxW:Math.max(...list.map(r=>r.w)),maxH:Math.max(...list.map(r=>r.h))};
}
function detectSpriteRects(img,frames,rows){
  const key=frames+'x'+rows;
  img._rects=img._rects||{};
  if(img._rects[key]!==undefined)return img._rects[key];
  let res=null;
  try{
    const W=img.naturalWidth,H=img.naturalHeight;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(img,0,0);
    res=spriteRectsFromAlpha(cx.getImageData(0,0,W,H).data,W,H,frames,rows);
  }catch(err){ res=null; }
  img._rects[key]=res;
  return res;
}
const fxAvgColorCache={};
function getAvgColorFromImage(url,cb){
  if(!url)return;
  if(fxAvgColorCache[url]){cb(fxAvgColorCache[url]);return;}
  const img=getFxImg(url); if(!img)return;
  const compute=()=>{
    try{
      const cw=8,ch=8;
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      const cx=cv.getContext('2d');
      cx.drawImage(img,0,0,cw,ch);
      const data=cx.getImageData(0,0,cw,ch).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<data.length;i+=4){r+=data[i];g+=data[i+1];b+=data[i+2];n++;}
      const hex='#'+[Math.round(r/n),Math.round(g/n),Math.round(b/n)].map(v=>v.toString(16).padStart(2,'0')).join('');
      fxAvgColorCache[url]=hex;
      cb(hex);
    }catch(e){ /* image non accessible en canvas (CORS) : on garde la couleur par élément */ }
  };
  if(img.complete&&img.naturalWidth)compute(); else img.onload=compute;
}
function instCenterPx(t){
  const c=S.map.cell;
  const sw=t.sizeW||1, sh=t.sizeH||1;
  return [(S.freeMovement&&t.px!=null)?t.px:t.x*c+sw*c/2,(S.freeMovement&&t.py!=null)?t.py:t.y*c+sh*c/2];
}
function ensureFxCanvas(){
  const map=document.getElementById('map'); if(!map)return null;
  let cv=document.getElementById('fxCanvas');
  if(!cv){
    cv=document.createElement('canvas');
    cv.id='fxCanvas';
    cv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:32';
    map.appendChild(cv);
  }
  cv.width=S.map.cols*S.map.cell; cv.height=S.map.rows*S.map.cell;
  if(fxList.length&&!fxRafRunning){fxRafRunning=true;requestAnimationFrame(fxLoop);}
  return cv;
}
let fxList=[];
let fxRafRunning=false;
function fxStart(fx){
  fx.start=performance.now();
  fxList.push(fx);
  if(!fxRafRunning){fxRafRunning=true;requestAnimationFrame(fxLoop);}
}
function fxLoop(now){
  const cv=document.getElementById('fxCanvas');
  if(!cv){fxRafRunning=false;return;}
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const stillAlive=[], ended=[];
  fxList.forEach(fx=>{
    const elapsed=now-fx.start;
    if(elapsed>=fx.duration){ended.push(fx);return;}
    try{fx.draw(ctx,elapsed);}catch(e){}
    stillAlive.push(fx);
  });
  fxList=stillAlive;
  ended.forEach(fx=>{ if(fx.onEnd)fx.onEnd(); });
  if(fxList.length)requestAnimationFrame(fxLoop); else fxRafRunning=false;
}
function fxDrawFrame(ctx,img,frame,frames,rows,dx,dy,dw,dh){
  if(!img||!img.complete||!img.naturalWidth)return;
  rows=rows||1;
  if(img._auto){
    const rc=detectSpriteRects(img,frames,rows);
    if(rc&&rc.list[frame]){
      const r=rc.list[frame], k=Math.min(dw/rc.maxW,dh/rc.maxH), w=r.w*k, h=r.h*k;
      let ox=dx+(dw-w)/2, oy=dy+(dh-h)/2;
      if(img._auto==='bottom')oy=dy+(dh+rc.maxH*k)/2-h;
      else if(img._auto==='origin'){
        const cols=Math.max(1,Math.ceil(frames/rows));
        const cx=((frame%cols)+.5)*img.naturalWidth/cols, cy=(Math.floor(frame/cols)+.5)*img.naturalHeight/rows;
        ox=dx+dw/2+(r.x+r.w/2-cx)*k-w/2; oy=dy+dh/2+(r.y+r.h/2-cy)*k-h/2;
      }
      ctx.drawImage(img,r.x,r.y,r.w,r.h,ox,oy,w,h);
      return;
    }
  }
  const cols=Math.max(1,Math.ceil(frames/rows));
  const fw=img.naturalWidth/cols, fh=img.naturalHeight/rows;
  const row=Math.floor(frame/cols), col=frame%cols;
  ctx.drawImage(img,col*fw,row*fh,fw,fh,dx,dy,dw,dh);
}
function fxAddImpact(img,frames,rows,cx,cy,w,h,fps,clip){
  if(!img)return;
  const duration=Math.max(200,frames/fps*1000);
  fxStart({duration,draw(ctx,elapsed){
    const frame=Math.min(frames-1,Math.floor(elapsed/1000*fps));
    ctx.save(); if(clip)clip(ctx);
    fxDrawFrame(ctx,img,frame,frames,rows,cx-w/2,cy-h/2,w,h);
    ctx.restore();
  }});
}
function fxAddSpin(img,cx,cy,size,radius,turnsPerSec,duration){
  if(!img)return;
  fxStart({duration,draw(ctx,elapsed){
    if(!img.complete||!img.naturalWidth)return;
    const fade=Math.min(1,(duration-elapsed)/(duration*0.2));
    ctx.save(); ctx.globalAlpha=Math.max(0,fade);
    const ang=Math.PI*2*turnsPerSec*elapsed/1000;
    ctx.translate(cx+Math.cos(ang)*radius,cy+Math.sin(ang)*radius); ctx.rotate(ang);
    ctx.drawImage(img,-size/2,-size/2,size,size);
    ctx.restore();
  }});
}
function fxAddProjectile(img,frames,rows,fromX,fromY,toX,toY,size,fps,onArrive){
  const dist=Math.hypot(toX-fromX,toY-fromY);
  const speed=600; // px/s
  const duration=Math.max(120,dist/speed*1000);
  const angle=Math.atan2(toY-fromY,toX-fromX);
  fxStart({duration,draw(ctx,elapsed){
    const t=Math.min(1,elapsed/duration);
    const x=fromX+(toX-fromX)*t, y=fromY+(toY-fromY)*t;
    if(!img||!img.complete||!img.naturalWidth)return;
    const frame=frames>1?Math.floor(elapsed/1000*fps)%frames:0;
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    fxDrawFrame(ctx,img,frame,frames,rows||1,-size/2,-size/2,size,size);
    ctx.restore();
  },onEnd:onArrive});
}
function fxAddConeFill(cx,cy,angle,range,halfWStart,halfWEnd,color,duration){
  fxStart({duration,draw(ctx,elapsed){
    const t=Math.min(1,elapsed/duration);
    const curRange=range*t;
    const dx=Math.cos(angle),dy=Math.sin(angle),px=-dy,py=dx;
    const w=halfWStart+(halfWEnd-halfWStart)*t;
    ctx.beginPath();
    ctx.moveTo(cx+px*halfWStart,cy+py*halfWStart);
    ctx.lineTo(cx-px*halfWStart,cy-py*halfWStart);
    ctx.lineTo(cx-px*w+dx*curRange,cy-py*w+dy*curRange);
    ctx.lineTo(cx+px*w+dx*curRange,cy+py*w+dy*curRange);
    ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  }});
}
const fxConeImageCache = {};

function fxAddConeImage(cx, cy, angle, range, halfWStart, halfWEnd, imgSrc, duration) {
  if (!fxConeImageCache[imgSrc]) {
    fxConeImageCache[imgSrc] = new Image();
    fxConeImageCache[imgSrc].src = imgSrc;
  }
  var img = fxConeImageCache[imgSrc];

  // Attend que l'image soit chargée (important pour les autres joueurs qui ne l'ont pas encore en cache)
  if (!(img.complete && img.naturalWidth)) {
    img.onload = function(){ fxAddConeImage(cx, cy, angle, range, halfWStart, halfWEnd, imgSrc, duration); };
    return;
  }

  fxStart({
    duration: duration,
    draw: function(ctx, elapsed) {
      var t = Math.min(1, elapsed / duration);
      var curRange = range * t;
      var dx = Math.cos(angle);
      var dy = Math.sin(angle);
      var px = -dy;
      var py = dx;
      var w = halfWStart + (halfWEnd - halfWStart) * t;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + px * halfWStart, cy + py * halfWStart);
      ctx.lineTo(cx - px * halfWStart, cy - py * halfWStart);
      ctx.lineTo(cx - px * w + dx * curRange, cy - py * w + dy * curRange);
      ctx.lineTo(cx + px * w + dx * curRange, cy + py * w + dy * curRange);
      ctx.closePath();

      ctx.clip();

      if (img.complete && img.naturalWidth !== 0) {
        var pattern = ctx.createPattern(img, 'repeat');
        if (pattern) {
          // ========================================================
          // CORRECTION DU ZOOM : On adapte l'image à la taille des cases
          // ========================================================
          var matrix = new DOMMatrix();
          
          // Exemple : On veut que l'image fasse la taille de 2 cases de la grille (cell * 2)
          var targetSize = (S.map?.cell ?? 32) * 1; 
          var scaleX = targetSize / img.naturalWidth;
          var scaleY = targetSize / img.naturalHeight;
          
          // On applique l'échelle (le dé-zoom) à la texture
          matrix = matrix.scale(scaleX, scaleY);
		  matrix = matrix.translate(-elapsed * 1.2, 0); 
          pattern.setTransform(matrix);
          // ========================================================

          ctx.fillStyle = pattern;
          ctx.globalAlpha = 0.6; // Opacité (60%) pour voir la grille à travers
          ctx.fill();
        }
      }
      ctx.restore();
    }
  });
}
const FX_ELEMENT_COLORS={Feu:'#ff6a3c',Eau:'#3ca0ff',Terre:'#8a6b3c',Air:'#c9e6ff',Glace:'#7fd8ff',Foudre:'#ffe066',Lumière:'#fff3b0',Ténèbres:'#8b5cf6',Poison:'#7ed957',Neutre:'#c084fc',Physique:'#e0e0e0'};
function fxElementColor(el){return (FX_ELEMENT_COLORS[el]||'#c084fc')+'99';}
function playAbilityFX(a,casterInst,targets,start){
  if(!casterInst)return;
  ensureFxCanvas();
  const cell=S.map.cell, fps=a.animFps||60;
  const projImg=a.projectileImage?getFxImg(a.projectileImage,a.spriteAuto):null;
  const impactImg=a.impactSpritesheet?getFxImg(a.impactSpritesheet,a.spriteAuto):null;
  const projFrames=Math.max(1,a.projectileFrames||1);
  const projRows=Math.max(1,a.projectileRows||1);
  const impactFrames=Math.max(1,a.impactFrames||1);
  const [fromX,fromY]=instCenterPx(casterInst);
  const doImpact=(cx,cy,size,clip)=>{ if(impactImg)fxAddImpact(impactImg,impactFrames,a.impactRows||1,cx,cy,size,size,fps,clip); };
  const doImpactZoneOrPerToken=(cx,cy,size,clip)=>{
    if(a.area==='self'&&!(targets||[]).length)return; // autour de soi sans cible : pas d'impact
    if(a.impactPerToken&&(targets||[]).length){
      targets.forEach(t=>{
        const [tx,ty]=instCenterPx(t);
        const tsize=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
        doImpact(tx,ty,tsize);
      });
    }else{
      doImpact(cx,cy,size,clip);
    }
  };

  if(a.area==='single'){
    (targets||[]).forEach(t=>{
      const [tx,ty]=instCenterPx(t);
      const size=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
      if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,tx,ty,cell*0.9,fps,()=>doImpact(tx,ty,size));
      else doImpact(tx,ty,size);
    });
    return;
  }
  if(a.area==='square'||a.area==='circle'){
    const size=(a.areaSize||3)*cell;
    const cx=start[0]*cell+size/2, cy=start[1]*cell+size/2;
    const clip=a.area==='circle'?(ctx=>{ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.clip();}):null;
    if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,cx,cy,cell*0.9,fps,()=>doImpactZoneOrPerToken(cx,cy,size,clip));
    else doImpactZoneOrPerToken(cx,cy,size,clip);
    return;
  }
  if(a.area==='self'){
    const sw=casterInst.sizeW||1, sh=casterInst.sizeH||1;
    const size=((a.areaSize||1)*2+Math.max(sw,sh))*cell;
    if(a.spinImage){
      const imgSize=(a.areaSize||1)*cell;
      const radius=size/2-imgSize/2;
      fxAddSpin(getFxImg(a.spinImage),fromX,fromY,imgSize,radius,a.spinSpeed||2,(a.spinDuration||1)*1000);
    }
    doImpactZoneOrPerToken(fromX,fromY,size);
    return;
  }
  if(a.area==='line'){
    const axis=zoneAxis(a,start); if(!axis)return;
    const endX=axis.cx+Math.cos(axis.angle)*axis.range;
    const endY=axis.cy+Math.sin(axis.angle)*axis.range;
    const size=cell*1.4;
    if(projImg)fxAddProjectile(projImg,projFrames,projRows,fromX,fromY,endX,endY,cell*0.9,fps,()=>doImpactZoneOrPerToken(endX,endY,size));
    else doImpactZoneOrPerToken(endX,endY,size);
    return;
  }
  if(a.area==='cone'){
    const axis=zoneAxis(a,start); if(!axis)return;
    const c=cell;
    const sw=((a.coneStart||1)*c/2)*0.2;
    const ew=(a.coneEnd||3)*c/2;
    const duration=Math.max(200,(axis.range/500)*1000);
    if (a.zoneImage) {
      // Lance l'affichage du cône avec l'image (flammes)
      fxAddConeImage(axis.cx, axis.cy, axis.angle, axis.range, sw, ew, a.zoneImage, duration);
    } else {
      let color=fxElementColor(a.element);
      fxAddConeFill(axis.cx, axis.cy, axis.angle, axis.range, sw, ew, color, duration);
    }
  }
  }

/* ============================= CHAT : COMMANDE /r ============================= */
function parseDiceExpr(raw){
  const expr=String(raw||'').replace(/\s+/g,'').toLowerCase();
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(expr))return null;
  const terms=[...expr.matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/g)];
  let totalDice=0;
  for(const t of terms){
    if(t[3]){const n=+(t[2]||1),s=+t[3];if(n<1||s<1||s>1000)return null;totalDice+=n;}
  }
  if(totalDice>50)return null;
  const parts=[]; let total=0;
  for(const t of terms){
    const sign=t[1]==='-'?-1:1;
    if(t[3]){
      const n=+(t[2]||1),sides=+t[3];
      const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));
      const sum=rolls.reduce((a,x)=>a+x,0);
      total+=sign*sum;
      parts.push({label:`${sign<0?'−':''}${n}d${sides}`,rolls,sum:sign*sum,sides});
    }else{
      const v=sign*(+t[4]); total+=v; parts.push({label:null,rolls:null,sum:v});
    }
  }
  return {expr,parts,total};
}
function sendChat(){
  if(!currentUser)return;
  const text=(document.getElementById('chat_input')?.value||chatDraft||'').trim();
  if(!text)return;
  const name=esc(myDisplayName());
  const m=text.match(/^\/r(?:\s+(.*))?$/i);
  if(m){
    const r=parseDiceExpr(m[1]);
    if(!r){toast('⚠️ Syntaxe : /r d100, /r 2d20+5 (max 50 dés, d1000).');return;}
    r.parts.forEach(p=>{if(p.rolls&&p.rolls.length)broadcastDiceRoll(p.sides,p.rolls);});
    const lines=r.parts.map(p=>p.rolls
      ?`🎲 ${p.label} : ${p.rolls.join(' + ')}${p.rolls.length>1?` = ${Math.abs(p.sum)}`:''}`
      :`➕ Bonus : ${p.sum>0?'+':''}${p.sum}`);
    addLog(`🎲 <b>${name}</b> — /r ${esc(r.expr)}<br>${lines.join('<br>')}<br>🎯 Total : <b>${r.total}</b>`);
  }else if(text.startsWith('/')){
    toast('⚠️ Commande inconnue. Utilise /r [expression].');return;
  }else{
    addLog(`💬 <b>${name}</b> : ${esc(text)}`);
  }
  chatDraft='';
  persistState(); render();
  document.getElementById('chat_input')?.focus();
}

/* ============================= MULTISÉLECTION (MJ, hors combat) ============================= */
function moveGroupTo(cx,cy){
  const d=dragCandidate,g=d.group,cell=S.map.cell;
  const setEl=(id,x,y)=>{const el=document.querySelector(`[data-token="${id}"]`);if(el){el.style.left=x+'px';el.style.top=y+'px';}};
  if(S.freeMovement){
    const [fx,fy]=mapPixelPoint(cx,cy);
    const W=S.map.cols*cell,H=S.map.rows*cell;
    const dx=Math.max(-Math.min(...g.map(o=>o.px)),Math.min(W-Math.max(...g.map(o=>o.px)),fx-d.startPix[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.py)),Math.min(H-Math.max(...g.map(o=>o.py)),fy-d.startPix[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.px=o.px+dx; t.py=o.py+dy;
      t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(t.px/cell)));
      t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(t.py/cell)));
      setEl(o.id,t.px,t.py);
    });
  }else{
    const pt=mapPoint(cx,cy);
    const dx=Math.max(-Math.min(...g.map(o=>o.x)),Math.min(S.map.cols-1-Math.max(...g.map(o=>o.x)),pt[0]-d.startCell[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.y)),Math.min(S.map.rows-1-Math.max(...g.map(o=>o.y)),pt[1]-d.startCell[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.x=o.x+dx; t.y=o.y+dy;
      setEl(o.id,t.x*cell+cell/2,t.y*cell+cell/2);
    });
  }
}
function finishGroupDrag(){
  const d=dragCandidate; dragCandidate=null;
  const g=d.group;
  if(!d.moved){selectedToken=d.id;multiSel=[];render();return;}
  let changed=true;
  if(!S.freeMovement){
    const ids=g.map(o=>o.id);
    const blocker=S.instances.find(i=>!ids.includes(i.id)&&g.some(o=>{const t=inst(o.id);return t&&t.x===i.x&&t.y===i.y;}));
    if(blocker){
      g.forEach(o=>{const t=inst(o.id);if(t){t.x=o.x;t.y=o.y;}});
      toast(`🚫 ${blocker.label} bloque le déplacement du groupe — annulé.`);
      changed=false;
    }
  }
  if(changed){addLog(`↦ Le MJ déplace ${g.length} tokens.`);saveState();}
  render();
}
function finishSelBox(){
  const b=selBox; selBox=null;
  document.getElementById('selRect')?.remove();
  if(!b.moved){
    if(selectedToken||multiSel.length){selectedToken=null;multiSel=[];render();}
    return;
  }
  const wrap=document.getElementById('mapWrap'); if(!wrap)return;
  const r=wrap.getBoundingClientRect(),cell=S.map.cell;
  const toPix=(cx,cy)=>[(cx-r.left-mapPan.x)/mapZoom,(cy-r.top-mapPan.y)/mapZoom];
  const [ax,ay]=toPix(b.startX,b.startY),[bx,by]=toPix(b.curX,b.curY);
  const x1=Math.min(ax,bx),x2=Math.max(ax,bx),y1=Math.min(ay,by),y2=Math.max(ay,by);
  const ids=S.instances.filter(t=>{
    const cx=(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2;
    const cy=(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2;
    return cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2;
  }).map(t=>t.id);
  if(ids.length===1){selectedToken=ids[0];multiSel=[];}
  else{selectedToken=null;multiSel=ids;}
  render();
}

/* ============================= COMBAT (MJ uniquement) ============================= */
function startCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut démarrer le combat.');return;}
  const ids=S.instances.map(i=>i.id);
  if(!ids.length){toast('Aucun token sur la carte.');return;}
  if(S.freeMovement){
    S.freeMovement=false;
    snapAllTokensToGrid();
    addLog('🎯 Placement libre désactivé automatiquement pour le début du combat — les tokens reviennent au centre des cases.');
  }
  const init={};
  ids.forEach(id=>{const tpl=instTemplate(inst(id));init[id]=roll('1d20').total+(tpl?.stats?.Vitesse||0);});
  const groups={}; ids.forEach(id=>(groups[init[id]]??=[]).push(id));
  Object.values(groups).forEach(group=>{
    if(group.length>1){
      const rolled=group.map(id=>({id,r:roll('1d100').total})).sort((a,b)=>b.r-a.r);
      rolled.forEach((x,i)=>{init[x.id]+=(rolled.length-i)/1000;});
    }
  });
  const order=[...ids].sort((a,b)=>init[b]-init[a]);
  S.combat={active:true,order,turn:-1,initiatives:Object.fromEntries(order.map(id=>[id,Math.floor(init[id])]))};
  addLog('⚔ <b>Combat démarré</b> — initiative : '+order.map(id=>`${esc(inst(id).label)} (${S.combat.initiatives[id]})`).join(', ')+'.');
  advanceTurn();
  saveState(); render();
}
function endCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut terminer le combat.');return;}
  S.combat={active:false,order:[],turn:0,initiatives:{}};
  lastTurnCombatant=null;
  addLog('⏹ Fin du combat.');
  S.freeMovement=true;
  addLog('🎯 Placement libre activé automatiquement.');
  saveState(); render();
}
/* ---- Effets automatiques de début de tour : auras (Passif), buffs/débuffs, afflictions ---- */
function tokenInAura(caster,target,a){
  const size=a.areaSize||1;
  const csw=caster.sizeW||1, csh=caster.sizeH||1, tsw=target.sizeW||1, tsh=target.sizeH||1;
  const gapX=Math.max(0, target.x-(caster.x+csw-1), caster.x-(target.x+tsw-1));
  const gapY=Math.max(0, target.y-(caster.y+csh-1), caster.y-(target.y+tsh-1));
  if(a.area==='circle')return Math.sqrt(gapX*gapX+gapY*gapY)<=size;
  return gapX<=size&&gapY<=size;
}
function triggerAuras(casterInst){
  const casterTpl=instTemplate(casterInst); if(!casterTpl)return;
  (casterInst.activeAuras||[]).slice().forEach(abilityId=>{
    const a=S.abilities.find(x=>x.id===abilityId);
    if(!a){casterInst.activeAuras=(casterInst.activeAuras||[]).filter(id=>id!==abilityId);return;}
    if(a.manaCost>0&&(casterInst.mana||0)<a.manaCost){
      casterInst.activeAuras=(casterInst.activeAuras||[]).filter(id=>id!==abilityId);
      addLog(`🌀 L'aura <b>${esc(a.name)}</b> de <b>${esc(casterInst.label)}</b> se désactive (mana insuffisant).`);
      return;
    }
    if(a.manaCost>0)casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
    const targets=S.instances.filter(t=>tokenInAura(casterInst,t,a));
    if(!targets.length)return;
    const r=roll(a.formula);
    const lines=[`🌀 <b>${esc(casterInst.label)}</b> — aura <b>${esc(a.name)}</b> : ${esc(a.formula)} = ${r.total}`];
    targets.forEach(t=>{
      const tTpl=instTemplate(t);
      const amount=applyMult(Math.ceil(r.total*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
      if(a.auraEffect==='heal'){
        t.hp=Math.min(t.hpMax,t.hp+amount);
        lines.push(`💚 ${esc(t.label)} : +${amount} PV`);
        broadcastHud(t.id,{hp:amount});
      }else if(a.auraEffect==='shield'){
        t.shield=(t.shield||0)+amount; if(t.shield>t.shieldMax)t.shieldMax=t.shield;
        lines.push(`🛡 ${esc(t.label)} : +${amount} bouclier`);
        broadcastHud(t.id,{shield:amount});
      }else{
        let dmg=amount;
        const def=effectiveDef(tTpl,t)[a.defense]||0; dmg=Math.max(0,dmg-def);
        const resist=(effectiveRes(tTpl,t)[a.element]||0)/100; dmg=Math.max(0,Math.ceil(dmg*(1-resist)));
        const absorbed=Math.min(t.shield||0,dmg); t.shield-=absorbed; const hpDmg=dmg-absorbed;
        t.hp=Math.max(0,t.hp-hpDmg);
        lines.push(`✨ ${esc(t.label)} : -${hpDmg} PV`);
        broadcastHud(t.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
        if(t.hp<=0){lines.push(`💀 <b>${esc(t.label)} est KO</b>.`);handleInstanceDeath(t,casterInst);}
      }
    });
    addLog(lines.join('<br>'));
  });
}
function tickStatusEffects(inst_){
  if(!inst_.statusEffects||!inst_.statusEffects.length)return;
  const tTpl=instTemplate(inst_);
  const remaining=[];
  inst_.statusEffects.forEach(se=>{
    const r=roll(se.formula);
    const raw=applyMult(Math.max(0,Math.ceil(r.total*(se.mult||1)*(se.statValue||0)/100)),se.dmgMult);
    if(se.element==='Soin'){
      inst_.hp=Math.min(inst_.hpMax,inst_.hp+raw);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} PV`);
      broadcastHud(inst_.id,{hp:raw});
    }else if(se.element==='Bouclier'){
      inst_.shield=(inst_.shield||0)+raw; if(inst_.shield>inst_.shieldMax)inst_.shieldMax=inst_.shield;
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} bouclier`);
      broadcastHud(inst_.id,{shield:raw});
    }else if(se.element==='Récupération'){
      inst_.mana=Math.min(inst_.manaMax,inst_.mana+raw);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} mana`);
      broadcastHud(inst_.id,{mana:raw});
    }else{
      let dmg=raw;
      const def=se.defense!=='none'?(effectiveDef(tTpl,inst_)[se.defense]||0):0;
      dmg=Math.max(0,dmg-def);
      if(se.element!=='Physique'&&se.element!=='Neutre'){
        const resist=(effectiveRes(tTpl,inst_)[se.element]||0)/100;
        dmg=Math.max(0,Math.ceil(dmg*(1-resist)));
      }
      const absorbed=Math.min(inst_.shield||0,dmg); inst_.shield-=absorbed; const hpDmg=dmg-absorbed;
      inst_.hp=Math.max(0,inst_.hp-hpDmg);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : -${hpDmg} PV`);
      broadcastHud(inst_.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
      if(inst_.hp<=0){addLog(`💀 <b>${esc(inst_.label)} est KO</b>.`);handleInstanceDeath(inst_);}
    }
    se.turnsLeft--;
    if(se.turnsLeft>0)remaining.push(se);
    else addLog(`🌀 <b>${esc(se.name)}</b> se termine sur <b>${esc(inst_.label)}</b>.`);
  });
  inst_.statusEffects=remaining;
}
function tickAfflictions(inst_){
  if(!inst_.afflictions||!inst_.afflictions.length)return {skip:false,blockMove:false};
  let skip=false, blockMove=false;
  inst_.afflictions.forEach(af=>{
    const def=(S.afflictionDefs||[]).find(d=>d.id===af.defId); if(!def)return;
    af.turns=(af.turns||0)+1;
    const pct=(def.dmgBase||0)+(def.dmgGrowth||0)*(af.turns-1);
    if(pct>0){
      const dmg=Math.ceil((inst_.hpMax||0)*pct/100);
      const absorbed=Math.min(inst_.shield||0,dmg); inst_.shield-=absorbed; const hpDmg=dmg-absorbed;
      inst_.hp=Math.max(0,inst_.hp-hpDmg);
      addLog(`🩸 <b>${esc(inst_.label)}</b> subit <b>${esc(def.name)}</b> : -${hpDmg} PV (${pct}%)`);
      broadcastHud(inst_.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
      if(inst_.hp<=0){addLog(`💀 <b>${esc(inst_.label)} est KO</b>.`);handleInstanceDeath(inst_);}
    }
    if(def.skipTurn)skip=true;
    if(def.preventMove)blockMove=true;
  });
  return {skip,blockMove};
}
function advanceTurn(){
  if(!S.combat.active||!S.combat.order.length)return;
  let safety=0;
  while(true){
    S.combat.turn=(S.combat.turn+1)%S.combat.order.length;
    if(S.combat.turn===0)decayPersistentZones(); // tout le monde a joué : un tour complet s'écoule
    const nt=inst(S.combat.order[S.combat.turn]);
    if(nt){
      const tpl=instTemplate(nt);
      nt.remainingMove=nt.isKO?0:effectiveMove(tpl);
      nt.movementBlocked=nt.isKO?true:false;
      triggerAuras(nt);
      tickStatusEffects(nt);
      tickPersistentZones(nt);
      const res=tickAfflictions(nt);
      nt.movementBlocked=nt.isKO?true:res.blockMove;
      if(res.skip||nt.isKO){
        addLog(`⏭ <b>${esc(nt.label)}</b> passe son tour (${nt.isKO?'inconscient':'affliction'}).`);
        safety++;
        if(safety>S.combat.order.length+2)break;
        continue;
      }
    }
    break;
  }
  lastTurnCombatant=S.combat.order[S.combat.turn];
  if(canControlInstance(lastTurnCombatant))selectedToken=lastTurnCombatant;
}
function nextTurn(){
  if(!isMJ()){toast('⛔ Seul le MJ peut avancer le tour.');return;}
  advanceTurn();saveState();render();
}

/* ============================= CARTE : SÉLECTION / DRAG / PAN / ZOOM ============================= */
function mapPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const x=(clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom);
  const y=(clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom);
  return [Math.max(0,Math.min(S.map.cols-1,Math.floor(x))),Math.max(0,Math.min(S.map.rows-1,Math.floor(y)))];
}
function mapPixelPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const fx=(clientX-rect.left-mapPan.x)/mapZoom;
  const fy=(clientY-rect.top-mapPan.y)/mapZoom;
  return [Math.max(0,Math.min(S.map.cols*S.map.cell,fx)),Math.max(0,Math.min(S.map.rows*S.map.cell,fy))];
}
function applyMapTransform(){const map=document.getElementById('map');if(map)map.style.transform=`translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom})`;}

function setupMapInteractions(){
  const wrap=document.getElementById('mapWrap'); const map=document.getElementById('map');
  if(!wrap||!map)return;
  ensureFxCanvas();
  const hint=document.getElementById('mapDropHint');

  wrap.ondragover=e=>{e.preventDefault();hint?.classList.add('show');};
  wrap.ondragleave=()=>hint?.classList.remove('show');
  wrap.ondrop=e=>{

  wrap.oncontextmenu=e=>{

  wrap.onmousedown=e=>{

        if(a&&t){
          const pt=(a.area==='single')?[t.x,t.y]:mapPoint(e.clientX,e.clientY);
          if(a.type==='Buff'){
            if(a.area==='single')resolveBuffAbility(a,inst(selectedToken),id);

          }

          else resolveAbility(a,pt,a.area==='single'?id:undefined);

      }
      if(isMJ()&&!S.combat.active&&multiSel.length>1&&multiSel.includes(id)){
        const cell=S.map.cell;
        dragCandidate={id,group:multiSel.map(i=>{const t=inst(i);return {id:i,x:t.x,y:t.y,px:(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2,py:(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2};}),startX:e.clientX,startY:e.clientY,startCell:mapPoint(e.clientX,e.clientY),startPix:mapPixelPoint(e.clientX,e.clientY),moved:false};
        return;
      }
      selectedToken=id; multiSel=[];
      if(!canControlInstance(id)){

      }
      const c=inst(id);
      if(c.movementBlocked){toast('🚫 Ce personnage est immobilisé.');render();return;}
      if(effectiveMove(instTemplate(c))<=0&&characterTotalWeight(instTemplate(c))>0){toast('🚫 Trop lourd pour se déplacer !');render();return;}
      dragCandidate={id,startX:e.clientX,startY:e.clientY,origX:c.x,origY:c.y,moved:false};
      render(); return;
    }
    if(activeAbility){
      if(activeAbility==='__dissipation__'){toast('🎯 Clique sur un jeton à purger.');return;}
      const pt=mapPoint(e.clientX,e.clientY);

      if(a){
        if(a.type==='Buff'){
          if(a.area==='single')toast('🎯 Choisis une cible (clique sur un jeton).');

        }

  };

  window.onmousemove=e=>{
    if(tokenResizeState){
      const cell=S.map.cell;
      const delta=Math.round(((e.clientX-tokenResizeState.startX)+(e.clientY-tokenResizeState.startY))/2/(cell*mapZoom));
      const newSize=Math.max(1,tokenResizeState.startSize+delta);
      tokenResizeState.previewSize=newSize;
      const el=document.querySelector(`[data-token="${tokenResizeState.id}"] .token`);
      if(el){el.style.width=(newSize*cell)+'px';el.style.height=(newSize*cell)+'px';}
      return;
    }
    if(selBox){
      selBox.curX=e.clientX; selBox.curY=e.clientY;
      if(!selBox.moved&&Math.hypot(e.clientX-selBox.startX,e.clientY-selBox.startY)<4)return;
      selBox.moved=true;
      const w=document.getElementById('mapWrap'); if(!w)return;
      const wr=w.getBoundingClientRect();
      let el=document.getElementById('selRect');
      if(!el){el=document.createElement('div');el.id='selRect';el.className='sel-rect';w.appendChild(el);}
      el.style.left=(Math.min(selBox.startX,e.clientX)-wr.left)+'px';
      el.style.top=(Math.min(selBox.startY,e.clientY)-wr.top)+'px';
      el.style.width=Math.abs(e.clientX-selBox.startX)+'px';
      el.style.height=Math.abs(e.clientY-selBox.startY)+'px';
      return;
    }
    if(panState){
      mapPan.x=panState.origX+(e.clientX-panState.startX);
      mapPan.y=panState.origY+(e.clientY-panState.startY);
      applyMapTransform(); return;
    }
    if(dragCandidate){
      const dx=e.clientX-dragCandidate.startX, dy=e.clientY-dragCandidate.startY;
      if(!dragCandidate.moved&&Math.hypot(dx,dy)<4)return;
      dragCandidate.moved=true;
      if(dragCandidate.group){moveGroupTo(e.clientX,e.clientY);return;}
      const t=inst(dragCandidate.id);
      if(t){
        const el=document.querySelector(`[data-token="${dragCandidate.id}"]`);
        if(S.freeMovement){
          const [fx,fy]=mapPixelPoint(e.clientX,e.clientY);
          t.px=fx; t.py=fy;
          t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(fx/S.map.cell)));
          t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(fy/S.map.cell)));
          if(el){el.style.left=fx+'px';el.style.top=fy+'px';}
        }else{
          const pt=mapPoint(e.clientX,e.clientY);
          t.x=pt[0]; t.y=pt[1];
          if(el){el.style.left=(pt[0]*S.map.cell+S.map.cell/2)+'px';el.style.top=(pt[1]*S.map.cell+S.map.cell/2)+'px';}
        }
      }
      return;
    }
    if(activeAbility&&pendingPersistentOrigin){
      const p=pendingPersistentOrigin,px=mapPixelPoint(e.clientX,e.clientY);
      if(p.rotating&&p.frozen)p.angle=Math.atan2(px[1]-p.frozen[1],px[0]-p.frozen[0]); else p.mousePx=px;
      updateZonePreview(); return;
    }
    if(activeAbility){
      const rect=wrap.getBoundingClientRect();
      const x=Math.floor((e.clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom));
      const y=Math.floor((e.clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom));
      if(x>=0&&y>=0&&x<S.map.cols&&y<S.map.rows){hoverCell=[x,y];updateZonePreview();}
    }
  };

  window.onmouseup=ev=>{
    if(pendingPersistentOrigin&&pendingPersistentOrigin.rotating){const p=pendingPersistentOrigin;p.rotating=false;p.frozen=null;if(ev&&ev.clientX!=null)p.mousePx=mapPixelPoint(ev.clientX,ev.clientY);}
    if(tokenResizeState){
      const {id,previewSize,origSizeW}=tokenResizeState;
      const t=inst(id);
      if(t&&previewSize&&previewSize!==origSizeW){
        if(footprintOverlap(id,t.x,t.y,previewSize,previewSize)){
          toast('🚫 Redimensionnement annulé — chevauche un autre token ou dépasse la carte.');
        }else{
          t.sizeW=previewSize; t.sizeH=previewSize;
          addLog(`↔ ${esc(t.label)} redimensionné (${previewSize}×${previewSize} cases).`);
          saveState();
        }
      }
      tokenResizeState=null;
      render();
      return;
    }
    if(selBox)finishSelBox();
    if(dragCandidate&&dragCandidate.group)finishGroupDrag();
    if(panState){panState=null;wrap.classList.remove('panning');}
    if(dragCandidate){
      const {id,moved,origX,origY}=dragCandidate;
      const t=inst(id);
      let zonesDone=false;
      if(moved&&t){
        if(S.freeMovement){
          addLog(`↦ ${esc(t.label)} déplacé librement sur la carte.`);
        }else{
          const sw=t.sizeW||1, sh=t.sizeH||1;
          if(footprintOverlap(id,t.x,t.y,sw,sh)){
            t.x=origX; t.y=origY;
            toast('🚫 Case(s) déjà occupée(s) — choisis un autre déplacement.');
          }else if(S.combat.active&&S.combat.order[S.combat.turn]===id){
            const tpl=instTemplate(t);
            const destX=t.x, destY=t.y;
            const dist=Math.max(Math.abs(destX-origX),Math.abs(destY-origY)); // diagonale = 1 case
            const remaining=t.remainingMove??effectiveMove(tpl);
            t.x=origX; t.y=origY;
            if(dist>remaining){
              toast('🚫 Déplacement maximal atteint pour ce tour.');
            }else{
              t.remainingMove=remaining;
              walkCombatPath(t,destX,destY);
              if(inst(id))addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
            }
            zonesDone=true;
          }else if(!S.combat.active){
            addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
          }
        }
        if(!zonesDone&&(S.freeMovement||t.x!==origX||t.y!==origY))applyZoneDamageOnMove(t);
        saveState();
      }
      dragCandidate=null; render();
    }
  };

  wrap.onwheel=e=>{
    e.preventDefault();
    const old=mapZoom;
    mapZoom=Math.max(.4,Math.min(3,mapZoom+(e.deltaY<0?.1:-.1)));
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    mapPan.x=mx-(mx-mapPan.x)*(mapZoom/old);
    mapPan.y=my-(my-mapPan.y)*(mapZoom/old);
    applyMapTransform();
  };

  applyMapTransform();
}

/* ============================= REDIMENSIONNEMENT DES TOKENS (MJ uniquement) ============================= */
function startTokenResize(ev,id){
  if(!isMJ())return;
  ev.preventDefault(); ev.stopPropagation();
  const t=inst(id); if(!t)return;
  const sw=t.sizeW||1, sh=t.sizeH||1;
  tokenResizeState={id,startX:ev.clientX,startY:ev.clientY,startSize:Math.max(sw,sh),origSizeW:sw,origSizeH:sh};
}


/* ============================= CAPACITÉS : RÉSOLUTION ============================= */
function affected(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  const casterTpl=casterInst?instTemplate(casterInst):null;
  const casterType=casterTpl?.type||'player';
  const isSupport=(a.type==='Soin'||a.type==='Bouclier');

  if(a.area==='self'){
    const inZone=t=>tokenInAura(casterInst,t,{area:'square',areaSize:a.areaSize||1});
    if(isSupport)return S.instances.filter(inZone);
    return S.instances.filter(t=>t.id!==casterInst.id&&inZone(t));
  }

  if(a.area==='single'){
    const targetType=isSupport?casterType:(casterType==='enemy'?'player':'enemy');
    if(explicitTargetInstId){
      const t=inst(explicitTargetInstId);
      if(!t)return [];
      // Les sorts de soutien peuvent cibler le lanceur lui-même ; les sorts offensifs non.
      if(!isSupport&&t.id===selectedToken)return [];
      return ((!isSupport&&S.friendlyFire)||instTemplate(t)?.type===targetType)?[t]:[];
    }
    const pool=S.instances.filter(i=>(isSupport||i.id!==selectedToken)&&instTemplate(i)?.type===targetType);
    let best=null,bestd=999;
    for(const t of pool){const d=Math.abs(t.x-start[0])+Math.abs(t.y-start[1]);if(d<bestd){best=t;bestd=d;}}
    return best?[best]:[];
  }

  if(a.area==='line'||a.area==='cone'){
    const axis=zoneAxis(a,start); if(!axis)return [];
    const c=S.map.cell;
    return S.instances.filter(t=>{
      if(t.id===selectedToken)return false;
      if(!instTemplate(t))return false;
      const sw=t.sizeW||1, sh=t.sizeH||1;
      return footprintHitsLineCone(t.x,t.y,sw,sh,axis,a.area,c,a.coneStart,a.coneEnd);
    });
  }

  // Zone (carré / cercle)
  const size=a.areaSize||3;
  const inZone=t=>t.x<start[0]+size&&t.x+(t.sizeW||1)>start[0]&&t.y<start[1]+size&&t.y+(t.sizeH||1)>start[1];
  if(isSupport){
    // Soin / Bouclier / Potion en zone : uniquement les alliés, lanceur inclus.
    return S.instances.filter(t=>instTemplate(t)?.type===casterType&&inZone(t));
  }
  // Sorts de dégâts en zone : touchent tout le monde, alliés comme ennemis (y compris le lanceur).
  return S.instances.filter(inZone);
}
function footprintDistance(x1,y1,w1,h1,x2,y2,w2,h2){
  const gapX=Math.max(0, x2-(x1+w1-1), x1-(x2+w2-1));
  const gapY=Math.max(0, y2-(y1+h1-1), y1-(y2+h2-1));
  return Math.max(gapX,gapY);
}
/* ============================= ATTAQUE D'OPPORTUNITÉ ============================= */
function isAdjacentFootprint(a,b){
  return footprintDistance(a.x,a.y,a.sizeW||1,a.sizeH||1,b.x,b.y,b.sizeW||1,b.sizeH||1)<=1;
}
function checkOpportunityAttacks(moverId,oldBox){
  if(!S.combat.active)return;
  const mover=inst(moverId); if(!mover)return;
  const moverTpl=instTemplate(mover); if(!moverTpl)return;
  S.instances.forEach(ot=>{
    if(ot.id===moverId)return;
    if(ot.isKO)return;
    const otTpl=instTemplate(ot); if(!otTpl)return;
    if(otTpl.type===moverTpl.type)return; // uniquement les camps opposés
    const oa=otTpl.oppAttack; if(!oa||!oa.formula)return;
    const wasAdj=isAdjacentFootprint(oldBox,ot);
    const nowAdj=isAdjacentFootprint(mover,ot);
    if(wasAdj&&!nowAdj)resolveOpportunityAttack(ot,mover);
  });
}
function playOppImpactAt(targetId,image,frames,rows,fps,auto){
  if(!image)return;
  const t=inst(targetId); if(!t)return;
  ensureFxCanvas();
  const cell=S.map.cell;
  const [cx,cy]=instCenterPx(t);
  const size=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
  fxAddImpact(getFxImg(image,auto),Math.max(1,frames||1),Math.max(1,rows||1),cx,cy,size,size,Math.max(1,fps||60));
}
function resolveOpportunityAttack(attackerInst,targetInst){
  const attackerTpl=instTemplate(attackerInst), targetTpl=instTemplate(targetInst);
  if(!attackerTpl||!targetTpl)return;
  const oa=attackerTpl.oppAttack; if(!oa||!oa.formula)return;
  const isPhys=oa.type!=='Magique';
  const statKey=isPhys?'Force':'Magie';
  let weaponFormula=null, weaponUsed=null;
  if(attackerTpl.type==='player'&&attackerTpl.equipmentSlots){
    const w=equip(attackerTpl.equipmentSlots['arme']);
    if(w&&w.itemType==='weapon'&&(w.damageFormula||weaponHasElem(w))&&(w.weaponStat||'Force')===statKey){weaponUsed=w;weaponFormula=w.damageFormula;}
  }
  const atkRoll=roll('1d100'); const atk=atkRoll.total; const [label,mult]=outcome(atk);
  broadcastDiceRoll(100,[atk]);
  broadcastCritical(attackerInst.id,label);
  degradeWeaponOnOutcome(attackerInst,label);
  const lines=[`⚡ <b>${esc(attackerInst.label)}</b> effectue une <b>attaque d'opportunité</b> sur <b>${esc(targetInst.label)}</b> !`];
  lines.push(`🎲 d100 : <b>${atk}</b> → ${label}`);
  if(mult===0){
    lines.push(`${esc(targetInst.label)} n'est pas touché·e.`);
    addLog(lines.join('<br>'));
    return;
  }
  const rw=rollWithWeapon(oa.formula,weaponUsed,attackerInst);
  let damage=Math.ceil(rw.abTotal*mult*(attackerTpl.stats[statKey]||0)/100);
  const wpPart=weaponPhysDamage(rw.wpTotal,mult,attackerTpl.stats[statKey]||0,'',lines);
  const oe=rollWeaponElems(weaponUsed,attackerInst); oe.log.forEach(l=>lines.push(l));
  const ep=elemBonusDamage(oe.list,mult,attackerTpl.stats[statKey]||0,'',targetTpl,targetInst,lines);
  const fin=finalizeDamage([{raw:damage,el:oa.element||'Neutre',pool:isPhys?'CA':'DM'},{raw:wpPart,el:'Physique',pool:'CA'},...ep],targetTpl,targetInst);
  damage=fin.total; fin.detail.forEach(l=>lines.push(l));
  const absorbed=Math.min(targetInst.shield||0,damage); targetInst.shield-=absorbed; const hpDamage=damage-absorbed;
  targetInst.hp=Math.max(0,targetInst.hp-hpDamage);
  lines.push(rw.logLine);
  lines.push(`✨ Dégâts (${esc(isPhys?'Physique':'Magique')} / ${esc(oa.element||'Neutre')}) : ${damage}${fin.txt}`);
  if(absorbed>0)lines.push(`🛡 Bouclier : ${absorbed} absorbé(s)`);
  lines.push(`❤️ ${esc(targetInst.label)} : -${hpDamage} PV (${targetInst.hp}/${targetInst.hpMax})`);
  broadcastHud(targetInst.id,{hp:-hpDamage,shield:absorbed>0?-absorbed:0});
  applyMonsterDurabilityHit(attackerTpl,targetInst,targetTpl,label,lines);
  if(oa.impactImage){
    playOppImpactAt(targetInst.id,oa.impactImage,oa.impactFrames,oa.impactRows,oa.animFps,oa.spriteAuto);
    gameChannel?.send({type:'broadcast',event:'oppfx',payload:{targetId:targetInst.id,image:oa.impactImage,frames:oa.impactFrames,rows:oa.impactRows,fps:oa.animFps,auto:oa.spriteAuto}});
  }
  if(targetInst.hp<=0){lines.push(`💀 <b>${esc(targetInst.label)} est KO</b>.`);handleInstanceDeath(targetInst,attackerInst);}
  addLog(lines.join('<br>'));
}
function resolveAbility(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  if(!casterInst){toast('Sélectionne d’abord un personnage.');return;}
  if(!canControlInstance(casterInst.id)){
    toast('⛔ Vous ne contrôlez pas ce personnage.');
    activeAbility=null; hoverCell=null; render(); return;
  }
  if(a.manaCost>0&&(casterInst.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${casterInst.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    return;
  }
  if(a.area==='square'||a.area==='circle')start=clampZone(a,clampToRange(casterInst,start,a.range));
  if(a.area==='single'){
    const isSup=(a.type==='Soin'||a.type==='Bouclier');
    if(!explicitTargetInstId||!affected(a,start,explicitTargetInstId).length){
      toast(isSup?"🚫 Il n'y a aucun allié là où vous visez actuellement.":"🚫 Il n'y a aucun ennemi là où vous visez actuellement.");
      return;
    }
  }
  if(a.range&&a.range>0){
    const casterSW=casterInst.sizeW||1, casterSH=casterInst.sizeH||1;
    const targetInst=explicitTargetInstId?inst(explicitTargetInstId):null;
    const tW=targetInst?(targetInst.sizeW||1):1, tH=targetInst?(targetInst.sizeH||1):1;
    const dist=footprintDistance(casterInst.x,casterInst.y,casterSW,casterSH,start[0],start[1],tW,tH);
    if(dist>a.range){
      toast(`🚫 Trop loin (portée max ${a.range} case${a.range>1?'s':''}) — sélectionne un ennemi plus proche.`);
      return;
    }
  }
  const casterTpl=instTemplate(casterInst);
  if(a.manaCost>0){
    casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
  }
  let weaponFormula=null, weaponUsed=null;
  if(casterTpl?.type==='player'&&casterTpl.equipmentSlots){
    const w=equip(casterTpl.equipmentSlots['arme']);
    if(w&&w.itemType==='weapon'&&(w.damageFormula||weaponHasElem(w))&&(w.weaponStat||'Force')===a.stat){weaponUsed=w;weaponFormula=w.damageFormula;}
  }
  const atkExpr=a.atkDice||'1d100'; const atkRoll=roll(atkExpr); const atk=atkRoll.total; const [label,mult]=outcome(atk);
  broadcastDiceRoll(formulaSides(atkExpr),atkRoll.rolls);
  broadcastCritical(casterInst.id,label);
  degradeWeaponOnOutcome(casterInst,label);
