/* ============================= CHAT : COMMANDE /r ============================= */
function parseDiceExpr(raw){
  const expr=String(raw||'').replace(/\s+/g,'').toLowerCase();
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(expr))return null;
  const terms=[...expr.matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/g)];
  let totalDice=0;
  for(const t of terms){
    if(t[3]){const n=+(t[2]||1),s=+t[3];if(n<1||s<1||s>1000)return null;totalDice+=n;}
  }
  if(totalDice>50)return null;
  const parts=[]; let total=0;
  for(const t of terms){
    const sign=t[1]==='-'?-1:1;
    if(t[3]){
      const n=+(t[2]||1),sides=+t[3];
      const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));
      const sum=rolls.reduce((a,x)=>a+x,0);
      total+=sign*sum;
      parts.push({label:`${sign<0?'−':''}${n}d${sides}`,rolls,sum:sign*sum,sides});
    }else{
      const v=sign*(+t[4]); total+=v; parts.push({label:null,rolls:null,sum:v});
    }
  }
  return {expr,parts,total};
}
function sendChat(){
  if(!currentUser)return;
  const text=(document.getElementById('chat_input')?.value||chatDraft||'').trim();
  if(!text)return;
  const name=esc(myDisplayName());
  const m=text.match(/^\/r(?:\s+(.*))?$/i);
  if(m){
    const r=parseDiceExpr(m[1]);
    if(!r){toast('⚠️ Syntaxe : /r d100, /r 2d20+5 (max 50 dés, d1000).');return;}
    r.parts.forEach(p=>{if(p.rolls&&p.rolls.length)playDiceRoll(p.sides,p.rolls);});
    const lines=r.parts.map(p=>p.rolls
      ?`🎲 ${p.label} : ${p.rolls.join(' + ')}${p.rolls.length>1?` = ${Math.abs(p.sum)}`:''}`
      :`➕ Bonus : ${p.sum>0?'+':''}${p.sum}`);
    addLog(`🎲 <b>${name}</b> — /r ${esc(r.expr)}<br>${lines.join('<br>')}<br>🎯 Total : <b>${r.total}</b>`);
  }else if(text.startsWith('/')){
    toast('⚠️ Commande inconnue. Utilise /r [expression].');return;
  }else{
    addLog(`💬 <b>${name}</b> : ${esc(text)}`);
  }
  chatDraft='';
  persistState(); render();
  document.getElementById('chat_input')?.focus();
}

/* ============================= MULTISÉLECTION (MJ, hors combat) ============================= */
function moveGroupTo(cx,cy){
  const d=dragCandidate,g=d.group,cell=S.map.cell;
  const setEl=(id,x,y)=>{const el=document.querySelector(`[data-token="${id}"]`);if(el){el.style.left=x+'px';el.style.top=y+'px';}};
  if(S.freeMovement){
    const [fx,fy]=mapPixelPoint(cx,cy);
    const W=S.map.cols*cell,H=S.map.rows*cell;
    const dx=Math.max(-Math.min(...g.map(o=>o.px)),Math.min(W-Math.max(...g.map(o=>o.px)),fx-d.startPix[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.py)),Math.min(H-Math.max(...g.map(o=>o.py)),fy-d.startPix[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.px=o.px+dx; t.py=o.py+dy;
      t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(t.px/cell)));
      t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(t.py/cell)));
      setEl(o.id,t.px,t.py);
    });
  }else{
    const pt=mapPoint(cx,cy);
    const dx=Math.max(-Math.min(...g.map(o=>o.x)),Math.min(S.map.cols-1-Math.max(...g.map(o=>o.x)),pt[0]-d.startCell[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.y)),Math.min(S.map.rows-1-Math.max(...g.map(o=>o.y)),pt[1]-d.startCell[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.x=o.x+dx; t.y=o.y+dy;
      setEl(o.id,t.x*cell+cell/2,t.y*cell+cell/2);
    });
  }
}
function finishGroupDrag(){
  const d=dragCandidate; dragCandidate=null;
  const g=d.group;
  if(!d.moved){selectedToken=d.id;multiSel=[];render();return;}
  let changed=true;
  if(!S.freeMovement){
    const ids=g.map(o=>o.id);
    const blocker=S.instances.find(i=>!ids.includes(i.id)&&g.some(o=>{const t=inst(o.id);return t&&t.x===i.x&&t.y===i.y;}));
    if(blocker){
      g.forEach(o=>{const t=inst(o.id);if(t){t.x=o.x;t.y=o.y;}});
      toast(`🚫 ${blocker.label} bloque le déplacement du groupe — annulé.`);
      changed=false;
    }
  }
  if(changed){addLog(`↦ Le MJ déplace ${g.length} tokens.`);saveState();}
  render();
}
function finishSelBox(){
  const b=selBox; selBox=null;
  document.getElementById('selRect')?.remove();
  if(!b.moved){
    if(selectedToken||multiSel.length){selectedToken=null;multiSel=[];render();}
    return;
  }
  const wrap=document.getElementById('mapWrap'); if(!wrap)return;
  const r=wrap.getBoundingClientRect(),cell=S.map.cell;
  const toPix=(cx,cy)=>[(cx-r.left-mapPan.x)/mapZoom,(cy-r.top-mapPan.y)/mapZoom];
  const [ax,ay]=toPix(b.startX,b.startY),[bx,by]=toPix(b.curX,b.curY);
  const x1=Math.min(ax,bx),x2=Math.max(ax,bx),y1=Math.min(ay,by),y2=Math.max(ay,by);
  const ids=S.instances.filter(t=>{
    const cx=(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2;
    const cy=(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2;
    return cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2;
  }).map(t=>t.id);
  if(ids.length===1){selectedToken=ids[0];multiSel=[];}
  else{selectedToken=null;multiSel=ids;}
  render();
}

/* ============================= COMBAT (MJ uniquement) ============================= */
function startCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut démarrer le combat.');return;}
  const ids=S.instances.map(i=>i.id);
  if(!ids.length){toast('Aucun token sur la carte.');return;}
  if(S.freeMovement){
    S.freeMovement=false;
    snapAllTokensToGrid();
    addLog('🎯 Placement libre désactivé automatiquement pour le début du combat — les tokens reviennent au centre des cases.');
  }
  const init={};
  ids.forEach(id=>{const tpl=instTemplate(inst(id));init[id]=roll('1d20').total+(tpl?.stats?.Vitesse||0);});
  const groups={}; ids.forEach(id=>(groups[init[id]]??=[]).push(id));
  Object.values(groups).forEach(group=>{
    if(group.length>1){
      const rolled=group.map(id=>({id,r:roll('1d100').total})).sort((a,b)=>b.r-a.r);
      rolled.forEach((x,i)=>{init[x.id]+=(rolled.length-i)/1000;});
    }
  });
  const order=[...ids].sort((a,b)=>init[b]-init[a]);
  S.combat={active:true,order,turn:-1,initiatives:Object.fromEntries(order.map(id=>[id,Math.floor(init[id])]))};
  addLog('⚔ <b>Combat démarré</b> — initiative : '+order.map(id=>`${esc(inst(id).label)} (${S.combat.initiatives[id]})`).join(', ')+'.');
  advanceTurn();
  saveState(); render();
}
function endCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut terminer le combat.');return;}
  S.combat={active:false,order:[],turn:0,initiatives:{}};
  lastTurnCombatant=null;
  addLog('⏹ Fin du combat.');
  saveState(); render();
}
/* ---- Effets automatiques de début de tour : auras (Passif), buffs/débuffs, afflictions ---- */
function tokenInAura(caster,target,a){
  const size=a.areaSize||1;
  const csw=caster.sizeW||1, csh=caster.sizeH||1, tsw=target.sizeW||1, tsh=target.sizeH||1;
  const gapX=Math.max(0, target.x-(caster.x+csw-1), caster.x-(target.x+tsw-1));
  const gapY=Math.max(0, target.y-(caster.y+csh-1), caster.y-(target.y+tsh-1));
  if(a.area==='circle')return Math.sqrt(gapX*gapX+gapY*gapY)<=size;
  return gapX<=size&&gapY<=size;
}
function triggerAuras(casterInst){
  const casterTpl=instTemplate(casterInst); if(!casterTpl)return;
  (casterInst.activeAuras||[]).slice().forEach(abilityId=>{
    const a=S.abilities.find(x=>x.id===abilityId);
    if(!a){casterInst.activeAuras=(casterInst.activeAuras||[]).filter(id=>id!==abilityId);return;}
    if(a.manaCost>0&&(casterInst.mana||0)<a.manaCost){
      casterInst.activeAuras=(casterInst.activeAuras||[]).filter(id=>id!==abilityId);
      addLog(`🌀 L'aura <b>${esc(a.name)}</b> de <b>${esc(casterInst.label)}</b> se désactive (mana insuffisant).`);
      return;
    }
    if(a.manaCost>0)casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
    const targets=S.instances.filter(t=>tokenInAura(casterInst,t,a));
    if(!targets.length)return;
    const r=roll(a.formula);
    const lines=[`🌀 <b>${esc(casterInst.label)}</b> — aura <b>${esc(a.name)}</b> : ${esc(a.formula)} = ${r.total}`];
    targets.forEach(t=>{
      const tTpl=instTemplate(t);
      const amount=applyMult(Math.ceil(r.total*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
      if(a.auraEffect==='heal'){
        t.hp=Math.min(t.hpMax,t.hp+amount);
        lines.push(`💚 ${esc(t.label)} : +${amount} PV`);
        broadcastHud(t.id,{hp:amount});
      }else if(a.auraEffect==='shield'){
        t.shield=(t.shield||0)+amount; if(t.shield>t.shieldMax)t.shieldMax=t.shield;
        lines.push(`🛡 ${esc(t.label)} : +${amount} bouclier`);
        broadcastHud(t.id,{shield:amount});
      }else{
        let dmg=amount;
        const def=effectiveDef(tTpl)[a.defense]||0; dmg=Math.max(0,dmg-def);
        const resist=(effectiveRes(tTpl)[a.element]||0)/100; dmg=Math.max(0,Math.ceil(dmg*(1-resist)));
        const absorbed=Math.min(t.shield||0,dmg); t.shield-=absorbed; const hpDmg=dmg-absorbed;
        t.hp=Math.max(0,t.hp-hpDmg);
        lines.push(`✨ ${esc(t.label)} : -${hpDmg} PV`);
        broadcastHud(t.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
        if(t.hp<=0){lines.push(`💀 <b>${esc(t.label)} est KO</b>.`);handleInstanceDeath(t);}
      }
    });
    addLog(lines.join('<br>'));
  });
}
function tickStatusEffects(inst_){
  if(!inst_.statusEffects||!inst_.statusEffects.length)return;
  const tTpl=instTemplate(inst_);
  const remaining=[];
  inst_.statusEffects.forEach(se=>{
    const r=roll(se.formula);
    const raw=applyMult(Math.max(0,Math.ceil(r.total*(se.mult||1)*(se.statValue||0)/100)),se.dmgMult);
    if(se.element==='Soin'){
      inst_.hp=Math.min(inst_.hpMax,inst_.hp+raw);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} PV`);
      broadcastHud(inst_.id,{hp:raw});
    }else if(se.element==='Bouclier'){
      inst_.shield=(inst_.shield||0)+raw; if(inst_.shield>inst_.shieldMax)inst_.shieldMax=inst_.shield;
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} bouclier`);
      broadcastHud(inst_.id,{shield:raw});
    }else if(se.element==='Récupération'){
      inst_.mana=Math.min(inst_.manaMax,inst_.mana+raw);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : +${raw} mana`);
      broadcastHud(inst_.id,{mana:raw});
    }else{
      let dmg=raw;
      const def=se.defense!=='none'?(effectiveDef(tTpl)[se.defense]||0):0;
      dmg=Math.max(0,dmg-def);
      if(se.element!=='Physique'&&se.element!=='Neutre'){
        const resist=(effectiveRes(tTpl)[se.element]||0)/100;
        dmg=Math.max(0,Math.ceil(dmg*(1-resist)));
      }
      const absorbed=Math.min(inst_.shield||0,dmg); inst_.shield-=absorbed; const hpDmg=dmg-absorbed;
      inst_.hp=Math.max(0,inst_.hp-hpDmg);
      addLog(`🌀 <b>${esc(inst_.label)}</b> — ${esc(se.name)} : -${hpDmg} PV`);
      broadcastHud(inst_.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
      if(inst_.hp<=0){addLog(`💀 <b>${esc(inst_.label)} est KO</b>.`);handleInstanceDeath(inst_);}
    }
    se.turnsLeft--;
    if(se.turnsLeft>0)remaining.push(se);
    else addLog(`🌀 <b>${esc(se.name)}</b> se termine sur <b>${esc(inst_.label)}</b>.`);
  });
  inst_.statusEffects=remaining;
}
function tickAfflictions(inst_){
  if(!inst_.afflictions||!inst_.afflictions.length)return {skip:false,blockMove:false};
  let skip=false, blockMove=false;
  inst_.afflictions.forEach(af=>{
    const def=(S.afflictionDefs||[]).find(d=>d.id===af.defId); if(!def)return;
    af.turns=(af.turns||0)+1;
    const pct=(def.dmgBase||0)+(def.dmgGrowth||0)*(af.turns-1);
    if(pct>0){
      const dmg=Math.ceil((inst_.hpMax||0)*pct/100);
      const absorbed=Math.min(inst_.shield||0,dmg); inst_.shield-=absorbed; const hpDmg=dmg-absorbed;
      inst_.hp=Math.max(0,inst_.hp-hpDmg);
      addLog(`🩸 <b>${esc(inst_.label)}</b> subit <b>${esc(def.name)}</b> : -${hpDmg} PV (${pct}%)`);
      broadcastHud(inst_.id,{hp:-hpDmg,shield:absorbed>0?-absorbed:0});
      if(inst_.hp<=0){addLog(`💀 <b>${esc(inst_.label)} est KO</b>.`);handleInstanceDeath(inst_);}
    }
    if(def.skipTurn)skip=true;
    if(def.preventMove)blockMove=true;
  });
  return {skip,blockMove};
}
function advanceTurn(){
  if(!S.combat.active||!S.combat.order.length)return;
  let safety=0;
  while(true){
    S.combat.turn=(S.combat.turn+1)%S.combat.order.length;
    if(S.combat.turn===0)decayPersistentZones(); // tout le monde a joué : un tour complet s'écoule
    const nt=inst(S.combat.order[S.combat.turn]);
    if(nt){
      const tpl=instTemplate(nt);
      nt.remainingMove=tpl?.move??6;
      nt.movementBlocked=false;
      triggerAuras(nt);
      tickStatusEffects(nt);
      tickPersistentZones(nt);
      const res=tickAfflictions(nt);
      nt.movementBlocked=res.blockMove;
      if(res.skip){
        addLog(`⏭ <b>${esc(nt.label)}</b> passe son tour (affliction).`);
        safety++;
        if(safety>S.combat.order.length+2)break;
        continue;
      }
    }
    break;
  }
  lastTurnCombatant=S.combat.order[S.combat.turn];
  if(canControlInstance(lastTurnCombatant))selectedToken=lastTurnCombatant;
}
function nextTurn(){
  if(!isMJ()){toast('⛔ Seul le MJ peut avancer le tour.');return;}
  advanceTurn();saveState();render();
}

/* ============================= CARTE : SÉLECTION / DRAG / PAN / ZOOM ============================= */
function mapPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const x=(clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom);
  const y=(clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom);
  return [Math.max(0,Math.min(S.map.cols-1,Math.floor(x))),Math.max(0,Math.min(S.map.rows-1,Math.floor(y)))];
}
function mapPixelPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const fx=(clientX-rect.left-mapPan.x)/mapZoom;
  const fy=(clientY-rect.top-mapPan.y)/mapZoom;
  return [Math.max(0,Math.min(S.map.cols*S.map.cell,fx)),Math.max(0,Math.min(S.map.rows*S.map.cell,fy))];
}
function applyMapTransform(){const map=document.getElementById('map');if(map)map.style.transform=`translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom})`;}

function setupMapInteractions(){
  const wrap=document.getElementById('mapWrap'); const map=document.getElementById('map');
  if(!wrap||!map)return;
  ensureFxCanvas();
  const hint=document.getElementById('mapDropHint');

  wrap.ondragover=e=>{e.preventDefault();hint?.classList.add('show');};
  wrap.ondragleave=()=>hint?.classList.remove('show');
  wrap.ondrop=e=>{
    e.preventDefault(); hint?.classList.remove('show');
    if(!isMJ()){toast('⛔ Seul le MJ peut modifier la carte ou ajouter des tokens.');return;}

    // Cas 1 : image glissée directement depuis l'ordinateur
    if(e.dataTransfer.files && e.dataTransfer.files.length>0){
      const file=e.dataTransfer.files[0];
      if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){
        toast('⚠️ Format non supporté — utilise une image PNG, JPG ou WebP.');
        return;
      }
      handleMapImageFile(file);
      return;
    }

    const data=e.dataTransfer.getData('text/plain');

    // Cas 2 : carte déjà envoyée, réutilisée depuis l'onglet 🗺️ Cartes
    if(data && data.startsWith('map:')){
      handleMapImageUrl(data.slice(4));
      return;
    }

    // Cas 3 : personnage / monstre glissé depuis la bibliothèque
    const charId=data; const tpl=char(charId); if(!tpl)return;
    const pt=mapPoint(e.clientX,e.clientY);
    const free=findFreeCell(pt[0],pt[1]);
    if(!free){toast('🚫 Plus aucune case libre sur la carte.');return;}
    const created=spawnInstance(charId,free[0],free[1]);
    if(created){
      selectedToken=created.id;
      addLog(`➕ ${esc(created.label)} apparaît sur la carte.`);
      if(free[0]!==pt[0]||free[1]!==pt[1])toast(`⚠️ Case occupée — ${created.label} placé sur la case libre la plus proche.`);
    }
    saveState(); render();
  };
  wrap.oncontextmenu=e=>e.preventDefault();

  wrap.onmousedown=e=>{
    if(e.button===2){
      panState={startX:e.clientX,startY:e.clientY,origX:mapPan.x,origY:mapPan.y};
      wrap.classList.add('panning'); e.preventDefault(); return;
    }
    if(e.button!==0)return;
    const tw=e.target.closest('.token-wrap');
    if(tw){
      e.stopPropagation();
      const id=tw.dataset.token;
      if(activeAbility){
        if(activeAbility==='__dissipation__'){applyDissipation(id);return;}
        const a=S.abilities.find(x=>x.id===activeAbility); const t=inst(id);
        if(a&&t){
          if(a.type==='Buff'){
            if(a.area==='single')resolveBuffAbility(a,inst(selectedToken),id);
            else resolveBuffZone(a,inst(selectedToken),[t.x,t.y]);
          }
          else if(a.type==='Persistant'&&(a.area==='line'||a.area==='cone'))handlePersistentLineConeClick(a,inst(selectedToken),[t.x,t.y]);
          else if(a.type==='Persistant')resolvePersistentAbility(a,inst(selectedToken),[t.x,t.y]);
          else resolveAbility(a,[t.x,t.y],id);
        }
        return;
      }
      if(isMJ()&&!S.combat.active&&multiSel.length>1&&multiSel.includes(id)){
        const cell=S.map.cell;
        dragCandidate={id,group:multiSel.map(i=>{const t=inst(i);return {id:i,x:t.x,y:t.y,px:(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2,py:(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2};}),startX:e.clientX,startY:e.clientY,startCell:mapPoint(e.clientX,e.clientY),startPix:mapPixelPoint(e.clientX,e.clientY),moved:false};
        return;
      }
      selectedToken=id; multiSel=[];
      if(!canControlInstance(id)){
        render(); return; // vue seule : ce token ne t'appartient pas
      }
      if(S.combat.active&&S.combat.order[S.combat.turn]!==id){
        toast('⏳ Ce n’est pas le tour de ce personnage.'); render(); return;
      }
      const c=inst(id);
      if(c.movementBlocked){toast('🚫 Ce personnage est immobilisé.');render();return;}
      dragCandidate={id,startX:e.clientX,startY:e.clientY,origX:c.x,origY:c.y,moved:false};
      render(); return;
    }
    if(activeAbility){
      if(activeAbility==='__dissipation__'){toast('🎯 Clique sur un jeton à purger.');return;}
      const pt=mapPoint(e.clientX,e.clientY);
      const a=S.abilities.find(x=>x.id===activeAbility);
      if(a){
        if(a.type==='Buff'){
          if(a.area==='single')toast('🎯 Choisis une cible (clique sur un jeton).');
          else resolveBuffZone(a,inst(selectedToken),pt);
        }
        else if(a.type==='Persistant'&&(a.area==='line'||a.area==='cone'))handlePersistentLineConeClick(a,inst(selectedToken),pt);
        else if(a.type==='Persistant')resolvePersistentAbility(a,inst(selectedToken),pt);
        else resolveAbility(a,pt);
      }
      return;
    }
    if(isMJ()&&!S.combat.active){
      selBox={startX:e.clientX,startY:e.clientY,curX:e.clientX,curY:e.clientY,moved:false};
      return;
    }
    if(selectedToken||multiSel.length){selectedToken=null;multiSel=[];render();}
  };

  window.onmousemove=e=>{
    if(tokenResizeState){
      const cell=S.map.cell;
      const delta=Math.round(((e.clientX-tokenResizeState.startX)+(e.clientY-tokenResizeState.startY))/2/(cell*mapZoom));
      const newSize=Math.max(1,tokenResizeState.startSize+delta);
      tokenResizeState.previewSize=newSize;
      const el=document.querySelector(`[data-token="${tokenResizeState.id}"] .token`);
      if(el){el.style.width=(newSize*cell)+'px';el.style.height=(newSize*cell)+'px';}
      return;
    }
    if(selBox){
      selBox.curX=e.clientX; selBox.curY=e.clientY;
      if(!selBox.moved&&Math.hypot(e.clientX-selBox.startX,e.clientY-selBox.startY)<4)return;
      selBox.moved=true;
      const w=document.getElementById('mapWrap'); if(!w)return;
      const wr=w.getBoundingClientRect();
      let el=document.getElementById('selRect');
      if(!el){el=document.createElement('div');el.id='selRect';el.className='sel-rect';w.appendChild(el);}
      el.style.left=(Math.min(selBox.startX,e.clientX)-wr.left)+'px';
      el.style.top=(Math.min(selBox.startY,e.clientY)-wr.top)+'px';
      el.style.width=Math.abs(e.clientX-selBox.startX)+'px';
      el.style.height=Math.abs(e.clientY-selBox.startY)+'px';
      return;
    }
    if(panState){
      mapPan.x=panState.origX+(e.clientX-panState.startX);
      mapPan.y=panState.origY+(e.clientY-panState.startY);
      applyMapTransform(); return;
    }
    if(dragCandidate){
      const dx=e.clientX-dragCandidate.startX, dy=e.clientY-dragCandidate.startY;
      if(!dragCandidate.moved&&Math.hypot(dx,dy)<4)return;
      dragCandidate.moved=true;
      if(dragCandidate.group){moveGroupTo(e.clientX,e.clientY);return;}
      const t=inst(dragCandidate.id);
      if(t){
        const el=document.querySelector(`[data-token="${dragCandidate.id}"]`);
        if(S.freeMovement){
          const [fx,fy]=mapPixelPoint(e.clientX,e.clientY);
          t.px=fx; t.py=fy;
          t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(fx/S.map.cell)));
          t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(fy/S.map.cell)));
          if(el){el.style.left=fx+'px';el.style.top=fy+'px';}
        }else{
          const pt=mapPoint(e.clientX,e.clientY);
          t.x=pt[0]; t.y=pt[1];
          if(el){el.style.left=(pt[0]*S.map.cell+S.map.cell/2)+'px';el.style.top=(pt[1]*S.map.cell+S.map.cell/2)+'px';}
        }
      }
      return;
    }
    if(activeAbility){
      const rect=wrap.getBoundingClientRect();
      const x=Math.floor((e.clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom));
      const y=Math.floor((e.clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom));
      if(x>=0&&y>=0&&x<S.map.cols&&y<S.map.rows){hoverCell=[x,y];updateZonePreview();}
    }
  };

  window.onmouseup=()=>{
    if(tokenResizeState){
      const {id,previewSize,origSizeW}=tokenResizeState;
      const t=inst(id);
      if(t&&previewSize&&previewSize!==origSizeW){
        if(footprintOverlap(id,t.x,t.y,previewSize,previewSize)){
          toast('🚫 Redimensionnement annulé — chevauche un autre token ou dépasse la carte.');
        }else{
          t.sizeW=previewSize; t.sizeH=previewSize;
          addLog(`↔ ${esc(t.label)} redimensionné (${previewSize}×${previewSize} cases).`);
          saveState();
        }
      }
      tokenResizeState=null;
      render();
      return;
    }
    if(selBox)finishSelBox();
    if(dragCandidate&&dragCandidate.group)finishGroupDrag();
    if(panState){panState=null;wrap.classList.remove('panning');}
    if(dragCandidate){
      const {id,moved,origX,origY}=dragCandidate;
      const t=inst(id);
      if(moved&&t){
        if(S.freeMovement){
          addLog(`↦ ${esc(t.label)} déplacé librement sur la carte.`);
        }else{
          const sw=t.sizeW||1, sh=t.sizeH||1;
          if(footprintOverlap(id,t.x,t.y,sw,sh)){
            t.x=origX; t.y=origY;
            toast('🚫 Case(s) déjà occupée(s) — choisis un autre déplacement.');
          }else if(S.combat.active&&S.combat.order[S.combat.turn]===id){
            const tpl=instTemplate(t);
            const dist=Math.abs(t.x-origX)+Math.abs(t.y-origY);
            const remaining=t.remainingMove??(tpl?.move??6);
            if(dist>remaining){
              t.x=origX; t.y=origY;
              toast('🚫 Déplacement maximal atteint pour ce tour.');
            }else{
              t.remainingMove=remaining-dist;
              addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
              checkOpportunityAttacks(id,{x:origX,y:origY,sizeW:sw,sizeH:sh});
            }
          }else if(!S.combat.active){
            addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
          }
        }
        saveState();
      }
      dragCandidate=null; render();
    }
  };

  wrap.onwheel=e=>{
    e.preventDefault();
    const old=mapZoom;
    mapZoom=Math.max(.4,Math.min(3,mapZoom+(e.deltaY<0?.1:-.1)));
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    mapPan.x=mx-(mx-mapPan.x)*(mapZoom/old);
    mapPan.y=my-(my-mapPan.y)*(mapZoom/old);
    applyMapTransform();
  };

  applyMapTransform();
}

/* ============================= REDIMENSIONNEMENT DES TOKENS (MJ uniquement) ============================= */
function startTokenResize(ev,id){
  if(!isMJ())return;
  ev.preventDefault(); ev.stopPropagation();
  const t=inst(id); if(!t)return;
  const sw=t.sizeW||1, sh=t.sizeH||1;
  tokenResizeState={id,startX:ev.clientX,startY:ev.clientY,startSize:Math.max(sw,sh),origSizeW:sw,origSizeH:sh};
}


/* ============================= CAPACITÉS : RÉSOLUTION ============================= */
function affected(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  const casterTpl=casterInst?instTemplate(casterInst):null;
  const casterType=casterTpl?.type||'player';
  const isSupport=(a.type==='Soin'||a.type==='Bouclier');

  if(a.area==='self'){
    const inZone=t=>tokenInAura(casterInst,t,{area:'square',areaSize:a.areaSize||1});
    if(isSupport)return S.instances.filter(inZone);
    return S.instances.filter(t=>t.id!==casterInst.id&&inZone(t));
  }

  if(a.area==='single'){
    const targetType=isSupport?casterType:(casterType==='enemy'?'player':'enemy');
    if(explicitTargetInstId){
      const t=inst(explicitTargetInstId);
      if(!t)return [];
      // Les sorts de soutien peuvent cibler le lanceur lui-même ; les sorts offensifs non.
      if(!isSupport&&t.id===selectedToken)return [];
      return instTemplate(t)?.type===targetType?[t]:[];
    }
    const pool=S.instances.filter(i=>(isSupport||i.id!==selectedToken)&&instTemplate(i)?.type===targetType);
    let best=null,bestd=999;
    for(const t of pool){const d=Math.abs(t.x-start[0])+Math.abs(t.y-start[1]);if(d<bestd){best=t;bestd=d;}}
    return best?[best]:[];
  }

  if(a.area==='line'||a.area==='cone'){
    const axis=zoneAxis(a,start); if(!axis)return [];
    const c=S.map.cell;
    return S.instances.filter(t=>{
      if(t.id===selectedToken)return false;
      if(!instTemplate(t))return false;
      const sw=t.sizeW||1, sh=t.sizeH||1;
      return footprintHitsLineCone(t.x,t.y,sw,sh,axis,a.area,c,a.coneStart,a.coneEnd);
    });
  }

  // Zone (carré / cercle)
  const size=a.areaSize||3;
  const inZone=t=>t.x>=start[0]&&t.x<start[0]+size&&t.y>=start[1]&&t.y<start[1]+size;
  if(isSupport){
    // Soin / Bouclier / Potion en zone : uniquement les alliés, lanceur inclus.
    return S.instances.filter(t=>instTemplate(t)?.type===casterType&&inZone(t));
  }
  // Sorts de dégâts en zone : touchent tout le monde, alliés comme ennemis (y compris le lanceur).
  return S.instances.filter(inZone);
}
function footprintDistance(x1,y1,w1,h1,x2,y2,w2,h2){
  const gapX=Math.max(0, x2-(x1+w1-1), x1-(x2+w2-1));
  const gapY=Math.max(0, y2-(y1+h1-1), y1-(y2+h2-1));
  return Math.max(gapX,gapY);
}
/* ============================= ATTAQUE D'OPPORTUNITÉ ============================= */
function isAdjacentFootprint(a,b){
  return footprintDistance(a.x,a.y,a.sizeW||1,a.sizeH||1,b.x,b.y,b.sizeW||1,b.sizeH||1)<=1;
}
function checkOpportunityAttacks(moverId,oldBox){
  if(!S.combat.active)return;
  const mover=inst(moverId); if(!mover)return;
  const moverTpl=instTemplate(mover); if(!moverTpl)return;
  S.instances.forEach(ot=>{
    if(ot.id===moverId)return;
    const otTpl=instTemplate(ot); if(!otTpl)return;
    if(otTpl.type===moverTpl.type)return; // uniquement les camps opposés
    const oa=otTpl.oppAttack; if(!oa||!oa.formula)return;
    const wasAdj=isAdjacentFootprint(oldBox,ot);
    const nowAdj=isAdjacentFootprint(mover,ot);
    if(wasAdj&&!nowAdj)resolveOpportunityAttack(ot,mover);
  });
}
function playOppImpactAt(targetId,image,frames,rows,fps){
  if(!image)return;
  const t=inst(targetId); if(!t)return;
  ensureFxCanvas();
  const cell=S.map.cell;
  const [cx,cy]=instCenterPx(t);
  const size=Math.max(cell*1.4,Math.max(t.sizeW||1,t.sizeH||1)*cell*1.4);
  fxAddImpact(getFxImg(image),Math.max(1,frames||1),Math.max(1,rows||1),cx,cy,size,size,Math.max(1,fps||60));
}
function resolveOpportunityAttack(attackerInst,targetInst){
  const attackerTpl=instTemplate(attackerInst), targetTpl=instTemplate(targetInst);
  if(!attackerTpl||!targetTpl)return;
  const oa=attackerTpl.oppAttack; if(!oa||!oa.formula)return;
  const isPhys=oa.type!=='Magique';
  const statKey=isPhys?'Force':'Magie';
  let weaponFormula=null, weaponUsed=null;
  if(attackerTpl.type==='player'&&attackerTpl.equipmentSlots){
    const w=equip(attackerTpl.equipmentSlots['arme']);
    if(w&&w.itemType==='weapon'&&w.damageFormula&&(w.weaponStat||'Force')===statKey){weaponUsed=w;weaponFormula=w.damageFormula;}
  }
  const usedFormula=weaponFormula?combineFormula(oa.formula,weaponFormula):oa.formula;
  const atkRoll=roll('1d100'); const atk=atkRoll.total; const [label,mult]=outcome(atk);
  playDiceRoll(100,[atk]);
  broadcastCritical(attackerInst.id,label);
  const lines=[`⚡ <b>${esc(attackerInst.label)}</b> effectue une <b>attaque d'opportunité</b> sur <b>${esc(targetInst.label)}</b> !`];
  lines.push(`🎲 d100 : <b>${atk}</b> → ${label}`);
  if(mult===0){
    lines.push(`${esc(targetInst.label)} n'est pas touché·e.`);
    addLog(lines.join('<br>'));
    return;
  }
  const r=roll(usedFormula);
  playDiceRoll(formulaSides(usedFormula),r.rolls);
  let damage=Math.ceil(r.total*mult);
  const def=isPhys?(effectiveDef(targetTpl).CA||0):(effectiveDef(targetTpl).DM||0);
  damage=Math.max(0,damage-def);
  if(oa.element&&oa.element!=='Neutre'){
    const resist=(effectiveRes(targetTpl)[oa.element]||0)/100;
    damage=Math.max(0,Math.ceil(damage*(1-resist)));
  }
  const absorbed=Math.min(targetInst.shield||0,damage); targetInst.shield-=absorbed; const hpDamage=damage-absorbed;
  targetInst.hp=Math.max(0,targetInst.hp-hpDamage);
  lines.push(`🎲 ${esc(usedFormula)}${weaponUsed?` (${esc(oa.formula)} + arme « ${esc(weaponUsed.name)} » ${esc(weaponFormula)})`:''} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
  lines.push(`✨ Dégâts (${esc(isPhys?'Physique':'Magique')} / ${esc(oa.element||'Neutre')}) : ${damage}${def?` (−${def} défense)`:''}`);
  if(absorbed>0)lines.push(`🛡 Bouclier : ${absorbed} absorbé(s)`);
  lines.push(`❤️ ${esc(targetInst.label)} : -${hpDamage} PV (${targetInst.hp}/${targetInst.hpMax})`);
  broadcastHud(targetInst.id,{hp:-hpDamage,shield:absorbed>0?-absorbed:0});
  if(oa.impactImage){
    playOppImpactAt(targetInst.id,oa.impactImage,oa.impactFrames,oa.impactRows,oa.animFps);
    gameChannel?.send({type:'broadcast',event:'oppfx',payload:{targetId:targetInst.id,image:oa.impactImage,frames:oa.impactFrames,rows:oa.impactRows,fps:oa.animFps}});
  }
  if(targetInst.hp<=0){lines.push(`💀 <b>${esc(targetInst.label)} est KO</b>.`);handleInstanceDeath(targetInst);}
  addLog(lines.join('<br>'));
}
function resolveAbility(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  if(!casterInst){toast('Sélectionne d’abord un personnage.');return;}
  if(!canControlInstance(casterInst.id)){
    toast('⛔ Vous ne contrôlez pas ce personnage.');
    activeAbility=null; hoverCell=null; render(); return;
  }
  if(a.manaCost>0&&(casterInst.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${casterInst.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    activeAbility=null; hoverCell=null; render(); return;
  }
  if(a.range&&a.range>0){
    const casterSW=casterInst.sizeW||1, casterSH=casterInst.sizeH||1;
    const targetInst=explicitTargetInstId?inst(explicitTargetInstId):null;
    const tW=targetInst?(targetInst.sizeW||1):1, tH=targetInst?(targetInst.sizeH||1):1;
    const dist=footprintDistance(casterInst.x,casterInst.y,casterSW,casterSH,start[0],start[1],tW,tH);
    if(dist>a.range){
      toast(`🚫 Trop loin (portée max ${a.range} case${a.range>1?'s':''}) — sélectionne un ennemi plus proche.`);
      return;
    }
  }
  const casterTpl=instTemplate(casterInst);
  if(a.manaCost>0){
    casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
  }
  let weaponFormula=null, weaponUsed=null;
  if(casterTpl?.type==='player'&&casterTpl.equipmentSlots){
    const w=equip(casterTpl.equipmentSlots['arme']);
    if(w&&w.itemType==='weapon'&&w.damageFormula&&(w.weaponStat||'Force')===a.stat){weaponUsed=w;weaponFormula=w.damageFormula;}
  }
  const atkRoll=roll('1d100'); const atk=atkRoll.total; const [label,mult]=outcome(atk);
  playDiceRoll(100,[atk]);
  broadcastCritical(casterInst.id,label);
  const targets=affected(a,start,explicitTargetInstId);
  playAbilityFX(a,casterInst,targets,start);
  gameChannel?.send({type:'broadcast',event:'fx',payload:{abilityId:a.id,casterId:casterInst.id,targetIds:targets.map(t=>t.id),start}});
  const lines=[`⚔ <b>${esc(casterInst.label)}</b> lance <b>${esc(a.name)}</b>`];
  if(a.manaCost>0)lines.push(`💧 Coût en mana : ${a.manaCost} (reste ${casterInst.mana}/${casterInst.manaMax})`);
  lines.push(`🎲 d100 : <b>${atk}</b> → ${label}`);

  if(!targets.length){
    lines.push('<span class="muted">Aucune cible valide dans la zone.</span>');
    addLog(lines.join('<br>'));
    activeAbility=null; hoverCell=null; saveState(); render(); return;
  }

  // Pour les sorts de zone (AoE) : un seul jet de dés partagé, appliqué à toutes les cibles.
  const isAoE=a.area!=='single';
  let sharedRoll=null, sharedUsedFormula=null;
  if(isAoE){
    if(a.type==='Soin'||a.type==='Bouclier'){
      sharedUsedFormula=a.formula;
      sharedRoll=roll(a.formula);
    }else{
      sharedUsedFormula=weaponFormula?combineFormula(a.formula,weaponFormula):a.formula;
      sharedRoll=roll(sharedUsedFormula);
    }
    playDiceRoll(formulaSides(sharedUsedFormula),sharedRoll.rolls);
    lines.push(`🎲 ${esc(sharedUsedFormula)}${weaponUsed?` (${esc(a.formula)} + arme « ${esc(weaponUsed.name)} » ${esc(weaponFormula)})`:''} : ${sharedRoll.rolls.join(' + ')}${sharedRoll.bonus?` + ${sharedRoll.bonus}`:''} = ${sharedRoll.total} <span class="tiny muted">(zone, jet unique)</span>`);
  }

  for(const t of targets){
    const tTpl=instTemplate(t);
    if(a.type==='Soin'){
      const r=isAoE?sharedRoll:roll(a.formula);
      if(!isAoE)playDiceRoll(formulaSides(a.formula),r.rolls);
      const amount=applyMult(Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
      t.hp=Math.min(t.hpMax,t.hp+amount);
      if(!isAoE)lines.push(`🎲 ${esc(a.formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
      lines.push(`💚 Soin : ${amount}`);
      lines.push(`❤️ ${esc(t.label)} : +${amount} PV (${t.hp}/${t.hpMax})`);
      broadcastHud(t.id,{hp:amount});
      continue;
    }
    if(a.type==='Bouclier'){
      const r=isAoE?sharedRoll:roll(a.formula);
      if(!isAoE)playDiceRoll(formulaSides(a.formula),r.rolls);
      const amount=applyMult(Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
      t.shield=(t.shield||0)+amount;
      if(t.shield>t.shieldMax)t.shieldMax=t.shield;
      if(!isAoE)lines.push(`🎲 ${esc(a.formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
      lines.push(`🛡 Bouclier accordé : ${amount}`);
      lines.push(`🛡 ${esc(t.label)} : ${t.shield}/${t.shieldMax}`);
      broadcastHud(t.id,{shield:amount});
      continue;
    }
    if(mult===0){lines.push(`${esc(t.label)} n'est pas touché·e.`);continue;}
    const usedFormula=isAoE?sharedUsedFormula:(weaponFormula?combineFormula(a.formula,weaponFormula):a.formula);
    const r=isAoE?sharedRoll:roll(usedFormula); const raw=r.total;
    if(!isAoE)playDiceRoll(formulaSides(usedFormula),r.rolls);
    let damage=applyMult(Math.ceil(raw*mult*(casterTpl.stats[a.stat]||0)/100),a.dmgMult);
    const def=(a.defense!=='none')?(effectiveDef(tTpl)[a.defense]||0):0;
    damage=Math.max(0,damage-def);

/* Placement en 3 clics pour Ligne/Cône :
   1) direction depuis le lanceur   2) distance du lanceur (0 → portée max)   3) orientation finale (pivote sur le point choisi) puis lance. */
function handlePersistentLineConeClick(a,casterInst,pt){
  if(!casterInst){toast('Sélectionne d’abord un personnage.');pendingPersistentOrigin=null;activeAbility=null;render();return;}
  if(!pendingPersistentOrigin||pendingPersistentOrigin.abilityId!==a.id){
    pendingPersistentOrigin={abilityId:a.id,stage:'angle'};
  }
  const c=S.map.cell;
  const casterPx=casterPixelPos(casterInst);

  if(pendingPersistentOrigin.stage==='angle'){
    const clickPx=[pt[0]*c+c/2,pt[1]*c+c/2];
    pendingPersistentOrigin.angle=Math.atan2(clickPx[1]-casterPx[1],clickPx[0]-casterPx[0]);
    pendingPersistentOrigin.casterPx=casterPx;
    pendingPersistentOrigin.stage='distance';
    hoverCell=null;
    toast('🎯 Choisis la distance (clique pour confirmer)');
    render();
    return;
  }
  if(pendingPersistentOrigin.stage==='distance'){
    const {angle,casterPx:cp}=pendingPersistentOrigin;
    const maxCells=a.range>0?a.range:9999;
    const distCells=projectDistanceCells(cp[0],cp[1],angle,pt,maxCells);
    pendingPersistentOrigin.originPx=[cp[0]+Math.cos(angle)*distCells*c,cp[1]+Math.sin(angle)*distCells*c];
    pendingPersistentOrigin.stage='final';
    hoverCell=null;
    toast('🎯 Ajuste l’orientation puis clique pour lancer (Échap pour annuler)');
    render();
    return;
  }
  if(pendingPersistentOrigin.stage==='final'){
    const {originPx}=pendingPersistentOrigin;
    const clickPx=[pt[0]*c+c/2,pt[1]*c+c/2];
    const finalAngle=Math.atan2(clickPx[1]-originPx[1],clickPx[0]-originPx[0]);
    const zoneLen=a.zoneRange||a.range||1;
    const axis={cx:originPx[0],cy:originPx[1],angle:finalAngle,range:zoneLen*c};
    pendingPersistentOrigin=null; activeAbility=null; hoverCell=null;
    resolvePersistentAbility(a,casterInst,pt,null,axis);
    return;
  }
}
function resolvePersistentAbility(a,casterInst,start,originOverride,axisOverride){
  if(!casterInst){toast('Sélectionne d’abord un personnage.');return;}
  if(!canControlInstance(casterInst.id)){toast('⛔ Vous ne contrôlez pas ce personnage.');return;}

    toast(`🚫 Mana insuffisant (${casterInst.mana}/${a.manaCost}).`);
    activeAbility=null; hoverCell=null; pendingPersistentOrigin=null; render(); return;
  }
  if(!originOverride&&!axisOverride&&a.range&&a.range>0&&a.area!=='self'){
    const dist=footprintDistance(casterInst.x,casterInst.y,casterInst.sizeW||1,casterInst.sizeH||1,start[0],start[1],1,1);
    if(dist>a.range){toast(`🚫 Trop loin (portée max ${a.range} case${a.range>1?'s':''}).`);return;}
  }
  if(a.manaCost>0)casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
  const casterTpl=instTemplate(casterInst);
  const zone={id:'pz'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),abilityId:a.id,name:a.name,icon:a.icon,iconImage:a.iconImage,area:a.area,areaSize:a.areaSize||1,coneStart:a.coneStart,coneEnd:a.coneEnd,formula:a.formula,stat:a.stat,defense:a.defense,element:a.element,dmgMult:a.dmgMult||'',statValue:casterTpl?.stats?.[a.stat]||0,casterLabel:casterInst.label,turnsLeft:a.duration||3,effect:a.effect,zoneImage:a.zoneImage||null};
  if(a.area==='line'||a.area==='cone'){
    const axis=axisOverride||zoneAxis(a,start,originOverride,a.zoneRange||a.range||1);
    if(!axis){toast('Sélectionne d’abord un personnage.');return;}
    zone.cx=axis.cx; zone.cy=axis.cy; zone.angle=axis.angle; zone.range=axis.range;
  }else if(a.area==='self'){
    zone.cx=casterInst.x; zone.cy=casterInst.y;
    zone.casterSW=casterInst.sizeW||1; zone.casterSH=casterInst.sizeH||1;
  }else{
    const size=a.areaSize||3;
    zone.x=Math.max(0,Math.min(S.map.cols-size,start[0]));
    zone.y=Math.max(0,Math.min(S.map.rows-size,start[1]));
  }
  S.persistentZones.push(zone);
  addLog(`🌫️ <b>${esc(casterInst.label)}</b> invoque <b>${esc(a.name)}</b> (zone persistante, ${zone.turnsLeft} tour(s)).`);
  activeAbility=null; hoverCell=null;
  if(S.combat.active&&S.combat.order[S.combat.turn]===casterInst.id)advanceTurn();
  saveState(); render();
}
function tokenInPersistentZone(t,z){
  const c=S.map.cell, sw=t.sizeW||1, sh=t.sizeH||1;
  if(z.area==='line'||z.area==='cone')return footprintHitsLineCone(t.x,t.y,sw,sh,{cx:z.cx,cy:z.cy,angle:z.angle,range:z.range},z.area,c,z.coneStart,z.coneEnd);
  if(z.area==='self'){
    const size=z.areaSize||1, csw=z.casterSW||1, csh=z.casterSH||1;
    const gapX=Math.max(0, t.x-(z.cx+csw-1), z.cx-(t.x+sw-1));
    const gapY=Math.max(0, t.y-(z.cy+csh-1), z.cy-(t.y+sh-1));
    return gapX<=size&&gapY<=size;
  }
  const size=z.areaSize||1;
  return (t.x+sw>z.x)&&(t.x<z.x+size)&&(t.y+sh>z.y)&&(t.y<z.y+size);
}
function tickPersistentZones(nt){
  if(!S.persistentZones||!S.persistentZones.length)return;

      addLog(`🌫️ <b>${esc(nt.label)}</b> — ${esc(z.name)} : +${raw} bouclier`);

      let dmg=raw;

      dmg=Math.max(0,Math.ceil(dmg*(1-resist)));

      nt.hp=Math.max(0,nt.hp-hpDmg);

function decayPersistentZones(){

function persistentZonesHtml(){
  if(!S.persistentZones||!S.persistentZones.length)return '';
  const c=S.map.cell;
  return S.persistentZones.map(z=>{
    if(z.area==='line'||z.area==='cone'){
      const {cx,cy,angle,range}=z;
      const dx=Math.cos(angle), dy=Math.sin(angle), px=-dy, py=dx;
      let poly;
      if(z.area==='line'){const hw=c/2;poly=[[cx+px*hw,cy+py*hw],[cx-px*hw,cy-py*hw],[cx-px*hw+dx*range,cy-py*hw+dy*range],[cx+px*hw+dx*range,cy+py*hw+dy*range]];}
      else{const sw=(z.coneStart||1)*c/2, ew=(z.coneEnd||3)*c/2;poly=[[cx+px*sw,cy+py*sw],[cx-px*sw,cy-py*sw],[cx+dx*range-px*ew,cy+dy*range-py*ew],[cx+dx*range+px*ew,cy+dy*range+py*ew]];}
      const pts=poly.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
      const mapW=S.map.cols*c, mapH=S.map.rows*c;
      if(z.zoneImage){
        const patId='pat'+Math.random().toString(36).slice(2,9);
        return `<svg style="position:absolute;left:0;top:0;pointer-events:none;z-index:12" width="${mapW}" height="${mapH}"><defs><pattern id="${patId}" patternUnits="userSpaceOnUse" width="${c}" height="${c}"><image href="${esc(z.zoneImage)}" x="0" y="0" width="${c}" height="${c}" preserveAspectRatio="xMidYMid slice"/></pattern></defs><polygon points="${pts}" fill="url(#${patId})" stroke="#ff8c3c" stroke-width="2" stroke-dasharray="6,4" opacity=".9"/></svg>`;
      }
      const effect=z.effect?`<text x="${cx+dx*range/2}" y="${cy+dy*range/2}" font-size="${Math.max(24,c*0.8)}" text-anchor="middle" dominant-baseline="middle" opacity=".5">${esc(z.effect)}</text>`:'';
      return `<svg style="position:absolute;left:0;top:0;pointer-events:none;z-index:12" width="${mapW}" height="${mapH}"><polygon points="${pts}" fill="#ff6a1f2e" stroke="#ff8c3c" stroke-width="2" stroke-dasharray="6,4"/>${effect}</svg>`;
    }
    let x,y,w,h;
    if(z.area==='self'){
      const csw=z.casterSW||1, csh=z.casterSH||1;
      w=(z.areaSize||1)*2+csw; h=(z.areaSize||1)*2+csh;
      x=z.cx-(z.areaSize||1); y=z.cy-(z.areaSize||1);
    }else{w=h=z.areaSize||1;x=z.x;y=z.y;}
    const px=x*c, py=y*c, dw=w*c, dh=h*c;
    if(z.zoneImage){
      return `<div style="position:absolute;left:${px}px;top:${py}px;width:${dw}px;height:${dh}px;border:2px dashed #ff8c3c;z-index:12;pointer-events:none;background-image:url('${esc(z.zoneImage)}');background-size:${c}px ${c}px;background-repeat:repeat;opacity:.9;${z.area==='circle'?'border-radius:50%;':''}"></div>`;
    }
    const effect=z.effect?`<span style="font-size:${Math.max(24,Math.min(w,h)*8)}px;opacity:.5">${esc(z.effect)}</span>`:'';
    return `<div style="position:absolute;left:${px}px;top:${py}px;width:${dw}px;height:${dh}px;background:#ff6a1f2e;border:2px dashed #ff8c3c;z-index:12;display:grid;place-items:center;pointer-events:none">${effect}</div>`;
  }).join('');
}

  const a=S.abilities.find(x=>x.id===id); if(!a)return;
  const caster=inst(selectedToken);
  if(a.type==='Passif'){ toggleAuraForCaster(id); return; }
  if(a.manaCost>0&&caster&&(caster.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${caster.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    return;
  }
  if(a.type==='Transformation'){ castTransformation(a); return; }
  if(a.area==='self'){
    if(a.type==='Persistant')resolvePersistentAbility(a,caster,[caster.x,caster.y]);
    else if(a.type==='Buff')resolveBuffZone(a,caster,[caster.x,caster.y]);
    else resolveAbility(a,[caster.x,caster.y]);
    return;
  }
  pendingPersistentOrigin=(a.type==='Persistant'&&(a.area==='line'||a.area==='cone'))?{abilityId:id,stage:'angle'}:null;
  activeAbility=id; hoverCell=null; render();
  toast(pendingPersistentOrigin?'🎯 Choisis la direction du sort (clique pour confirmer)':'🎯 Ciblage : clique sur une cible ou une case (Échap pour annuler)');
}
function transformInstance(instId,targetCharId){
  const t=inst(instId); const newChar=char(targetCharId);
  if(!t||!newChar)return false;
  t.charId=targetCharId;
  t.label=newChar.name;
  t.hpMax=newChar.resourcesMax?.Vie||1; t.hp=t.hpMax;
  t.manaMax=newChar.resourcesMax?.Mana||0; t.mana=t.manaMax;
  t.shieldMax=newChar.resourcesMax?.Bouclier||0; t.shield=t.shieldMax;
  return true;
}
function castTransformation(a){
  if(!a.transformCharId||!char(a.transformCharId)){toast('⚠️ Cette capacité n’a pas de personnage de transformation valide.');return;}
  const caster=inst(selectedToken); if(!caster)return;
  const fromName=caster.label;
  if(a.manaCost>0)caster.mana=Math.max(0,(caster.mana||0)-a.manaCost);
  transformInstance(caster.id,a.transformCharId);
  addLog(`🔄 <b>${esc(fromName)}</b> se transforme en <b>${esc(caster.label)}</b> (${esc(a.name)}).`);
  activeAbility=null; hoverCell=null;
  if(S.combat.active&&S.combat.order[S.combat.turn]===caster.id)advanceTurn();
  saveState(); render();
}
function handleInstanceDeath(t){
  const tpl=instTemplate(t);
  const options=tpl?characterAbilities(tpl.id).filter(a=>a.type==='Transformation'&&a.triggerOnDeath):[];
  const usable=options.find(a=>a.transformCharId&&char(a.transformCharId)&&(t.mana||0)>=(a.manaCost||0));
  if(usable){
    const fromName=t.label;
    if(usable.manaCost>0)t.mana=Math.max(0,(t.mana||0)-usable.manaCost);
    transformInstance(t.id,usable.transformCharId);
    addLog(`💀➡️🔄 <b>${esc(fromName)}</b> tombe à 0 PV et se transforme automatiquement en <b>${esc(t.label)}</b> (${esc(usable.name)}).`);
  }else{
    removeInstance(t.id);
  }
}

    Terre:parseNum(document.getElementById('r_terre').value),
    Air:parseNum(document.getElementById('r_air').value),
    Glace:parseNum(document.getElementById('r_glace').value),
    Foudre:parseNum(document.getElementById('r_foudre').value),
    Lumière:parseNum(document.getElementById('r_lumiere').value),
    Ténèbres:parseNum(document.getElementById('r_tenebres').value)
  };
  c.oppAttack={formula:document.getElementById('oa_formula').value.trim(),type:document.getElementById('oa_type').value,element:document.getElementById('oa_element').value,impactImage:document.getElementById('oa_impact').value.trim()||null,impactFrames:Math.max(1,parseNum(document.getElementById('oa_impact_frames').value)||1),impactRows:Math.max(1,parseNum(document.getElementById('oa_impact_rows').value)||1),animFps:Math.max(1,Math.min(60,parseNum(document.getElementById('oa_animfps').value)||60))};
  if(c.type==='player'){
    c.equipmentSlots=c.equipmentSlots||{};
    EQUIP_SLOTS.forEach(([k])=>{const el=document.getElementById('eqslot_'+k);if(el)c.equipmentSlots[k]=el.value||null;});
  }
  if(!id)S.characters.push(c);
  S.instances.filter(i=>i.charId===c.id).forEach(i=>{
    i.hpMax=c.resourcesMax.Vie; i.manaMax=c.resourcesMax.Mana; i.shieldMax=c.resourcesMax.Bouclier;
    i.hp=Math.min(i.hp,i.hpMax); i.mana=Math.min(i.mana,i.manaMax); i.shield=Math.min(i.shield,i.shieldMax);
    let newW=i.sizeW||1, newH=i.sizeH||1, sizeDirty=false;
    document.querySelectorAll(`#modal input[data-inst="${i.id}"][data-dirty="1"]`).forEach(el=>{
      const v=Math.round(parseNum(el.value));
      if(el.dataset.field==='hp')i.hp=Math.max(0,Math.min(i.hpMax,v));
      else if(el.dataset.field==='mana')i.mana=Math.max(0,Math.min(i.manaMax,v));
      else if(el.dataset.field==='sizew'){newW=Math.max(1,Math.min(20,v));sizeDirty=true;}
      else if(el.dataset.field==='sizeh'){newH=Math.max(1,Math.min(20,v));sizeDirty=true;}
    });
    if(sizeDirty){
      if(footprintOverlap(i.id,i.x,i.y,newW,newH)){
        toast(`🚫 Taille de ${i.label} inchangée — chevauche un autre jeton ou dépasse la carte.`);
      }else{
        i.sizeW=newW; i.sizeH=newH;
      }
    }
    if(i.hp<=0){addLog(`💀 <b>${esc(i.label)}</b> tombe à 0 PV.`);handleInstanceDeath(i);}
  });
  saveState(); closeModal(); render();
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');const m=document.getElementById('modal');m.classList.remove('modal-fullscreen');m.classList.remove('note-focus-mode');noteFocusMode=false;m.style.position='';m.style.left='';m.style.top='';m.style.margin='';}
/* Déplacer / agrandir la fenêtre modale à la souris */
let modalDrag=null;
document.addEventListener('mousedown',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  const modal=document.getElementById('modal');
  if(modal.classList.contains('modal-fullscreen'))return;
  const rect=modal.getBoundingClientRect();
  modal.style.position='fixed'; modal.style.left=rect.left+'px'; modal.style.top=rect.top+'px'; modal.style.margin='0';
  modalDrag={startX:e.clientX,startY:e.clientY,origLeft:rect.left,origTop:rect.top};
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!modalDrag)return;
  const modal=document.getElementById('modal');
  modal.style.left=(modalDrag.origLeft+(e.clientX-modalDrag.startX))+'px';
  modal.style.top=(modalDrag.origTop+(e.clientY-modalDrag.startY))+'px';
});
document.addEventListener('mouseup',()=>{modalDrag=null;});
document.addEventListener('dblclick',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  document.getElementById('modal').classList.toggle('modal-fullscreen');
});

function abilityResultsHtml(){
  const mj=isMJ();
  const q=abilitySearchQuery.trim().toLowerCase();
  let list=S.abilities;
  if(q)list=list.filter(a=>a.name.toLowerCase().includes(q));
  if(abilityTypeFilter)list=list.filter(a=>a.type===abilityTypeFilter);
  if(abilityCharFilter)list=list.filter(a=>(a.characterIds||[]).includes(abilityCharFilter));
  if(!list.length)return '<p class="tiny muted">Aucune capacité ne correspond.</p>';
  return list.map(a=>{
    const linked=(a.characterIds||[]).map(cid=>char(cid)).filter(Boolean);
    const linkedText=linked.length?linked.map(c=>c.name).join(', '):'aucun personnage lié';
    const isTransfo=a.type==='Transformation';
    const infoLine=isTransfo
      ? `Transformation → ${esc(char(a.transformCharId)?.name||'—')} · Mana ${a.manaCost||0} · Auto à la mort : ${a.triggerOnDeath?'Oui':'Non'}`
      : a.type==='Passif'
      ? `Aura (${esc(a.area)} ${a.areaSize}) · ${esc(a.formula)} · Effet : ${a.auraEffect==='heal'?'Soin':a.auraEffect==='shield'?'Bouclier':'Dégâts'} · Mana/tick ${a.manaCost||0}`
      : a.type==='Buff'
      ? `Buff/Débuff · ${esc(a.formula)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?'Ligne droite':a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3}`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · ${a.duration} tour(s) · Portée ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`
      : a.type==='Persistant'
      ? `Zone persistante · ${esc(a.formula)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?`Ligne (zone ${a.zoneRange||a.range} cases)`:a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3} (zone ${a.zoneRange||a.range} cases)`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · ${a.duration} tour(s) · Portée origine ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`
      : `${esc(a.type)}${a.hotkey?` [${esc(a.hotkey)}]`:''} · ${esc(a.formula)} · ${esc(a.stat)} · ${esc(a.element)} · ${a.area==='single'?'Cible unique':a.area==='line'?'Ligne droite':a.area==='cone'?`Cône ${a.coneStart||1}→${a.coneEnd||3}`:a.area==='self'?'Autour de soi':(a.area+' '+a.areaSize)} · Portée ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}`;
    return `<div class="ability"><div class="icon">${iconBoxHtml(a,'9px')}</div><div class="ability-info"><b>${esc(a.name)}</b><small>${infoLine}</small><br><small class="muted">🔗 ${esc(linkedText)}</small></div>${mj?`<button class="btn" onclick="openAbility('${a.id}')">Modifier</button>${isTransfo?'':`<button class="btn ghost" onclick="openAdvancedAbility('${a.id}')" title="Aperçu macro">🔴</button>`}`:''}</div>`;
  }).join('');
}

function saveAbility(id){
  if(!isMJ()){toast('⛔ Seul le MJ peut créer ou modifier les capacités.');return;}
  const target=id?S.abilities.find(x=>x.id===id):{id:'a'+Date.now()};
  target.name=document.getElementById('a_name').value||'Capacité';
  target.icon=document.getElementById('a_icon').value||'✨';
  target.iconImage=document.getElementById('a_iconimage').value.trim()||null;
  target.type=document.getElementById('a_type').value;
  target.manaCost=Math.max(0,+document.getElementById('a_manacost').value||0);
  if(target.type==='Transformation'){
    target.transformCharId=document.getElementById('a_transformchar').value||null;
    target.triggerOnDeath=document.getElementById('a_triggerondeath').checked;
    target.formula='0'; target.stat='Force'; target.defense='none'; target.element='Neutre';
    target.area='single'; target.areaSize=1; target.range=0; target.desc=''; target.effect=''; target.dmgMult='';
  }else{
    target.formula=document.getElementById('a_formula').value||'1d20';
    target.dmgMult=document.getElementById('a_dmgmult').value.trim();
    target.stat=document.getElementById('a_stat').value;
    target.defense=document.getElementById('a_def').value;
    target.element=document.getElementById('a_element').value;
    target.area=document.getElementById('a_area').value;
    target.areaSize=+document.getElementById('a_size').value||1;
    target.coneStart=Math.max(1,+document.getElementById('a_conestart').value||1);
    target.coneEnd=Math.max(1,+document.getElementById('a_coneend').value||3);
    target.range=Math.max(0,+document.getElementById('a_range').value||0);
    target.zoneRange=Math.max(1,+document.getElementById('a_zonerange').value||target.range||3);
    target.desc=rteHtml('a_desc');
    target.effect=document.getElementById('a_effect').value||'✨';
    target.impactPerToken=document.getElementById('a_impactpertoken')?.checked||false;
    target.zoneImage=document.getElementById('a_zoneimage').value.trim()||null;
    target.projectileImage=document.getElementById('a_projectile').value.trim()||null;
    target.projectileFrames=Math.max(1,+document.getElementById('a_proj_frames').value||1);
    target.projectileRows=Math.max(1,+document.getElementById('a_proj_rows').value||1);
    target.impactSpritesheet=document.getElementById('a_impact').value.trim()||null;
    target.impactFrames=Math.max(1,+document.getElementById('a_impact_frames').value||1);
    target.impactRows=Math.max(1,+document.getElementById('a_impact_rows').value||1);
    target.animFps=Math.max(1,Math.min(60,+document.getElementById('a_animfps').value||60));
    target.transformCharId=null; target.triggerOnDeath=false;
    target.auraEffect=document.getElementById('a_auraeffect')?document.getElementById('a_auraeffect').value:'damage';
    target.duration=Math.max(1,+(document.getElementById('a_duration')?.value)||3);
    if(target.type==='Passif'){
      if(target.area!=='circle'&&target.area!=='square')target.area='square';
    }

  }
  target.characterIds=[...document.querySelectorAll('.ac-check:checked')].map(el=>el.value);
  if(!id)S.abilities.push(target);
  if(target.type==='Transformation'&&!target.transformCharId){toast('⚠️ Choisis un personnage vers lequel se transformer.');}
  saveState(); closeModal(); render();
}

function openHudSettings(){
  if(!isMJ())return;
  const hs=S.hudSettings||{};

async function handleHudAudioInput(ev,key){
  if(!isMJ())return;
  const file=ev.target.files[0]; if(!file)return;
  toast('⏳ Envoi du son…');
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath=`audio_${Date.now()}_${safeName}`;
    const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
    if(upErr){ toast('❌ Échec de l\'envoi : '+upErr.message); return; }
    const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
    document.getElementById(`hud_${key}_audio`).value=pub.publicUrl;
    const lbl=document.getElementById(`hud_${key}_audiolabel`); if(lbl)lbl.textContent='🔊 Son défini';
    toast('✅ Son envoyé.');
  }catch(e){ console.error('handleHudAudioInput',e); toast('❌ Erreur lors de l\'envoi du son.'); }
}
function clearHudAudio(key){
  const el=document.getElementById(`hud_${key}_audio`); if(el)el.value='';
  const lbl=document.getElementById(`hud_${key}_audiolabel`); if(lbl)lbl.textContent='Aucun son';
}
function saveHudSettings(){
  if(!isMJ())return;
  if(!S.hudSettings)S.hudSettings={};
  S.hudSettings.resourceDurationMs=Math.max(100,parseNum(document.getElementById('hud_resdur').value)||1000);
  S.hudSettings.criticalDurationMs=Math.max(100,parseNum(document.getElementById('hud_critdur').value)||1000);
  S.hudSettings.critical={};
  Object.keys(CRITICAL_LABELS).forEach(key=>{
    S.hudSettings.critical[key]={
      image:document.getElementById(`hud_${key}_img`).value.trim()||null,
      audio:document.getElementById(`hud_${key}_audio`).value.trim()||null
    };
  });
  saveState(); closeModal(); render();
  toast('✅ Réglages HUD enregistrés.');
}

function addCharConsumablePrompt(charId){
  const sel=document.getElementById('c_addconsumable_select'); const defId=sel?sel.value:'';
  if(!defId){toast('⚠️ Choisis un consommable.');return;}
  const qty=parseInt(prompt('Combien en ajouter ?','1'),10);
  if(!qty||qty<1)return;
  const c=char(charId); if(!c)return;
  c.consumablesOwned=c.consumablesOwned||[];
  let entry=c.consumablesOwned.find(x=>x.id===defId);
  if(entry)entry.qty+=qty; else c.consumablesOwned.push({id:defId,qty});
  saveState();
  openCharacter(charId);
}
function removeCharConsumable(charId,defId){
  if(!isMJ())return;
  const c=char(charId); if(!c)return;
  c.consumablesOwned=(c.consumablesOwned||[]).filter(x=>x.id!==defId);
  saveState();
  openCharacter(charId);
}
function useConsumable(charId,defId){
  if(!canControlChar(charId))return;
  const c=char(charId); if(!c)return;
  const entry=(c.consumablesOwned||[]).find(x=>x.id===defId);
  if(!entry||entry.qty<=0){toast('⚠️ Aucune charge restante.');return;}
  const def=(S.consumables||[]).find(x=>x.id===defId); if(!def){toast('⚠️ Consommable introuvable.');return;}
  const targets=S.instances.filter(i=>i.charId===charId);
  if(!targets.length){toast('⚠️ Ce personnage n’a pas de jeton sur la carte.');return;}
  targets.forEach(t=>{
    if(def.resource==='Mana'){t.mana=Math.min(t.manaMax,t.mana+def.amount);broadcastHud(t.id,{mana:def.amount});}
    else {t.hp=Math.min(t.hpMax,t.hp+def.amount);broadcastHud(t.id,{hp:def.amount});}
  });
  entry.qty-=1;
  if(entry.qty<=0)c.consumablesOwned=c.consumablesOwned.filter(x=>x.id!==defId);
  addLog(`🧪 <b>${esc(c.name)}</b> utilise <b>${esc(def.name)}</b> (+${def.amount} ${def.resource==='Mana'?'💧 Mana':'❤️ PV'}).`);
  saveState(); render();
}

function saveEquipment(id){
  if(!isMJ())return;
  if(!S.equipment)S.equipment=[];
  const target=id?S.equipment.find(x=>x.id===id):{id:'eq'+Date.now()};
  target.name=document.getElementById('eq_name').value||'Équipement';
  target.icon=document.getElementById('eq_icon').value||'🎽';
  target.iconImage=document.getElementById('eq_iconimage').value.trim()||null;
  target.image=document.getElementById('eq_image').value.trim()||null;
  target.itemType=document.getElementById('eq_itemtype').value;
  if(target.itemType==='weapon'){
    target.category='arme';
    target.damageFormula=document.getElementById('eq_damage').value.trim()||'1d20';
    target.weaponStat=document.getElementById('eq_weaponstat').value||'Force';
    target.ca=0; target.dm=0;
    target.res={Feu:0,Eau:0,Terre:0,Air:0,Glace:0,Foudre:0,Lumière:0,Ténèbres:0};
  }else{
    target.category=document.getElementById('eq_category').value||'torse';
    target.damageFormula='';
    target.ca=parseNum(document.getElementById('eq_ca').value);
    target.dm=parseNum(document.getElementById('eq_dm').value);
    target.res={
      Feu:parseNum(document.getElementById('eq_r_fire').value),
      Eau:parseNum(document.getElementById('eq_r_eau').value),
      Terre:parseNum(document.getElementById('eq_r_terre').value),
      Air:parseNum(document.getElementById('eq_r_air').value),
      Glace:parseNum(document.getElementById('eq_r_glace').value),
      Foudre:parseNum(document.getElementById('eq_r_foudre').value),
      Lumière:parseNum(document.getElementById('eq_r_lumiere').value),
      Ténèbres:parseNum(document.getElementById('eq_r_tenebres').value)
    };
  }
  if(!id)S.equipment.push(target);
  saveState(); closeModal(); render();
}
function confirmDeleteEquipment(id){
  if(!isMJ())return;
  if(!confirm('Supprimer cet équipement ? Il sera automatiquement déséquipé de tous les personnages.'))return;
  S.characters.forEach(c=>{if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{if(c.equipmentSlots[k]===id)c.equipmentSlots[k]=null;});}});
  S.equipment=(S.equipment||[]).filter(x=>x.id!==id);
  saveState(); render();
  toast('🗑️ Équipement supprimé.');
}

}

/* ============================= CARTES : UPLOAD, DIMENSIONNEMENT, BIBLIOTHÈQUE ============================= */
const MAPS_BUCKET='JDR';
function handleIconDrop(ev,hiddenId,previewId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  if(!isMJ())return;
  const files=ev.dataTransfer.files;
  if(!files||!files.length)return;
  const file=files[0];
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
function handleIconFileInput(ev,hiddenId,previewId){
  if(!isMJ())return;
  const file=ev.target.files[0]; if(!file)return;
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
async function uploadIconImage(file,hiddenId,previewId){
  toast('⏳ Envoi de l’icône…');
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath=`icon_${Date.now()}_${safeName}`;
    const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
    if(upErr){ toast('❌ Échec de l’envoi : '+upErr.message); return; }
    const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
    const hidden=document.getElementById(hiddenId); if(hidden)hidden.value=pub.publicUrl;
    const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<img src="${esc(pub.publicUrl)}">`;
    const niceName=file.name.replace(/\.[^.]+$/,'');
    try{ await supabaseClient.from('image_library').insert({storage_path:filePath,display_name:niceName,category_id:null}); }catch(e2){ console.error('image_library insert',e2); }
    loadImageLibrary();
    toast('✅ Icône envoyée.');
  }catch(e){ console.error('uploadIconImage',e); toast('❌ Erreur lors de l’envoi de l’icône.'); }
}
function clearIconImage(hiddenId,previewId,fallbackEmoji){
  const hidden=document.getElementById(hiddenId); if(hidden)hidden.value='';
  const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<span>${esc(fallbackEmoji||'❓')}</span>`;
}

      <div id="pickerResults_${hiddenId}" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>

function loadImageDimensions(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight});
    img.onerror=()=>reject(new Error('image illisible'));
    img.src=src;
  });
}
function openMapSizeModal(onConfirm){
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>🗺️ Dimensionner la carte</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  <p class="tiny muted">Combien de cases de large fait cette carte (colonnes) ? Le nombre de lignes sera calculé automatiquement pour respecter les proportions de l'image, sans la déformer.</p>
  <div class="field"><label>Colonnes</label><input id="map_cols_input" type="number" min="2" max="60" value="${S.map.cols||20}"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="map_cols_confirm">Valider</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('map_cols_confirm').onclick=()=>{
    const cols=Math.max(2,Math.min(60,parseInt(document.getElementById('map_cols_input').value,10)||20));
    closeModal();
    onConfirm(cols);
  };
}
function applyMapBackground(cols,publicUrl,naturalW,naturalH){
  const rows=Math.max(2,Math.round(cols*naturalH/naturalW));
  S.map.cols=cols; S.map.rows=rows; S.map.backgroundImage=publicUrl;
  mapZoom=1; mapPan={x:0,y:0};
  addLog(`🗺️ Le MJ a changé le fond de carte (${cols}×${rows} cases).`);
  saveState(); render();
  toast(`🗺️ Carte mise à jour (${cols}×${rows} cases).`);
}
function handleMapImageFile(file){
  const objectUrl=URL.createObjectURL(file);
  loadImageDimensions(objectUrl).then(dims=>{
    openMapSizeModal(async cols=>{
      toast('⏳ Envoi de la carte en cours…');
      try{
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const filePath=`map_${Date.now()}_${safeName}`;
        const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
        if(upErr){ toast('❌ Échec de l\'envoi : '+upErr.message); return; }
        const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
        const niceName=file.name.replace(/\.[^.]+$/,'');
        const { error:metaErr } = await supabaseClient.from('map_library').insert({storage_path:filePath,display_name:niceName,category_id:currentMapCategory});
        if(metaErr)console.error('map_library insert',metaErr);
        applyMapBackground(cols,pub.publicUrl,dims.w,dims.h);
        await loadMapLibrary(); render();
      }catch(e){ console.error('handleMapImageFile',e); toast('❌ Erreur lors de l\'envoi de la carte.'); }
      finally{ URL.revokeObjectURL(objectUrl); }
    });
  }).catch(()=>{ toast('⚠️ Impossible de lire cette image.'); URL.revokeObjectURL(objectUrl); });
}
function handleMapImageUrl(url){
  loadImageDimensions(url).then(dims=>{
    openMapSizeModal(cols=>applyMapBackground(cols,url,dims.w,dims.h));
  }).catch(()=>toast('⚠️ Impossible de charger cette image.'));
}
async function loadMapCategories(){
  try{
    const { data, error } = await supabaseClient.from('map_categories').select('*');
    if(!error) mapCategories=data||[];
  }catch(e){ console.error('loadMapCategories',e); }
}
async function loadMapLibrary(){
  try{
    const [{data:files,error:filesErr},{data:meta,error:metaErr}] = await Promise.all([
      supabaseClient.storage.from(MAPS_BUCKET).list('',{limit:1000,sortBy:{column:'created_at',order:'desc'}}),
      supabaseClient.from('map_library').select('*')
    ]);
    if(filesErr){ console.error('loadMapLibrary(storage)',filesErr); return; }
    if(metaErr) console.error('loadMapLibrary(meta)',metaErr);
    const metaByPath={};
    (meta||[]).forEach(m=>metaByPath[m.storage_path]=m);
    const validFiles=(files||[]).filter(f=>f.name && !f.name.startsWith('.') && /^map_/i.test(f.name));
    // Rattrapage : des cartes envoyées avant la mise en place des catégories n'ont pas encore de métadonnées.
    const orphans=validFiles.filter(f=>!metaByPath[f.name]);
    if(orphans.length && isMJ()){
      for(const f of orphans){
        try{
          const { data:inserted, error:insErr } = await supabaseClient.from('map_library').insert({storage_path:f.name,display_name:f.name,category_id:null}).select().single();
          if(!insErr && inserted) metaByPath[f.name]=inserted;
        }catch(e){ console.error('backfill map_library',e); }
      }
    }
    mapLibrary=validFiles.map(f=>{
      const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(f.name);
      const m=metaByPath[f.name];
      return { id:m?.id||null, storagePath:f.name, url:pub.publicUrl, displayName:m?.display_name||f.name, categoryId:m?.category_id||null };
    });
  }catch(e){ console.error('loadMapLibrary',e); }
}
function mapDragStart(ev,url,mapId){
  if(!isMJ()){ev.preventDefault();return;}
  ev.dataTransfer.setData('text/plain','map:'+url);
  if(mapId)ev.dataTransfer.setData('application/x-map-id',mapId);
  ev.dataTransfer.effectAllowed='copyMove';
  document.getElementById('mapDropHint')?.classList.add('show');
}
function handleCategoryDrop(ev,categoryId){
  ev.preventDefault(); ev.stopPropagation();
  if(!isMJ())return;
  const mapId=ev.dataTransfer.getData('application/x-map-id');
  if(!mapId)return;
  moveMapToCategory(mapId,categoryId);
}
async function moveMapToCategory(mapId,categoryId){
  if(!isMJ())return;
  try{
    const { error } = await supabaseClient.from('map_library').update({category_id:categoryId}).eq('id',mapId);
    if(error){toast('❌ '+error.message);return;}
  }catch(e){ console.error('moveMapToCategory',e); toast('❌ Erreur réseau.'); return; }
  const m=mapLibrary.find(x=>x.id===mapId);
  if(m)m.categoryId=categoryId;
  render();
  toast('✅ Carte déplacée.');
}
function applyExistingMap(url){
  if(!isMJ()){toast('⛔ Seul le MJ peut changer la carte.');return;}
  handleMapImageUrl(url);
}

function mapBreadcrumb(catId){
  const chain=[];
  let cur=catId;
  while(cur){
    const c=mapCategories.find(x=>x.id===cur);
    if(!c)break;
    chain.unshift(c);
    cur=c.parent_id;
  }
  const rootLink=`<button class="btn ghost" style="padding:3px 8px" onclick="openMapCategory(null)" ondragover="event.preventDefault()" ondrop="handleCategoryDrop(event,null)">🏠 Racine</button>`;
  const rest=chain.map(c=>`<span class="tiny muted">›</span> <button class="btn ghost" style="padding:3px 8px" onclick="openMapCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleCategoryDrop(event,'${c.id}')">${esc(c.name)}</button>`).join(' ');
  return `<div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:8px">${rootLink} ${rest}</div>`;
}

function descendantCategoryIds(rootId){
  const ids=[rootId];
  let frontier=[rootId];
  while(frontier.length){
    const children=mapCategories.filter(c=>frontier.includes(c.parent_id)).map(c=>c.id);
    ids.push(...children);
    frontier=children;
  }
  return ids;
}
function confirmDeleteCategory(id){
  if(!isMJ())return;
  const cat=mapCategories.find(x=>x.id===id); if(!cat)return;
  const ids=descendantCategoryIds(id);
  const affectedMaps=mapLibrary.filter(m=>ids.includes(m.categoryId));
  const subCount=ids.length-1;
  const warning=(affectedMaps.length||subCount)
    ? `Ce dossier contient ${subCount>0?`${subCount} sous-dossier(s) et `:''}${affectedMaps.length} carte(s). Les supprimer effacera <b>définitivement</b> ces cartes (fichier et fiche) de la base de données — cette action est irréversible.`
    : `Ce dossier est vide.`;
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>⚠️ Supprimer « ${esc(cat.name)} »</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  <p class="tiny muted">${warning}</p>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn" style="background:var(--danger);border-color:var(--danger)" id="cat_delete_confirm">Supprimer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('cat_delete_confirm').onclick=()=>deleteCategory(id,ids,affectedMaps);
}
async function deleteCategory(id,descendantIds,affectedMaps){
  if(!isMJ())return;
  toast('⏳ Suppression en cours…');
  try{
    if(affectedMaps.length){
      const paths=affectedMaps.map(m=>m.storagePath).filter(Boolean);
      if(paths.length){
        const { error:storErr } = await supabaseClient.storage.from(MAPS_BUCKET).remove(paths);
        if(storErr) console.error('remove storage files',storErr);
      }
      const mapIds=affectedMaps.map(m=>m.id).filter(Boolean);
      if(mapIds.length){
        const { error:delMapsErr } = await supabaseClient.from('map_library').delete().in('id',mapIds);
        if(delMapsErr) console.error('delete map_library rows',delMapsErr);
      }
    }
    const { error:delCatErr } = await supabaseClient.from('map_categories').delete().eq('id',id);
    if(delCatErr){ toast('❌ '+delCatErr.message); return; }
    const subIds=descendantIds.filter(i=>i!==id);
    if(subIds.length){
      const { error:delSubErr } = await supabaseClient.from('map_categories').delete().in('id',subIds);
      if(delSubErr) console.error('delete descendant categories',delSubErr);
    }
  }catch(e){ console.error('deleteCategory',e); toast('❌ Erreur lors de la suppression.'); return; }
  closeModal();
  if(currentMapCategory && descendantIds.includes(currentMapCategory)) currentMapCategory=null;
  await Promise.all([loadMapCategories(),loadMapLibrary()]);
  render();
  toast('🗑️ Dossier supprimé.');
}
function mapItemHtml(m){
  const mj=isMJ();
  return `<div class="asset-item" draggable="${mj}" ${mj?`ondragstart="mapDragStart(event,'${esc(m.url)}','${m.id||''}')"`:''} title="${mj?'Glisser sur la carte pour réutiliser ce terrain, ou sur un dossier pour la ranger':'Lecture seule'}">
    <img src="${esc(m.url)}" style="width:30px;height:30px;object-fit:cover;border-radius:6px;flex-shrink:0" alt="">
    <div class="asset-info"><b>${esc(m.displayName)}</b></div>
    ${mj&&m.id?`<button class="btn ghost" style="padding:4px 8px" onclick="openRenameMapModal('${m.id}')" title="Renommer">✏️</button>`:''}
    ${mj?`<button class="btn ghost" style="padding:4px 8px" onclick="applyExistingMap('${esc(m.url)}')" title="Utiliser cette carte">↺</button>`:''}
  </div>`;
}
function mapsPanel(){
  if(!isMJ())return '';
  const header=`<div class="row between" style="margin-bottom:8px"><h2>🗺️ Cartes</h2><div class="row" style="gap:6px"><button class="btn ghost" onclick="openNewCategoryModal()" title="Nouvelle catégorie">📁＋</button><button class="btn ghost" onclick="refreshMapLibrary()" title="Rafraîchir">⟳</button></div></div>`;
  const searchBar=`<input id="map_search_input" placeholder="🔎 Rechercher une carte par nom…" value="${esc(mapSearchQuery)}" oninput="onMapSearchInput(this.value)" style="margin-bottom:10px">`;
  return `${header}${searchBar}<div id="mapsResultsContainer">${mapsResultsHtml()}</div>`;
}
function onMapSearchInput(value){
  mapSearchQuery=value;
  const container=document.getElementById('mapsResultsContainer');
  if(container)container.innerHTML=mapsResultsHtml();
  // Volontairement pas de render() ici : ça recréerait le champ de recherche et ferait perdre le focus à chaque lettre tapée.
}
function mapsResultsHtml(){
  const mj=isMJ();
  const query=mapSearchQuery.trim().toLowerCase();

  if(query){
    const results=mapLibrary.filter(m=>m.displayName.toLowerCase().includes(query));
    return `<div class="asset-list">${results.length?results.map(mapItemHtml).join(''):'<p class="tiny muted">Aucune carte ne correspond à cette recherche.</p>'}</div>`;
  }

  const breadcrumb=mapBreadcrumb(currentMapCategory);
  const subCats=mapCategories.filter(c=>(c.parent_id||null)===(currentMapCategory||null));
  const mapsHere=mapLibrary.filter(m=>(m.categoryId||null)===(currentMapCategory||null));
  const catsHtml=subCats.map(c=>{
    const subCount=mapCategories.filter(cc=>cc.parent_id===c.id).length;
    const mapCount=mapLibrary.filter(m=>m.categoryId===c.id).length;
    return `<div class="asset-item" onclick="openMapCategory('${c.id}')" ondragover="event.preventDefault()" ondrop="handleCategoryDrop(event,'${c.id}')" style="cursor:pointer">
      <div class="asset-icon">📁</div><div class="asset-info"><b>${esc(c.name)}</b><small>${subCount} sous-dossier(s) · ${mapCount} carte(s)</small></div>
      <button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();openRenameCategoryModal('${c.id}')" title="Renommer le dossier">✏️</button>
      <button class="btn ghost" style="padding:4px 8px" onclick="event.stopPropagation();confirmDeleteCategory('${c.id}')" title="Supprimer le dossier">🗑️</button>
    </div>`;
  }).join('');
  const mapsHtml=mapsHere.length?mapsHere.map(mapItemHtml).join(''):'';
  const emptyMsg=(!subCats.length&&!mapsHere.length)?'<p class="tiny muted">Ce dossier est vide.</p>':'';

  return `${breadcrumb}
  <p class="tiny muted">${mj?'Glisse une image (PNG/JPG/WebP) depuis ton ordinateur directement sur la carte pour l’ajouter dans ce dossier, ou réutilise un terrain ci-dessous en le glissant sur la carte.':'Seul le MJ peut changer le fond de la carte.'}</p>
  <div class="asset-list">${catsHtml}${mapsHtml}${emptyMsg}</div>`;
}
