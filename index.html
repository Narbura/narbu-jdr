<script>

/* ============================= CONFIGURATION SUPABASE ============================= */
const SUPABASE_URL = "https://hrnwadoceetyscndbkgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Smcvfpk46VOcV5EBJAScuQ_kgv-KRw4";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Identifiant Supabase (auth.users.id) du Maître du Jeu
const MJ_UUID = "17b03a0a-f866-4d92-b668-f8c70884b8b1";

let currentUser = null;
let isSignUpMode = false;
let profiles = [];        // liste des comptes joueurs enregistrés {id,email}
let gameChannel = null;   // canal Realtime Supabase

/* ============================= PERMISSIONS ============================= */
function isMJ(){ return !!currentUser && currentUser.id === MJ_UUID; }
function isOwner(charId){ const c=char(charId); return !!c && !!currentUser && c.ownerId===currentUser.id; }
function canControlChar(charId){ return isMJ() || isOwner(charId); }
function canControlInstance(instId){ const i=inst(instId); return i ? canControlChar(i.charId) : false; }

/* ============================= AUTH SUPABASE ============================= */
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('authOverlay').style.display = 'none';
    initApp();
  }
});

function toggleAuthMode(signUp) {
  isSignUpMode = signUp;
  document.getElementById('authDesc').textContent = signUp ? "Créez votre compte de joueur" : "Connectez-vous pour rejoindre la table de jeu";
  document.getElementById('authBtn').textContent = signUp ? "S'inscrire" : "Se connecter";
  document.getElementById('authToggleMode').innerHTML = signUp ?
    `Déjà un compte ? <button onclick="toggleAuthMode(false)">Se connecter</button>` :
    `Pas de compte ? <button onclick="toggleAuthMode(true)">Créer un compte</button>`;
}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { toast("⚠️ Veuillez remplir tous les champs."); return; }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = "Chargement...";

  if (isSignUpMode) {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; toggleAuthMode(true); return; }
    toast("✅ Compte créé ! Connexion en cours...");
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { toast("❌ Erreur : " + error.message); btn.disabled = false; btn.textContent = isSignUpMode ? "S'inscrire" : "Se connecter"; return; }

  currentUser = data.user;
  document.getElementById('authOverlay').style.display = 'none';
  await initApp();
}

async function logout(){
  if(gameChannel){ supabaseClient.removeChannel(gameChannel); gameChannel=null; }
  await supabaseClient.auth.signOut();
  currentUser=null;
  document.getElementById('authOverlay').style.display='flex';
  toggleAuthMode(false);
}

function normalizeState(){
  if(!S.instances)S.instances=[];
  if(!S.chat)S.chat=[];
  if(!S.map)S.map=structuredClone(DEFAULT.map);
  if(S.map.backgroundImage===undefined)S.map.backgroundImage=null;
  if(!S.combat)S.combat=structuredClone(DEFAULT.combat);
  if(S.freeMovement===undefined)S.freeMovement=false;
  if(!S.characters)S.characters=[];
  if(!S.abilities)S.abilities=[];
  if(!S.characterCategories)S.characterCategories=[];
  if(!S.notes)S.notes=[];
  if(!S.noteCategories)S.noteCategories=[];
  S.notes.forEach(n=>{ if(n.categoryId===undefined)n.categoryId=null; });
  if(S.notesReveal===undefined)S.notesReveal=null;
  S.instances.forEach(t=>{
    if(t.px===undefined)t.px=null;
    if(t.py===undefined)t.py=null;
    if(t.sizeW===undefined)t.sizeW=1;
    if(t.sizeH===undefined)t.sizeH=1;
  });
  S.characters.forEach(c=>{
    if(!c.res)c.res={};
    if(c.res.Gel!==undefined&&c.res.Glace===undefined){c.res.Glace=c.res.Gel;}
    delete c.res.Gel;
    ELEMENT_RES_KEYS.forEach(k=>{if(c.res[k]===undefined)c.res[k]=0;});
    if(c.hidden===undefined)c.hidden=(c.type==='enemy');
    if(c.ownerId===undefined)c.ownerId=null;
    if(c.categoryId===undefined)c.categoryId=null;
    if(c.iconImage===undefined)c.iconImage=null;
    if(!c.stats)c.stats={};
    if(c.stats.Constitution===undefined)c.stats.Constitution=Math.max(1,Math.ceil((c.resourcesMax?.Vie||1)/2.5));
    ['Endurance','Social','Artisanat'].forEach(k=>{if(c.stats[k]===undefined)c.stats[k]=0;});
    if(c.profileImage===undefined)c.profileImage=null;
    if(c.bio===undefined)c.bio='';
    if(c.inventory===undefined)c.inventory='';
    if(!Array.isArray(c.transformationIds))c.transformationIds=[];
    if(c.type==='player'){
      if(!c.equipmentSlots)c.equipmentSlots={};
      EQUIP_SLOTS.forEach(([k])=>{if(c.equipmentSlots[k]===undefined)c.equipmentSlots[k]=null;});
    }
  });
  if(!S.equipment)S.equipment=[];
  S.equipment.forEach(e=>{
    if(!e.res)e.res={};
    ELEMENT_RES_KEYS.forEach(k=>{if(e.res[k]===undefined)e.res[k]=0;});
    if(e.iconImage===undefined)e.iconImage=null;
    if(e.image===undefined)e.image=null;
    if(e.ca===undefined)e.ca=0;
    if(e.dm===undefined)e.dm=0;
    if(e.itemType===undefined)e.itemType='armor';
    if(e.category===undefined)e.category=e.itemType==='weapon'?'arme':'torse';
    if(e.damageFormula===undefined)e.damageFormula='';
    if(e.weaponStat===undefined)e.weaponStat='Force';
  });
  S.abilities.forEach(a=>{
    if(a.element==='Gel')a.element='Glace';
    if(a.iconImage===undefined)a.iconImage=null;
  });
}

async function loadProfiles(){

async function loadGameState(){
  try{

    if(error) throw error;
    if(data && data.data){ S=data.data; }
    else { S=structuredClone(DEFAULT); await persistState(); }
  }catch(e){
    console.error('loadGameState', e);
    toast('⚠️ Impossible de charger la partie en ligne, utilisation de la sauvegarde locale.');
    S=JSON.parse(localStorage.getItem('arcanum-vtt')||'null')||structuredClone(DEFAULT);
  }
  normalizeState();
  syncTurnSelection();
  lastShownNotesReveal=S.notesReveal?S.notesReveal.ts:null;
}
let undoStack=[];
function pushUndoCheckpoint(){
  try{ undoStack.push(JSON.stringify(S)); if(undoStack.length>20)undoStack.shift(); }catch(e){}
}
async function undoLast(){
  if(!isMJ()){toast('⛔ Seul le MJ peut annuler.');return;}
  if(undoStack.length<2){toast('⚠️ Rien à annuler.');return;}
  undoStack.pop();
  S=JSON.parse(undoStack[undoStack.length-1]);
  normalizeState();
  selectedToken=null; activeAbility=null; multiSel=[];
  await persistState(); render();
  toast('↺ Dernière modification annulée.');
}
async function persistState(){
  pushUndoCheckpoint();
  try{
    const { error } = await supabaseClient.from('game_state').upsert({id:'main',data:S,updated_at:new Date().toISOString()});
    if(error) console.error('persistState', error);
  }catch(e){ console.error('persistState', e); }
  localStorage.setItem('arcanum-vtt', JSON.stringify(S));
}
let lastTurnCombatant=null;
function syncTurnSelection(){
  if(!S.combat.active){ lastTurnCombatant=null; return; }
  const currentId=S.combat.order[S.combat.turn];
  if(currentId && currentId!==lastTurnCombatant){
    lastTurnCombatant=currentId;
    if(canControlInstance(currentId)) selectedToken=currentId;
  }
}
function subscribeRealtime(){
  if(gameChannel){ supabaseClient.removeChannel(gameChannel); gameChannel=null; }
  gameChannel=supabaseClient.channel('game_state_sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'game_state',filter:'id=eq.main'},payload=>{
      if(payload.new && payload.new.data){
        S=payload.new.data;
        normalizeState();
        syncTurnSelection();
        render();
      }
    })
    .subscribe();
}

function rteFindTable(id){

    const t=el?.closest?.('table');
    if(t)return t;

/* Redimensionnement des colonnes (bord droit) et des lignes (bord bas) d'un tableau */
let rteResize=null;
document.addEventListener('mousedown',e=>{
  const td=e.target.closest('.rte-content td, .rte-content th'); if(!td)return;
  const rect=td.getBoundingClientRect();
  const nearRight=rect.right-e.clientX<=8, nearBottom=rect.bottom-e.clientY<=8;
  if(!nearRight&&!nearBottom)return;
  e.preventDefault();
  const table=td.closest('table');
  if(nearRight){rteResize={type:'col',table,cellIndex:td.cellIndex,startX:e.clientX,startSize:rect.width};}
  else{rteResize={type:'row',tr:td.closest('tr'),startY:e.clientY,startSize:rect.height};}
});
document.addEventListener('mousemove',e=>{
  if(rteResize){
    if(rteResize.type==='col'){
      const w=Math.max(30,rteResize.startSize+(e.clientX-rteResize.startX));
      rteResize.table.querySelectorAll('tr').forEach(tr=>{const c=tr.children[rteResize.cellIndex];if(c)c.style.width=w+'px';});
    }else{

});

function effectiveDef(c){
  if(!c)return {CA:0,DM:0,'CA naturelle':0};
  if(c.type!=='player')return {CA:c.def?.CA||0,DM:c.def?.DM||0,'CA naturelle':c.def?.['CA naturelle']||0};
  const nat=naturalRes(c);
  let ca=(c.def?.CA||0)+nat.ca, dm=(c.def?.DM||0)+nat.dm;
  if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e){ca+=e.ca||0;dm+=e.dm||0;}});}
  return {CA:ca,DM:dm,'CA naturelle':c.def?.['CA naturelle']||0};
}
function effectiveRes(c){
  if(!c)return {};
  const out={...(c.res||{})};
  ELEMENT_RES_KEYS.forEach(k=>{if(out[k]===undefined)out[k]=0;});
  if(c.type==='player'&&c.equipmentSlots){
    EQUIP_SLOTS.forEach(([k])=>{const e=equip(c.equipmentSlots[k]);if(e&&e.res){ELEMENT_RES_KEYS.forEach(rk=>{out[rk]=(out[rk]||0)+(e.res[rk]||0);});}});
  }
  return out;
}

function roll(expr){
  expr=String(expr).replace(/\s+/g,''); let bonus=0;
  const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
  const m=expr.match(/(\d*)d(\d+)/i); if(!m)return {total:(+expr||0)+bonus,rolls:[],bonus};
  const n=+(m[1]||1), sides=+m[2], rolls=[]; for(let i=0;i<n;i++)rolls.push(1+Math.floor(Math.random()*sides));
  return {total:rolls.reduce((a,x)=>a+x,0)+bonus,rolls,bonus};
}
function combineFormula(abilityFormula,weaponFormula){
  const parse=(expr)=>{
    expr=String(expr||'').replace(/\s+/g,'');
    let bonus=0; const b=expr.match(/([+-]\d+)$/); if(b){bonus=+b[1];expr=expr.slice(0,b.index);}
    const m=expr.match(/^(\d*)d(\d+)/i);
    if(!m)return {n:0,sides:20,bonus:bonus+(+expr||0)};
    return {n:+(m[1]||1),sides:+m[2],bonus};
  };
  const a=parse(abilityFormula), w=parse(weaponFormula);
  const n=a.n+w.n, sides=a.sides||w.sides||20, bonus=a.bonus+w.bonus;
  if(n<=0)return abilityFormula;
  return `${n}d${sides}${bonus?(bonus>0?'+':'')+bonus:''}`;
}
function outcome(d){
  if(d===100)return ['Échec ultime',0]; if(d>=95)return ['Échec critique',0]; if(d>=90)return ['Échec',0];
  if(d>=75)return ['Légère réussite',.5]; if(d>=50)return ['Légère réussite',.75]; if(d>=25)return ['Réussite',1];
  if(d>=5)return ['Grande réussite',1.5]; if(d>=2)return ['Réussite critique',2]; return ['Réussite ultime',4];
}

function isOccupied(x,y,excludeId){return S.instances.some(i=>i.id!==excludeId&&i.x===x&&i.y===y);}
function footprintOverlap(id,x,y,sw,sh){
  const x2=x+sw, y2=y+sh;
  if(x<0||y<0||x2>S.map.cols||y2>S.map.rows)return true;
  return S.instances.some(o=>{
    if(o.id===id)return false;
    const osw=o.sizeW||1, osh=o.sizeH||1, ox2=o.x+osw, oy2=o.y+osh;
    return x<ox2 && x2>o.x && y<oy2 && y2>o.y;
  });
}
function nearestCellCoord(rawPos,maxIndex){
  // rawPos est exprimé en unités de case (ex: 4.3 = case 4, proche du centre 4.5)
  if(Number.isInteger(rawPos)){
    // exactement sur la frontière entre deux cases -> tirage au sort parmi les cases valides adjacentes
    const candidates=[rawPos-1,rawPos].filter(v=>v>=0&&v<=maxIndex);
    if(!candidates.length)return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
    return candidates[Math.floor(Math.random()*candidates.length)];
  }
  return Math.max(0,Math.min(maxIndex,Math.floor(rawPos)));
}
function snapAllTokensToGrid(){
  S.instances.forEach(t=>{
    const rawX=(t.px!=null?t.px:t.x*S.map.cell+S.map.cell/2)/S.map.cell;
    const rawY=(t.py!=null?t.py:t.y*S.map.cell+S.map.cell/2)/S.map.cell;
    t.x=nearestCellCoord(rawX,S.map.cols-1);
    t.y=nearestCellCoord(rawY,S.map.rows-1);
    t.px=null; t.py=null;
  });
}
function toggleFreeMovement(){

  if(S.combat.active){toast('⛔ Indisponible pendant le combat.');return;}
  S.freeMovement=!S.freeMovement;
  if(!S.freeMovement){
    snapAllTokensToGrid();
    addLog('🎯 Le MJ a désactivé le placement libre — les tokens reviennent au centre des cases.');
  }else{
    addLog('🎯 Le MJ a activé le placement libre des tokens (hors grille, hors combat).');
  }
  saveState(); render();

function findFreeCell(x,y,excludeId){
  if(!isOccupied(x,y,excludeId))return [x,y];
  const maxR=Math.max(S.map.cols,S.map.rows);
  for(let r=1;r<=maxR;r++){
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=S.map.cols||ny>=S.map.rows)continue;
      if(!isOccupied(nx,ny,excludeId))return [nx,ny];
    }
  }
  return null;
}
function spawnInstance(charId,x,y){

  const newInst={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),charId,label,x,y,px:null,py:null,
    hp:rm.Vie||0,hpMax:rm.Vie||0,mana:rm.Mana||0,manaMax:rm.Mana||0,shield:rm.Bouclier||0,shieldMax:rm.Bouclier||0,
    remainingMove:t.move??6};

}

/* ============================= CHAT : COMMANDE /r ============================= */
function parseDiceExpr(raw){
  const expr=String(raw||'').replace(/\s+/g,'').toLowerCase();
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(expr))return null;
  const terms=[...expr.matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/g)];
  let totalDice=0;
  for(const t of terms){
    if(t[3]){const n=+(t[2]||1),s=+t[3];if(n<1||s<1||s>1000)return null;totalDice+=n;}
  }
  if(totalDice>50)return null;
  const parts=[]; let total=0;
  for(const t of terms){
    const sign=t[1]==='-'?-1:1;
    if(t[3]){
      const n=+(t[2]||1),sides=+t[3];
      const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));
      const sum=rolls.reduce((a,x)=>a+x,0);
      total+=sign*sum;
      parts.push({label:`${sign<0?'−':''}${n}d${sides}`,rolls,sum:sign*sum});
    }else{
      const v=sign*(+t[4]); total+=v; parts.push({label:null,rolls:null,sum:v});
    }
  }
  return {expr,parts,total};
}
function sendChat(){
  if(!currentUser)return;
  const text=(document.getElementById('chat_input')?.value||chatDraft||'').trim();
  if(!text)return;
  const name=esc(myDisplayName());
  const m=text.match(/^\/r(?:\s+(.*))?$/i);
  if(m){
    const r=parseDiceExpr(m[1]);
    if(!r){toast('⚠️ Syntaxe : /r d100, /r 2d20+5 (max 50 dés, d1000).');return;}
    const lines=r.parts.map(p=>p.rolls
      ?`🎲 ${p.label} : ${p.rolls.join(' + ')}${p.rolls.length>1?` = ${Math.abs(p.sum)}`:''}`
      :`➕ Bonus : ${p.sum>0?'+':''}${p.sum}`);
    addLog(`🎲 <b>${name}</b> — /r ${esc(r.expr)}<br>${lines.join('<br>')}<br>🎯 Total : <b>${r.total}</b>`);
  }else if(text.startsWith('/')){
    toast('⚠️ Commande inconnue. Utilise /r [expression].');return;
  }else{
    addLog(`💬 <b>${name}</b> : ${esc(text)}`);
  }
  chatDraft='';
  persistState(); render();
  document.getElementById('chat_input')?.focus();
}

/* ============================= MULTISÉLECTION (MJ, hors combat) ============================= */
function moveGroupTo(cx,cy){
  const d=dragCandidate,g=d.group,cell=S.map.cell;
  const setEl=(id,x,y)=>{const el=document.querySelector(`[data-token="${id}"]`);if(el){el.style.left=x+'px';el.style.top=y+'px';}};
  if(S.freeMovement){
    const [fx,fy]=mapPixelPoint(cx,cy);
    const W=S.map.cols*cell,H=S.map.rows*cell;
    const dx=Math.max(-Math.min(...g.map(o=>o.px)),Math.min(W-Math.max(...g.map(o=>o.px)),fx-d.startPix[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.py)),Math.min(H-Math.max(...g.map(o=>o.py)),fy-d.startPix[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.px=o.px+dx; t.py=o.py+dy;
      t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(t.px/cell)));
      t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(t.py/cell)));
      setEl(o.id,t.px,t.py);
    });
  }else{
    const pt=mapPoint(cx,cy);
    const dx=Math.max(-Math.min(...g.map(o=>o.x)),Math.min(S.map.cols-1-Math.max(...g.map(o=>o.x)),pt[0]-d.startCell[0]));
    const dy=Math.max(-Math.min(...g.map(o=>o.y)),Math.min(S.map.rows-1-Math.max(...g.map(o=>o.y)),pt[1]-d.startCell[1]));
    g.forEach(o=>{
      const t=inst(o.id); if(!t)return;
      t.x=o.x+dx; t.y=o.y+dy;
      setEl(o.id,t.x*cell+cell/2,t.y*cell+cell/2);
    });
  }
}
function finishGroupDrag(){
  const d=dragCandidate; dragCandidate=null;
  const g=d.group;
  if(!d.moved){selectedToken=d.id;multiSel=[];render();return;}
  let changed=true;
  if(!S.freeMovement){
    const ids=g.map(o=>o.id);
    const blocker=S.instances.find(i=>!ids.includes(i.id)&&g.some(o=>{const t=inst(o.id);return t&&t.x===i.x&&t.y===i.y;}));
    if(blocker){
      g.forEach(o=>{const t=inst(o.id);if(t){t.x=o.x;t.y=o.y;}});
      toast(`🚫 ${blocker.label} bloque le déplacement du groupe — annulé.`);
      changed=false;
    }
  }
  if(changed){addLog(`↦ Le MJ déplace ${g.length} tokens.`);saveState();}
  render();
}
function finishSelBox(){
  const b=selBox; selBox=null;
  document.getElementById('selRect')?.remove();
  if(!b.moved){
    if(selectedToken||multiSel.length){selectedToken=null;multiSel=[];render();}
    return;
  }
  const wrap=document.getElementById('mapWrap'); if(!wrap)return;
  const r=wrap.getBoundingClientRect(),cell=S.map.cell;
  const toPix=(cx,cy)=>[(cx-r.left-mapPan.x)/mapZoom,(cy-r.top-mapPan.y)/mapZoom];
  const [ax,ay]=toPix(b.startX,b.startY),[bx,by]=toPix(b.curX,b.curY);
  const x1=Math.min(ax,bx),x2=Math.max(ax,bx),y1=Math.min(ay,by),y2=Math.max(ay,by);
  const ids=S.instances.filter(t=>{
    const cx=(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2;
    const cy=(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2;
    return cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2;
  }).map(t=>t.id);
  if(ids.length===1){selectedToken=ids[0];multiSel=[];}
  else{selectedToken=null;multiSel=ids;}
  render();
}

/* ============================= COMBAT (MJ uniquement) ============================= */
function startCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut démarrer le combat.');return;}
  const ids=S.instances.map(i=>i.id);
  if(!ids.length){toast('Aucun token sur la carte.');return;}
  if(S.freeMovement){
    S.freeMovement=false;
    snapAllTokensToGrid();
    addLog('🎯 Placement libre désactivé automatiquement pour le début du combat — les tokens reviennent au centre des cases.');
  }
  const init={};
  ids.forEach(id=>{const tpl=instTemplate(inst(id));init[id]=roll('1d20').total+(tpl?.stats?.Vitesse||0);});
  const groups={}; ids.forEach(id=>(groups[init[id]]??=[]).push(id));
  Object.values(groups).forEach(group=>{
    if(group.length>1){
      const rolled=group.map(id=>({id,r:roll('1d100').total})).sort((a,b)=>b.r-a.r);
      rolled.forEach((x,i)=>{init[x.id]+=(rolled.length-i)/1000;});
    }
  });
  const order=[...ids].sort((a,b)=>init[b]-init[a]);
  S.combat={active:true,order,turn:0,initiatives:Object.fromEntries(order.map(id=>[id,Math.floor(init[id])]))};
  S.instances.forEach(t=>{const tpl=instTemplate(t);t.remainingMove=tpl?.move??6;});
  lastTurnCombatant=order[0]||null;
  if(order[0]&&canControlInstance(order[0]))selectedToken=order[0];
  addLog('⚔ <b>Combat démarré</b> — initiative : '+order.map(id=>`${esc(inst(id).label)} (${S.combat.initiatives[id]})`).join(', ')+'.');
  saveState(); render();
}
function endCombat(){
  if(!isMJ()){toast('⛔ Seul le MJ peut terminer le combat.');return;}
  S.combat={active:false,order:[],turn:0,initiatives:{}};
  lastTurnCombatant=null;
  addLog('⏹ Fin du combat.');
  saveState(); render();
}
function advanceTurn(){
  if(!S.combat.active||!S.combat.order.length)return;
  S.combat.turn=(S.combat.turn+1)%S.combat.order.length;
  const nt=inst(S.combat.order[S.combat.turn]);
  if(nt){const tpl=instTemplate(nt);nt.remainingMove=tpl?.move??6;}
  lastTurnCombatant=S.combat.order[S.combat.turn];
  if(canControlInstance(lastTurnCombatant))selectedToken=lastTurnCombatant;
}
function nextTurn(){
  if(!isMJ()){toast('⛔ Seul le MJ peut avancer le tour.');return;}
  advanceTurn();saveState();render();
}

/* ============================= CARTE : SÉLECTION / DRAG / PAN / ZOOM ============================= */
function mapPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const x=(clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom);
  const y=(clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom);
  return [Math.max(0,Math.min(S.map.cols-1,Math.floor(x))),Math.max(0,Math.min(S.map.rows-1,Math.floor(y)))];
}
function mapPixelPoint(clientX,clientY){
  const wrap=document.getElementById('mapWrap'); const rect=wrap.getBoundingClientRect();
  const fx=(clientX-rect.left-mapPan.x)/mapZoom;
  const fy=(clientY-rect.top-mapPan.y)/mapZoom;
  return [Math.max(0,Math.min(S.map.cols*S.map.cell,fx)),Math.max(0,Math.min(S.map.rows*S.map.cell,fy))];
}
function applyMapTransform(){const map=document.getElementById('map');if(map)map.style.transform=`translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom})`;}

function setupMapInteractions(){
  const wrap=document.getElementById('mapWrap'); const map=document.getElementById('map');
  if(!wrap||!map)return;
  const hint=document.getElementById('mapDropHint');

  wrap.ondragover=e=>{e.preventDefault();hint?.classList.add('show');};
  wrap.ondragleave=()=>hint?.classList.remove('show');
  wrap.ondrop=e=>{
    e.preventDefault(); hint?.classList.remove('show');
    if(!isMJ()){toast('⛔ Seul le MJ peut modifier la carte ou ajouter des tokens.');return;}

    // Cas 1 : image glissée directement depuis l'ordinateur
    if(e.dataTransfer.files && e.dataTransfer.files.length>0){
      const file=e.dataTransfer.files[0];
      if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){
        toast('⚠️ Format non supporté — utilise une image PNG, JPG ou WebP.');
        return;
      }
      handleMapImageFile(file);
      return;
    }

    const data=e.dataTransfer.getData('text/plain');

    // Cas 2 : carte déjà envoyée, réutilisée depuis l'onglet 🗺️ Cartes
    if(data && data.startsWith('map:')){
      handleMapImageUrl(data.slice(4));
      return;
    }

    // Cas 3 : personnage / monstre glissé depuis la bibliothèque
    const charId=data; const tpl=char(charId); if(!tpl)return;
    const pt=mapPoint(e.clientX,e.clientY);
    const free=findFreeCell(pt[0],pt[1]);
    if(!free){toast('🚫 Plus aucune case libre sur la carte.');return;}
    const created=spawnInstance(charId,free[0],free[1]);
    if(created){
      selectedToken=created.id;
      addLog(`➕ ${esc(created.label)} apparaît sur la carte.`);
      if(free[0]!==pt[0]||free[1]!==pt[1])toast(`⚠️ Case occupée — ${created.label} placé sur la case libre la plus proche.`);
    }
    saveState(); render();
  };
  wrap.oncontextmenu=e=>e.preventDefault();

  wrap.onmousedown=e=>{
    if(e.button===2){
      panState={startX:e.clientX,startY:e.clientY,origX:mapPan.x,origY:mapPan.y};
      wrap.classList.add('panning'); e.preventDefault(); return;
    }
    if(e.button!==0)return;
    const tw=e.target.closest('.token-wrap');
    if(tw){
      e.stopPropagation();
      const id=tw.dataset.token;
      if(activeAbility){
        const a=S.abilities.find(x=>x.id===activeAbility); const t=inst(id);
        if(a&&t)resolveAbility(a,[t.x,t.y],id);
        return;
      }
      if(isMJ()&&!S.combat.active&&multiSel.length>1&&multiSel.includes(id)){
        const cell=S.map.cell;
        dragCandidate={id,group:multiSel.map(i=>{const t=inst(i);return {id:i,x:t.x,y:t.y,px:(S.freeMovement&&t.px!=null)?t.px:t.x*cell+cell/2,py:(S.freeMovement&&t.py!=null)?t.py:t.y*cell+cell/2};}),startX:e.clientX,startY:e.clientY,startCell:mapPoint(e.clientX,e.clientY),startPix:mapPixelPoint(e.clientX,e.clientY),moved:false};
        return;
      }
      selectedToken=id; multiSel=[];
      if(!canControlInstance(id)){
        render(); return; // vue seule : ce token ne t'appartient pas
      }
      if(S.combat.active&&S.combat.order[S.combat.turn]!==id){
        toast('⏳ Ce n’est pas le tour de ce personnage.'); render(); return;
      }
      const c=inst(id);
      dragCandidate={id,startX:e.clientX,startY:e.clientY,origX:c.x,origY:c.y,moved:false};
      render(); return;
    }
    if(activeAbility){
      const pt=mapPoint(e.clientX,e.clientY);
      const a=S.abilities.find(x=>x.id===activeAbility);
      if(a)resolveAbility(a,pt);
      return;
    }
    if(isMJ()&&!S.combat.active){
      selBox={startX:e.clientX,startY:e.clientY,curX:e.clientX,curY:e.clientY,moved:false};
      return;
    }
    if(selectedToken||multiSel.length){selectedToken=null;multiSel=[];render();}
  };

  window.onmousemove=e=>{
    if(tokenResizeState){
      const cell=S.map.cell;
      const delta=Math.round(((e.clientX-tokenResizeState.startX)+(e.clientY-tokenResizeState.startY))/2/(cell*mapZoom));
      const newSize=Math.max(1,tokenResizeState.startSize+delta);
      tokenResizeState.previewSize=newSize;
      const el=document.querySelector(`[data-token="${tokenResizeState.id}"] .token`);
      if(el){el.style.width=(newSize*cell)+'px';el.style.height=(newSize*cell)+'px';}
      return;
    }
    if(selBox){
      selBox.curX=e.clientX; selBox.curY=e.clientY;
      if(!selBox.moved&&Math.hypot(e.clientX-selBox.startX,e.clientY-selBox.startY)<4)return;
      selBox.moved=true;
      const w=document.getElementById('mapWrap'); if(!w)return;
      const wr=w.getBoundingClientRect();
      let el=document.getElementById('selRect');
      if(!el){el=document.createElement('div');el.id='selRect';el.className='sel-rect';w.appendChild(el);}
      el.style.left=(Math.min(selBox.startX,e.clientX)-wr.left)+'px';
      el.style.top=(Math.min(selBox.startY,e.clientY)-wr.top)+'px';
      el.style.width=Math.abs(e.clientX-selBox.startX)+'px';
      el.style.height=Math.abs(e.clientY-selBox.startY)+'px';
      return;
    }
    if(panState){
      mapPan.x=panState.origX+(e.clientX-panState.startX);
      mapPan.y=panState.origY+(e.clientY-panState.startY);
      applyMapTransform(); return;
    }
    if(dragCandidate){
      const dx=e.clientX-dragCandidate.startX, dy=e.clientY-dragCandidate.startY;
      if(!dragCandidate.moved&&Math.hypot(dx,dy)<4)return;
      dragCandidate.moved=true;
      if(dragCandidate.group){moveGroupTo(e.clientX,e.clientY);return;}
      const t=inst(dragCandidate.id);
      if(t){
        const el=document.querySelector(`[data-token="${dragCandidate.id}"]`);
        if(S.freeMovement){
          const [fx,fy]=mapPixelPoint(e.clientX,e.clientY);
          t.px=fx; t.py=fy;
          t.x=Math.max(0,Math.min(S.map.cols-1,Math.floor(fx/S.map.cell)));
          t.y=Math.max(0,Math.min(S.map.rows-1,Math.floor(fy/S.map.cell)));
          if(el){el.style.left=fx+'px';el.style.top=fy+'px';}
        }else{
          const pt=mapPoint(e.clientX,e.clientY);
          t.x=pt[0]; t.y=pt[1];
          if(el){el.style.left=(pt[0]*S.map.cell+S.map.cell/2)+'px';el.style.top=(pt[1]*S.map.cell+S.map.cell/2)+'px';}
        }
      }
      return;
    }
    if(activeAbility){
      const rect=wrap.getBoundingClientRect();
      const x=Math.floor((e.clientX-rect.left-mapPan.x)/(S.map.cell*mapZoom));
      const y=Math.floor((e.clientY-rect.top-mapPan.y)/(S.map.cell*mapZoom));
      if(x>=0&&y>=0&&x<S.map.cols&&y<S.map.rows){hoverCell=[x,y];updateZonePreview();}
    }
  };

  window.onmouseup=()=>{
    if(tokenResizeState){
      const {id,previewSize,origSizeW}=tokenResizeState;
      const t=inst(id);
      if(t&&previewSize&&previewSize!==origSizeW){
        if(footprintOverlap(id,t.x,t.y,previewSize,previewSize)){
          toast('🚫 Redimensionnement annulé — chevauche un autre token ou dépasse la carte.');
        }else{
          t.sizeW=previewSize; t.sizeH=previewSize;
          addLog(`↔ ${esc(t.label)} redimensionné (${previewSize}×${previewSize} cases).`);
          saveState();
        }
      }
      tokenResizeState=null;
      render();
      return;
    }
    if(selBox)finishSelBox();
    if(dragCandidate&&dragCandidate.group)finishGroupDrag();
    if(panState){panState=null;wrap.classList.remove('panning');}
    if(dragCandidate){
      const {id,moved,origX,origY}=dragCandidate;
      const t=inst(id);
      if(moved&&t){
        if(S.freeMovement){
          addLog(`↦ ${esc(t.label)} déplacé librement sur la carte.`);
        }else{
          const occupant=S.instances.find(i=>i.id!==id&&i.x===t.x&&i.y===t.y);
          if(occupant){
            t.x=origX; t.y=origY;
            toast(`🚫 ${occupant.label} est déjà sur cette case — choisis un autre déplacement.`);
          }else if(S.combat.active&&S.combat.order[S.combat.turn]===id){
            const tpl=instTemplate(t);
            const dist=Math.abs(t.x-origX)+Math.abs(t.y-origY);
            const remaining=t.remainingMove??(tpl?.move??6);
            if(dist>remaining){
              t.x=origX; t.y=origY;
              toast('🚫 Déplacement maximal atteint pour ce tour.');
            }else{
              t.remainingMove=remaining-dist;
              addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
            }
          }else if(!S.combat.active){
            addLog(`↦ ${esc(t.label)} se déplace vers (${t.x+1}, ${t.y+1}).`);
          }
        }
        saveState();
      }
      dragCandidate=null; render();
    }
  };

  wrap.onwheel=e=>{
    e.preventDefault();
    const old=mapZoom;
    mapZoom=Math.max(.4,Math.min(3,mapZoom+(e.deltaY<0?.1:-.1)));
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    mapPan.x=mx-(mx-mapPan.x)*(mapZoom/old);
    mapPan.y=my-(my-mapPan.y)*(mapZoom/old);
    applyMapTransform();
  };

  applyMapTransform();
}

/* ============================= CAPACITÉS : RÉSOLUTION ============================= */
function affected(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  const casterTpl=casterInst?instTemplate(casterInst):null;
  const casterType=casterTpl?.type||'player';
  const isSupport=(a.type==='Soin'||a.type==='Bouclier'||a.type==='Potion');

  if(a.area==='single'){
    const targetType=isSupport?casterType:(casterType==='enemy'?'player':'enemy');
    if(explicitTargetInstId){
      const t=inst(explicitTargetInstId);
      if(!t)return [];
      // Les sorts de soutien peuvent cibler le lanceur lui-même ; les sorts offensifs non.
      if(!isSupport&&t.id===selectedToken)return [];
      return instTemplate(t)?.type===targetType?[t]:[];
    }
    const pool=S.instances.filter(i=>(isSupport||i.id!==selectedToken)&&instTemplate(i)?.type===targetType);
    let best=null,bestd=999;
    for(const t of pool){const d=Math.abs(t.x-start[0])+Math.abs(t.y-start[1]);if(d<bestd){best=t;bestd=d;}}
    return best?[best]:[];
  }

  // Zone (carré / cercle)
  const size=a.areaSize||3;
  const inZone=t=>t.x>=start[0]&&t.x<start[0]+size&&t.y>=start[1]&&t.y<start[1]+size;
  if(isSupport){
    // Soin / Bouclier / Potion en zone : uniquement les alliés, lanceur inclus.
    return S.instances.filter(t=>instTemplate(t)?.type===casterType&&inZone(t));
  }
  // Sorts de dégâts en zone : touchent tout le monde, alliés comme ennemis (y compris le lanceur).
  return S.instances.filter(inZone);
}
function resolveAbility(a,start,explicitTargetInstId){
  const casterInst=selectedToken?inst(selectedToken):null;
  if(!casterInst){toast('Sélectionne d’abord un personnage.');return;}
  if(!canControlInstance(casterInst.id)){
    toast('⛔ Vous ne contrôlez pas ce personnage.');
    activeAbility=null; hoverCell=null; render(); return;
  }
  if(a.manaCost>0&&(casterInst.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${casterInst.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    activeAbility=null; hoverCell=null; render(); return;
  }
  if(a.range&&a.range>0){
    const dist=Math.max(Math.abs(start[0]-casterInst.x),Math.abs(start[1]-casterInst.y));
    if(dist>a.range){
      toast(`🚫 Trop loin (portée max ${a.range} case${a.range>1?'s':''}) — sélectionne un ennemi plus proche.`);
      return;
    }
  }
  const casterTpl=instTemplate(casterInst);
  if(a.manaCost>0){
    casterInst.mana=Math.max(0,casterInst.mana-a.manaCost);
  }
  let weaponFormula=null, weaponUsed=null;
  if(casterTpl?.type==='player'&&casterTpl.equipmentSlots){
    const w=equip(casterTpl.equipmentSlots['arme']);
    if(w&&w.itemType==='weapon'&&w.damageFormula&&(w.weaponStat||'Force')===a.stat){weaponUsed=w;weaponFormula=w.damageFormula;}
  }
  const atkRoll=roll('1d100'); const atk=atkRoll.total; const [label,mult]=outcome(atk);
  const targets=affected(a,start,explicitTargetInstId);
  const lines=[`⚔ <b>${esc(casterInst.label)}</b> lance <b>${esc(a.name)}</b>`];
  if(a.manaCost>0)lines.push(`💧 Coût en mana : ${a.manaCost} (reste ${casterInst.mana}/${casterInst.manaMax})`);
  lines.push(`🎲 d100 : <b>${atk}</b> → ${label}`);

  if(!targets.length){
    lines.push('<span class="muted">Aucune cible valide dans la zone.</span>');
    addLog(lines.join('<br>'));
    activeAbility=null; hoverCell=null; saveState(); render(); return;
  }

  for(const t of targets){
    const tTpl=instTemplate(t);
    if(a.type==='Soin'){
      const r=roll(a.formula);
      const amount=Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100);
      t.hp=Math.min(t.hpMax,t.hp+amount);
      lines.push(`🎲 ${esc(a.formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
      lines.push(`💚 Soin : ${amount}`);
      lines.push(`❤️ ${esc(t.label)} : +${amount} PV (${t.hp}/${t.hpMax})`);
      continue;
    }
    if(a.type==='Bouclier'){
      const r=roll(a.formula);
      const amount=Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100);
      t.shield=(t.shield||0)+amount;
      if(t.shield>t.shieldMax)t.shieldMax=t.shield;
      lines.push(`🎲 ${esc(a.formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
      lines.push(`🛡 Bouclier accordé : ${amount}`);
      lines.push(`🛡 ${esc(t.label)} : ${t.shield}/${t.shieldMax}`);
      continue;
    }
    if(a.type==='Potion'){
      const r=roll(a.formula);
      const amount=Math.ceil(r.total*mult*(casterTpl.stats[a.stat]||0)/100);
      lines.push(`🎲 ${esc(a.formula)} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${r.total}`);
      if(a.resource==='Mana'){
        t.mana=Math.min(t.manaMax,t.mana+amount);
        lines.push(`🧪 Mana restauré : ${amount}`);
        lines.push(`💧 ${esc(t.label)} : +${amount} Mana (${t.mana}/${t.manaMax})`);
      }else{
        t.hp=Math.min(t.hpMax,t.hp+amount);
        lines.push(`🧪 PV restaurés : ${amount}`);
        lines.push(`❤️ ${esc(t.label)} : +${amount} PV (${t.hp}/${t.hpMax})`);
      }
      continue;
    }
    if(mult===0){lines.push(`${esc(t.label)} n'est pas touché·e.`);continue;}
    const usedFormula=weaponFormula?combineFormula(a.formula,weaponFormula):a.formula;
    const r=roll(usedFormula); const raw=r.total;
    let damage=Math.ceil(raw*mult*(casterTpl.stats[a.stat]||0)/100);
    const def=(a.defense!=='none')?(effectiveDef(tTpl)[a.defense]||0):0;
    damage=Math.max(0,damage-def);
    const resist=(effectiveRes(tTpl)[a.element]||0)/100;
    damage=Math.max(0,Math.ceil(damage*(1-resist)));
    const beforeShield=t.shield||0; const absorbed=Math.min(beforeShield,damage);
    t.shield-=absorbed; const hpDamage=damage-absorbed;
    t.hp=Math.max(0,t.hp-hpDamage);
    lines.push(`🎲 ${esc(usedFormula)}${weaponUsed?` (${esc(a.formula)} + arme « ${esc(weaponUsed.name)} » ${esc(weaponFormula)})`:''} : ${r.rolls.join(' + ')}${r.bonus?` + ${r.bonus}`:''} = ${raw}`);
    lines.push(`✨ Dégâts (${esc(a.element)}) : ${damage}${def?` (−${def} défense)`:''}${resist?` (résistance ${Math.round(resist*100)}%)`:''}`);
    if(absorbed>0)lines.push(`🛡 Bouclier : ${absorbed} absorbé(s)`);
    lines.push(`❤️ ${esc(t.label)} : -${hpDamage} PV (${t.hp}/${t.hpMax})`);
    if(t.hp<=0){
      lines.push(`💀 <b>${esc(t.label)} est KO</b> — retiré de la carte.`);
      removeInstance(t.id);
    }
  }

  addLog(lines.join('<br>'));
  activeAbility=null; hoverCell=null;
  if(S.combat.active&&S.combat.order[S.combat.turn]===casterInst.id)advanceTurn();
  saveState(); render();
}
function startAbility(id){
  if(!selectedToken){toast('Sélectionne d’abord un personnage sur la carte.');return;}
  if(!canControlInstance(selectedToken)){toast('⛔ Vous ne contrôlez pas ce personnage.');return;}
  if(S.combat.active&&S.combat.order[S.combat.turn]!==selectedToken){toast('⏳ Ce n’est pas le tour de ce personnage.');return;}
  const a=S.abilities.find(x=>x.id===id); if(!a)return;
  const caster=inst(selectedToken);
  if(a.manaCost>0&&caster&&(caster.mana||0)<a.manaCost){
    toast(`🚫 Mana insuffisant (${caster.mana}/${a.manaCost}) pour lancer ${a.name} — choisis une autre action.`);
    return;
  }
  activeAbility=id; hoverCell=null; render();
  toast('🎯 Ciblage : clique sur une cible ou une case (Échap pour annuler)');
}

function saveCharacter(id){
  if(!isMJ()){toast('⛔ Seul le MJ peut créer ou modifier les fiches.');return;}
  const c=id?char(id):{id:'c'+Date.now()};
  c.name=document.getElementById('c_name').value||'Sans nom';
  c.icon=document.getElementById('c_icon').value||'🧙';
  c.iconImage=document.getElementById('c_iconimage').value.trim()||null;
  c.type=document.getElementById('c_type').value;
  c.move=parseNum(document.getElementById('c_move').value)||6;
  c.ownerId=document.getElementById('c_owner').value||null;
  c.categoryId=document.getElementById('c_category').value||null;
  c.hidden=document.getElementById('c_hidden').value==='true';
  c.profileImage=document.getElementById('c_profileimage').value.trim()||null;
  c.bio=rteHtml('c_bio');
  c.inventory=rteHtml('c_inventory');
  c.transformationIds=[...document.querySelectorAll('.tf-check:checked')].map(el=>el.value);
  c.resourcesMax={Vie:maxHpFromCon(document.getElementById('s_con').value),Mana:parseNum(document.getElementById('c_manamax').value),Bouclier:parseNum(document.getElementById('c_shieldmax').value)};
  c.stats={...(c.stats||{}),Constitution:parseNum(document.getElementById('s_con').value),Endurance:parseNum(document.getElementById('s_end').value),Social:parseNum(document.getElementById('s_soc').value),Artisanat:parseNum(document.getElementById('s_craft').value),Force:parseNum(document.getElementById('s_force').value),Magie:parseNum(document.getElementById('s_magic').value),Agilité:parseNum(document.getElementById('s_agi').value),Vitesse:parseNum(document.getElementById('s_speed').value)};
  c.def={CA:parseNum(document.getElementById('d_ca').value),DM:parseNum(document.getElementById('d_dm').value),'CA naturelle':parseNum(document.getElementById('d_ca').value)};
  c.res={
    Feu:parseNum(document.getElementById('r_fire').value),
    Eau:parseNum(document.getElementById('r_eau').value),
    Terre:parseNum(document.getElementById('r_terre').value),
    Air:parseNum(document.getElementById('r_air').value),
    Glace:parseNum(document.getElementById('r_glace').value),
    Foudre:parseNum(document.getElementById('r_foudre').value),
    Lumière:parseNum(document.getElementById('r_lumiere').value),
    Ténèbres:parseNum(document.getElementById('r_tenebres').value)
  };
  if(c.type==='player'){
    c.equipmentSlots=c.equipmentSlots||{};
    EQUIP_SLOTS.forEach(([k])=>{const el=document.getElementById('eqslot_'+k);if(el)c.equipmentSlots[k]=el.value||null;});
  }
  if(!id)S.characters.push(c);
  S.instances.filter(i=>i.charId===c.id).forEach(i=>{
    i.hpMax=c.resourcesMax.Vie; i.manaMax=c.resourcesMax.Mana; i.shieldMax=c.resourcesMax.Bouclier;
    i.hp=Math.min(i.hp,i.hpMax); i.mana=Math.min(i.mana,i.manaMax); i.shield=Math.min(i.shield,i.shieldMax);
    document.querySelectorAll(`#modal input[data-inst="${i.id}"][data-dirty="1"]`).forEach(el=>{
      const v=Math.round(parseNum(el.value));
      if(el.dataset.field==='hp')i.hp=Math.max(0,Math.min(i.hpMax,v));
      else i.mana=Math.max(0,Math.min(i.manaMax,v));
    });
    if(i.hp<=0){addLog(`💀 <b>${esc(i.label)}</b> tombe à 0 PV — retiré de la carte.`);removeInstance(i.id);}
  });
  saveState(); closeModal(); render();
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');const m=document.getElementById('modal');m.classList.remove('modal-fullscreen');m.classList.remove('note-focus-mode');noteFocusMode=false;m.style.position='';m.style.left='';m.style.top='';m.style.margin='';}
/* Déplacer / agrandir la fenêtre modale à la souris */
let modalDrag=null;
document.addEventListener('mousedown',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  const modal=document.getElementById('modal');
  if(modal.classList.contains('modal-fullscreen'))return;
  const rect=modal.getBoundingClientRect();
  modal.style.position='fixed'; modal.style.left=rect.left+'px'; modal.style.top=rect.top+'px'; modal.style.margin='0';
  modalDrag={startX:e.clientX,startY:e.clientY,origLeft:rect.left,origTop:rect.top};
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!modalDrag)return;
  const modal=document.getElementById('modal');
  modal.style.left=(modalDrag.origLeft+(e.clientX-modalDrag.startX))+'px';
  modal.style.top=(modalDrag.origTop+(e.clientY-modalDrag.startY))+'px';
});
document.addEventListener('mouseup',()=>{modalDrag=null;});
document.addEventListener('dblclick',e=>{
  const header=e.target.closest('#modal .modal-header');
  if(!header||e.target.closest('button'))return;
  document.getElementById('modal').classList.toggle('modal-fullscreen');
});

  if(q)items=items.filter(e=>e.name.toLowerCase().includes(q));
  if(equipCategoryFilter)items=items.filter(e=>e.category===equipCategoryFilter);
  if(!items.length)return '<p class="tiny muted">Aucun équipement ne correspond.</p>';
  return items.map(e=>{
    const catLabel=(EQUIP_CATEGORIES.find(c=>c[0]===e.category)||['','?'])[1];
    const desc=e.itemType==='weapon'
      ? `⚔ Arme · ${esc(catLabel)} · Dégâts : ${esc(e.damageFormula||'—')} · Stat : ${esc(e.weaponStat||'Force')}`
      : (()=>{const resTxt=ELEMENT_RES_KEYS.filter(k=>e.res[k]).map(k=>`${k} +${e.res[k]}%`).join(', ')||'Aucune résistance';return `🛡 Armure · ${esc(catLabel)} · CA +${e.ca||0} · DM +${e.dm||0} · ${resTxt}`;})();
    return `<div class="ability"><div class="icon">${iconBoxHtml(e,'9px')}</div><div class="ability-info"><b>${esc(e.name)}</b><small>${desc}</small></div><button class="btn" onclick="openEquipment('${e.id}')">Modifier</button><button class="btn ghost" onclick="confirmDeleteEquipment('${e.id}')" title="Supprimer">🗑️</button></div>`;
  }).join('');
}

function saveEquipment(id){
  if(!isMJ())return;
  if(!S.equipment)S.equipment=[];
  const target=id?S.equipment.find(x=>x.id===id):{id:'eq'+Date.now()};
  target.name=document.getElementById('eq_name').value||'Équipement';
  target.icon=document.getElementById('eq_icon').value||'🎽';
  target.iconImage=document.getElementById('eq_iconimage').value.trim()||null;
  target.image=document.getElementById('eq_image').value.trim()||null;
  target.itemType=document.getElementById('eq_itemtype').value;
  if(target.itemType==='weapon'){
    target.category='arme';
    target.damageFormula=document.getElementById('eq_damage').value.trim()||'1d20';
    target.weaponStat=document.getElementById('eq_weaponstat').value||'Force';
    target.ca=0; target.dm=0;
    target.res={Feu:0,Eau:0,Terre:0,Air:0,Glace:0,Foudre:0,Lumière:0,Ténèbres:0};
  }else{
    target.category=document.getElementById('eq_category').value||'torse';
    target.damageFormula='';
    target.ca=parseNum(document.getElementById('eq_ca').value);
    target.dm=parseNum(document.getElementById('eq_dm').value);
    target.res={
      Feu:parseNum(document.getElementById('eq_r_fire').value),
      Eau:parseNum(document.getElementById('eq_r_eau').value),
      Terre:parseNum(document.getElementById('eq_r_terre').value),
      Air:parseNum(document.getElementById('eq_r_air').value),
      Glace:parseNum(document.getElementById('eq_r_glace').value),
      Foudre:parseNum(document.getElementById('eq_r_foudre').value),
      Lumière:parseNum(document.getElementById('eq_r_lumiere').value),
      Ténèbres:parseNum(document.getElementById('eq_r_tenebres').value)
    };
  }
  if(!id)S.equipment.push(target);
  saveState(); closeModal(); render();
}
function confirmDeleteEquipment(id){
  if(!isMJ())return;
  if(!confirm('Supprimer cet équipement ? Il sera automatiquement déséquipé de tous les personnages.'))return;
  S.characters.forEach(c=>{if(c.equipmentSlots){EQUIP_SLOTS.forEach(([k])=>{if(c.equipmentSlots[k]===id)c.equipmentSlots[k]=null;});}});
  S.equipment=(S.equipment||[]).filter(x=>x.id!==id);
  saveState(); render();
  toast('🗑️ Équipement supprimé.');
}

    const statsLine=item.itemType==='weapon'?`⚔ Dégâts : ${esc(item.damageFormula||'—')} (s'ajoutent aux capacités liées à ${esc(item.weaponStat||'Force')})`:`CA +${item.ca||0} · DM +${item.dm||0}${resTxt?` · ${resTxt}`:''}`;

    </div>`;
  }).join(''):'';
  const abilitiesHtml=abilities.length
    ? abilities.map(a=>`<div class="ability"><div class="icon">${iconBoxHtml(a,'9px')}</div><div class="ability-info"><b>${esc(a.name)}</b><small>${esc(a.type)} · ${esc(a.formula)} · ${esc(a.element)} · Portée ${a.range?a.range+' cases':'illimitée'} · Mana ${a.manaCost||0}</small></div></div>`).join('')

    : `<p class="tiny muted">Ce personnage n'est pas actuellement sur la carte.</p>`;
  const transfoHtml=(c.transformationIds||[]).length
    ? (c.transformationIds||[]).map(tid=>char(tid)).filter(Boolean).map(t=>`<span class="pill">${iconInlineHtml(t)} ${esc(t.name)}</span>`).join(' ')

    <div class="stat" style="margin-bottom:8px"><label>Inventaire</label><div class="tiny rte-view">${c.inventory||'Vide.'}</div></div>

  const statsTabHtml=`
    <h3 style="font-size:13px;margin:0 0 8px">Sur la carte</h3>
    ${instancesHtml}
    <h3 style="font-size:13px;margin:14px 0 8px">Statistiques</h3>

    <div class="statgrid">${resHtml}</div>
    <h3 style="font-size:13px;margin:14px 0 8px">Capacités connues</h3>

    </div>
    ${tab==='bio'?bioTabHtml:statsTabHtml}
  </div>`;
}

/* ============================= CARTES : UPLOAD, DIMENSIONNEMENT, BIBLIOTHÈQUE ============================= */
const MAPS_BUCKET='JDR';
function handleIconDrop(ev,hiddenId,previewId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  if(!isMJ())return;
  const files=ev.dataTransfer.files;
  if(!files||!files.length)return;
  const file=files[0];
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
function handleIconFileInput(ev,hiddenId,previewId){
  if(!isMJ())return;
  const file=ev.target.files[0]; if(!file)return;
  if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ toast('⚠️ Format non supporté (PNG, JPG, WebP uniquement).'); return; }
  uploadIconImage(file,hiddenId,previewId);
}
async function uploadIconImage(file,hiddenId,previewId){
  toast('⏳ Envoi de l’icône…');
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath=`icon_${Date.now()}_${safeName}`;
    const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
    if(upErr){ toast('❌ Échec de l’envoi : '+upErr.message); return; }
    const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
    const hidden=document.getElementById(hiddenId); if(hidden)hidden.value=pub.publicUrl;
    const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<img src="${esc(pub.publicUrl)}">`;
    toast('✅ Icône envoyée.');
  }catch(e){ console.error('uploadIconImage',e); toast('❌ Erreur lors de l’envoi de l’icône.'); }
}
function clearIconImage(hiddenId,previewId,fallbackEmoji){
  const hidden=document.getElementById(hiddenId); if(hidden)hidden.value='';
  const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<span>${esc(fallbackEmoji||'❓')}</span>`;
}
function collectAllIconImages(){
  const set=new Set();
  S.characters.forEach(c=>{if(c.iconImage)set.add(c.iconImage);});
  S.abilities.forEach(a=>{if(a.iconImage)set.add(a.iconImage);});
  (S.equipment||[]).forEach(e=>{if(e.iconImage)set.add(e.iconImage);});
  return [...set];
}
function iconGalleryHtml(hiddenId,previewId){
  const imgs=collectAllIconImages();
  if(!imgs.length)return '';
  return `<div class="tiny muted" style="margin-top:8px">Ou choisis une icône déjà utilisée ailleurs :</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${imgs.map(u=>`<img src="${esc(u)}" onclick="selectExistingIcon('${esc(u)}','${hiddenId}','${previewId}')" style="width:36px;height:36px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #3a3e48">`).join('')}</div>`;
}
function selectExistingIcon(url,hiddenId,previewId){
  const hidden=document.getElementById(hiddenId); if(hidden)hidden.value=url;
  const preview=document.getElementById(previewId); if(preview)preview.innerHTML=`<img src="${esc(url)}">`;
}
let mapLibrary=[];       // [{id,storagePath,url,displayName,categoryId}]
let mapCategories=[];    // [{id,name,parent_id}]
let currentMapCategory=null; // catégorie actuellement parcourue (null = racine)
let mapSearchQuery='';

function loadImageDimensions(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight});
    img.onerror=()=>reject(new Error('image illisible'));
    img.src=src;
  });
}
function openMapSizeModal(onConfirm){
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>🗺️ Dimensionner la carte</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  <p class="tiny muted">Combien de cases de large fait cette carte (colonnes) ? Le nombre de lignes sera calculé automatiquement pour respecter les proportions de l'image, sans la déformer.</p>
  <div class="field"><label>Colonnes</label><input id="map_cols_input" type="number" min="2" max="60" value="${S.map.cols||20}"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="map_cols_confirm">Valider</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('map_cols_confirm').onclick=()=>{
    const cols=Math.max(2,Math.min(60,parseInt(document.getElementById('map_cols_input').value,10)||20));
    closeModal();
    onConfirm(cols);
  };
}
function applyMapBackground(cols,publicUrl,naturalW,naturalH){
  const rows=Math.max(2,Math.round(cols*naturalH/naturalW));
  S.map.cols=cols; S.map.rows=rows; S.map.backgroundImage=publicUrl;
  mapZoom=1; mapPan={x:0,y:0};
  addLog(`🗺️ Le MJ a changé le fond de carte (${cols}×${rows} cases).`);
  saveState(); render();
  toast(`🗺️ Carte mise à jour (${cols}×${rows} cases).`);
}
function handleMapImageFile(file){
  const objectUrl=URL.createObjectURL(file);
  loadImageDimensions(objectUrl).then(dims=>{
    openMapSizeModal(async cols=>{
      toast('⏳ Envoi de la carte en cours…');
      try{
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const filePath=`map_${Date.now()}_${safeName}`;
        const { error:upErr } = await supabaseClient.storage.from(MAPS_BUCKET).upload(filePath,file,{cacheControl:'3600',upsert:false});
        if(upErr){ toast('❌ Échec de l\'envoi : '+upErr.message); return; }
        const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(filePath);
        const niceName=file.name.replace(/\.[^.]+$/,'');
        const { error:metaErr } = await supabaseClient.from('map_library').insert({storage_path:filePath,display_name:niceName,category_id:currentMapCategory});
        if(metaErr)console.error('map_library insert',metaErr);
        applyMapBackground(cols,pub.publicUrl,dims.w,dims.h);
        await loadMapLibrary(); render();
      }catch(e){ console.error('handleMapImageFile',e); toast('❌ Erreur lors de l\'envoi de la carte.'); }
      finally{ URL.revokeObjectURL(objectUrl); }
    });
  }).catch(()=>{ toast('⚠️ Impossible de lire cette image.'); URL.revokeObjectURL(objectUrl); });
}
function handleMapImageUrl(url){
  loadImageDimensions(url).then(dims=>{
    openMapSizeModal(cols=>applyMapBackground(cols,url,dims.w,dims.h));
  }).catch(()=>toast('⚠️ Impossible de charger cette image.'));
}
async function loadMapCategories(){
  try{
    const { data, error } = await supabaseClient.from('map_categories').select('*');
    if(!error) mapCategories=data||[];

async function loadMapLibrary(){
  try{
    const [{data:files,error:filesErr},{data:meta,error:metaErr}] = await Promise.all([
      supabaseClient.storage.from(MAPS_BUCKET).list('',{limit:200,sortBy:{column:'created_at',order:'desc'}}),
      supabaseClient.from('map_library').select('*')
    ]);
    if(filesErr){ console.error('loadMapLibrary(storage)',filesErr); return; }
    if(metaErr) console.error('loadMapLibrary(meta)',metaErr);
    const metaByPath={};
    (meta||[]).forEach(m=>metaByPath[m.storage_path]=m);
    const validFiles=(files||[]).filter(f=>f.name && !f.name.startsWith('.'));
    // Rattrapage : des cartes envoyées avant la mise en place des catégories n'ont pas encore de métadonnées.
    const orphans=validFiles.filter(f=>!metaByPath[f.name]);
    if(orphans.length && isMJ()){
      for(const f of orphans){
        try{
          const { data:inserted, error:insErr } = await supabaseClient.from('map_library').insert({storage_path:f.name,display_name:f.name,category_id:null}).select().single();
          if(!insErr && inserted) metaByPath[f.name]=inserted;
        }catch(e){ console.error('backfill map_library',e); }
      }
    }
    mapLibrary=validFiles.map(f=>{
      const { data:pub } = supabaseClient.storage.from(MAPS_BUCKET).getPublicUrl(f.name);
      const m=metaByPath[f.name];
      return { id:m?.id||null, storagePath:f.name, url:pub.publicUrl, displayName:m?.display_name||f.name, categoryId:m?.category_id||null };
    });
  }catch(e){ console.error('loadMapLibrary',e); }
}

function descendantCategoryIds(rootId){
  const ids=[rootId];
  let frontier=[rootId];
  while(frontier.length){
    const children=mapCategories.filter(c=>frontier.includes(c.parent_id)).map(c=>c.id);
    ids.push(...children);
    frontier=children;
  }
  return ids;
}
function confirmDeleteCategory(id){
  if(!isMJ())return;
  const cat=mapCategories.find(x=>x.id===id); if(!cat)return;
  const ids=descendantCategoryIds(id);
  const affectedMaps=mapLibrary.filter(m=>ids.includes(m.categoryId));
  const subCount=ids.length-1;
  const warning=(affectedMaps.length||subCount)
    ? `Ce dossier contient ${subCount>0?`${subCount} sous-dossier(s) et `:''}${affectedMaps.length} carte(s). Les supprimer effacera <b>définitivement</b> ces cartes (fichier et fiche) de la base de données — cette action est irréversible.`
    : `Ce dossier est vide.`;
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>⚠️ Supprimer « ${esc(cat.name)} »</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>

  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn" style="background:var(--danger);border-color:var(--danger)" id="cat_delete_confirm">Supprimer</button></div>`;

}
async function deleteCategory(id,descendantIds,affectedMaps){
  if(!isMJ())return;
  toast('⏳ Suppression en cours…');
  try{
    if(affectedMaps.length){
      const paths=affectedMaps.map(m=>m.storagePath).filter(Boolean);
      if(paths.length){
        const { error:storErr } = await supabaseClient.storage.from(MAPS_BUCKET).remove(paths);
        if(storErr) console.error('remove storage files',storErr);
      }
      const mapIds=affectedMaps.map(m=>m.id).filter(Boolean);
      if(mapIds.length){
        const { error:delMapsErr } = await supabaseClient.from('map_library').delete().in('id',mapIds);
        if(delMapsErr) console.error('delete map_library rows',delMapsErr);
      }
    }
    const { error:delCatErr } = await supabaseClient.from('map_categories').delete().eq('id',id);
    if(delCatErr){ toast('❌ '+delCatErr.message); return; }
    const subIds=descendantIds.filter(i=>i!==id);
    if(subIds.length){
      const { error:delSubErr } = await supabaseClient.from('map_categories').delete().in('id',subIds);
      if(delSubErr) console.error('delete descendant categories',delSubErr);
    }
  }catch(e){ console.error('deleteCategory',e); toast('❌ Erreur lors de la suppression.'); return; }
  closeModal();
  if(currentMapCategory && descendantIds.includes(currentMapCategory)) currentMapCategory=null;
  await Promise.all([loadMapCategories(),loadMapLibrary()]);
  render();
  toast('🗑️ Dossier supprimé.');
}

  if(!isMJ())return;
  const n=id?(S.notes||[]).find(x=>x.id===id):{id:'n'+Date.now(),title:'',text:'',image:null,categoryId:currentNoteCategory};
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>${id?'Modifier':'Nouvelle'} note</h2><div class="row" style="gap:6px"><button class="btn ghost" id="noteFocusBtn" onclick="toggleNoteFocusMode()" title="N'afficher que le texte, en grand">🔎 Mode focus</button><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div></div>
  <div class="field full" id="note_title_field"><label>Titre</label><input id="note_title" value="${esc(n.title)}"></div>
  <div class="field full" id="note_text_field"><label>Texte</label>${richEditorHtml('note_text',n.text||'')}</div>
  <div class="field full" id="note_image_field">
    <label>Image (optionnelle)</label>
    <div class="icon-dropzone" onclick="document.getElementById('note_image_file').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleIconDrop(event,'note_image','note_image_preview')">
      <div id="note_image_preview" class="icon-preview">${n.image?`<img src="${esc(n.image)}">`:'<span>🖼️</span>'}</div>
      <p class="tiny muted">Glisse une image ici (PNG/JPG/WebP), ou clique pour parcourir</p>
      <input type="file" id="note_image_file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="handleIconFileInput(event,'note_image','note_image_preview')">
    </div>
    <input type="hidden" id="note_image" value="${esc(n.image||'')}">
  </div>
  <input type="hidden" id="note_category" value="${esc(n.categoryId||'')}">
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveNote('${n.id}')">Enregistrer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
}
let noteFocusMode=false;
function toggleNoteFocusMode(){
  noteFocusMode=!noteFocusMode;
  const modal=document.getElementById('modal');
  modal.classList.toggle('note-focus-mode',noteFocusMode);
  const btn=document.getElementById('noteFocusBtn');
  if(btn)btn.textContent=noteFocusMode?'✕ Quitter le focus':'🔎 Mode focus';
}
function saveNote(id){
  if(!isMJ())return;
  const title=(document.getElementById('note_title').value||'').trim()||'Sans titre';
  const text=rteHtml('note_text');
  const image=document.getElementById('note_image').value.trim()||null;
  const categoryId=document.getElementById('note_category').value||null;
  if(!S.notes)S.notes=[];
  let n=S.notes.find(x=>x.id===id);
  if(!n){n={id,categoryId};S.notes.push(n);}
  n.title=title; n.text=text; n.image=image; n.categoryId=categoryId;
  saveState(); closeModal(); render();
  toast('✅ Note enregistrée.');
}
function deleteNote(id){
  if(!isMJ())return;
  if(!confirm('Supprimer cette note ?'))return;
  S.notes=(S.notes||[]).filter(x=>x.id!==id);
  saveState(); render();
}
function showNoteToPlayers(id){
  if(!isMJ())return;
  const n=(S.notes||[]).find(x=>x.id===id); if(!n)return;
  S.notesReveal={noteId:id,ts:Date.now()};
  addLog(`📝 Le MJ montre la note « ${esc(n.title)} » aux joueurs.`);
  saveState(); render();
  toast('👁 Note affichée à tous les joueurs.');
}
function checkNotesReveal(){
  if(S.notesReveal && S.notesReveal.ts!==lastShownNotesReveal){
    lastShownNotesReveal=S.notesReveal.ts;
    const n=(S.notes||[]).find(x=>x.id===S.notesReveal.noteId);
    if(n)openNoteViewModal(n);
  }
}
function openNoteViewModal(n){
  document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>📝 ${esc(n.title)}</h2><button class="modal-close" onclick="closeModal()" title="Fermer">✕</button></div>
  ${n.image?`<img src="${esc(n.image)}" style="width:100%;border-radius:10px;margin-bottom:12px">`:''}
  <div class="rte-view">${n.text||''}</div>
  <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fermer</button></div>`;
  document.getElementById('modalBg').classList.add('open');
}

/* ============================= PLEIN ÉCRAN ============================= */
/* ============================= GRILLE : OPACITÉ ET AFFICHAGE (préférence locale, jamais synchronisée) ============================= */
function applyGridOpacity(){
  document.documentElement.style.setProperty('--grid-opacity', gridVisible?(gridOpacity/100):0);
}
function onGridOpacityInput(value){
  gridOpacity=Math.max(0,Math.min(100,parseInt(value,10)||0));
  localStorage.setItem('narbudr-grid-opacity',String(gridOpacity));
  const label=document.getElementById('gridOpacityValue');
  if(label)label.textContent=gridOpacity+'%';
  applyGridOpacity();
}
function toggleGridVisible(){
  gridVisible=!gridVisible;
  localStorage.setItem('narbudr-grid-visible',gridVisible?'1':'0');
  applyGridOpacity();
  const btn=document.getElementById('gridToggleBtn');
  if(btn)btn.innerHTML=(gridVisible?'▦':'⬜')+' Grille';
}
function toggleGridOpacityPopover(){
  gridPopoverOpen=!gridPopoverOpen;
  const pop=document.getElementById('gridOpacityPopover');
  if(pop)pop.style.display=gridPopoverOpen?'block':'none';
}
document.addEventListener('click',e=>{
  if(!gridPopoverOpen)return;
  const pop=document.getElementById('gridOpacityPopover');
  const gearBtn=e.target.closest('button[title="Réglage de l\'opacité de la grille"]');
  if(pop && !pop.contains(e.target) && !gearBtn){
    gridPopoverOpen=false;
    pop.style.display='none';
  }
});
applyGridOpacity();

function toggleFullscreen(){
  stageFullscreen=!stageFullscreen;
  document.body.classList.toggle('stage-fullscreen',stageFullscreen);
  if(stageFullscreen)document.documentElement.requestFullscreen?.().catch(()=>{});
  else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  render();
}
function exitStageFullscreen(){
  if(!stageFullscreen)return;
  stageFullscreen=false;
  document.body.classList.remove('stage-fullscreen');
  if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  render();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&stageFullscreen){stageFullscreen=false;document.body.classList.remove('stage-fullscreen');render();}
});

/* ============================= RACCOURCIS CLAVIER ============================= */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(stageFullscreen){exitStageFullscreen();return;}
    if(activeAbility){activeAbility=null;hoverCell=null;render();return;}
    if(multiSel.length){multiSel=[];render();return;}
  }
  if(e.key==='Delete'&&(selectedToken||multiSel.length)&&!activeAbility){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
    if(multiSel.length){
      if(!isMJ()||S.combat.active)return;
      const n=multiSel.length;
      multiSel.forEach(id=>removeInstance(id));
      multiSel=[];
      addLog(`🗑 Le MJ retire ${n} tokens de la carte.`);
      saveState();render();toast(`🗑 ${n} tokens retirés`);
      return;
    }
    if(!isMJ()){toast('⛔ Seul le MJ peut retirer un token de la carte.');return;}
    const t=inst(selectedToken);
    if(t){removeInstance(selectedToken);saveState();render();toast('🗑 Token retiré de la carte');}
  }
});

/* ============================= NAVIGATION / INIT ============================= */
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{currentPage=n.dataset.page;activeAbility=null;hoverCell=null;render();});
render();
</script>
</body>
</html>
